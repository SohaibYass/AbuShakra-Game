}

/* =============================================================
   PLAYER — full left/right control, gravity, jump.
   ============================================================= */
function initPlayer() {
  player = { x: 80, y: GROUND_Y - PLAYER_H, w: PLAYER_W, h: PLAYER_H,
             vx: 0, vy: 0, slideVx: 0, onGround: true, facing: 1, walkPhase: 0,
             coyoteTimer: 0, jumpBufferTimer: 0, prevJump: false,
             swinging: false, swing: null, launchVx: 0, ropeHold: 0, mantle: null, descend: null,
             traverse: null, traverseAnim: 0, ropeCd: 0, poweredT: 0, powerupAnimT: 0,
             onPlatform: false, exhausted: false, collapsed: false, collapseTimer: 0,
             airPeakY: 0, fatalFalling: false, dying: false, dyingTimer: 0,
             throwing: false, throwTimer: 0, threw: false, throwCd: 0, prevThrow: false, prevDrink: false,
             hasHarpoon: false, harpoonAnimT: 0 };
}

// Deep-water swim (seq7): inside a waterZone Abu SWIMS — he floats at the surface
// (buoyancy), strokes left/right, holds Up to rise (and can leap out near the top) and
// Down to dive. Returns true while swimming (skips normal walk/gravity this frame).
function updateWater(dt) {
  const lvl = currentLevel();
  if (!lvl.waterZones) { player.inWater = false; return false; }
  const cx = player.x + player.w / 2;
  let z = null; for (const w of lvl.waterZones) if (cx >= w.x0 && cx <= w.x1) { z = w; break; }
  if (!z) { player.inWater = false; return false; }
  const feet = player.y + player.h;
  const justEntered = !player.inWater;
  if (justEntered && feet < z.top - 4) return false;   // approaching from above land — let him reach the water first
  player.inWater = true;
  if (justEntered) Music.sfxSplash();                  // plunge in
  player.swinging = false; player.swing = null; player.mantle = null; player.descend = null; player.launchVx = 0;
  const left = anyKey(LEFT_KEYS), right = anyKey(RIGHT_KEYS), up = anyKey(JUMP_KEYS), down = anyKey(DOWN_KEYS);
  const move = (right ? 1 : 0) - (left ? 1 : 0);
  if (move) player.facing = move;
  player.vx = move * SWIM_SPEED; player.x += player.vx * dt; if (player.x < 0) player.x = 0;
  // vertical: spring toward a resting float depth (head/shoulders out), Up rises, Down dives; water damping
  const floatFeet = z.top + 38 + (down ? 80 : 0) - (up ? 70 : 0);   // resting depth: body immersed at the surface
  player.vy += (floatFeet - feet) * 10 * dt;
  player.vy *= (1 - 5 * dt);
  player.y += player.vy * dt;
  player.onGround = false; player.exhausted = false; player.collapsed = false;
  player.swimPhase = (player.swimPhase || 0) + dt * (move ? 9 : 5);
  // FX: per-stroke hand splashes (synced to the animation) + a steady rising bubble trail
  const fi = Math.floor(player.swimPhase) % 6;
  if (move && fi !== player._swimFi && (fi === 0 || fi === 3)) {
    swimSplash(player.x + player.w / 2 + player.facing * player.w * 0.75, z.top + 5);
    Music.sfxSwim();                                   // soft swish on each stroke
  }
  player._swimFi = fi;
  player._bubbleCd = (player._bubbleCd || 0) - dt;
  if (player._bubbleCd <= 0) {
    player._bubbleCd = rand(0.18, 0.36);
    swimBubbles(player.x + player.w / 2 - player.facing * player.w * 0.35, z.top + 12);
    if (Math.random() < 0.4) Music.sfxBubble();        // occasional bubble blip
  }
  return true;
}
// Rope SWING + CLIMB (Level 4): a real pendulum hung from a high rock. Jump into a
// rope to grab; hold Left/Right to pump the swing; HOLD Up to CLIMB up the rope (to
// climb above the enemies); a quick TAP of Up jumps off with a real upward leap
// (gravity brings him back to the ground). Returns true while on the rope.
function updateSwing(dt) {
  if (!ropes.length) return false;
  const upHeld = anyKey(JUMP_KEYS);
  const upPressed = upHeld && !player.prevJump;
  const upReleased = !upHeld && player.prevJump;
  const left = anyKey(LEFT_KEYS), right = anyKey(RIGHT_KEYS);

  if (player.swinging) {
    const s = player.swing;
    // Pendulum: gravity restores toward vertical; holding L/R pumps the swing.
    let alpha = -(SWING_G / s.L) * Math.sin(s.theta);
    if (right) alpha += SWING_PUMP;
    if (left)  alpha -= SWING_PUMP;
    s.omega += alpha * dt;
    s.omega -= s.omega * SWING_DAMP * dt;
    s.theta += s.omega * dt;
    if (s.theta >  SWING_MAX) { s.theta =  SWING_MAX; if (s.omega > 0) s.omega = 0; }
    if (s.theta < -SWING_MAX) { s.theta = -SWING_MAX; if (s.omega < 0) s.omega = 0; }
    if (right) player.facing = 1;          // facing follows input, not the swing
    else if (left) player.facing = -1;
    // Up: a quick tap jumps off; holding past ROPE_TAP climbs up the rope.
    if (upPressed) player.ropeHold = 0;
    if (upHeld) {
      player.ropeHold += dt;
      if (player.ropeHold > ROPE_TAP) s.L = Math.max(SWING_MIN_L, s.L - SWING_CLIMB * dt);
    }
    // Down: slide DOWN the rope (lengthen, up to the rope's full length). The only
    // way off the rope is to jump (tap Up/Space) — sliding down never drops him off.
    if (anyKey(DOWN_KEYS) && s.maxL) s.L = Math.min(s.maxL, s.L + SWING_CLIMB * dt);
    const jumpOff = upReleased && player.ropeHold <= ROPE_TAP;   // released as a quick tap
    // Leave the rope with a jump off (real upward leap + the swing's momentum).
    if (jumpOff) {
      // Constant launch speed (not s.L*s.omega) so a fast swing doesn't throw Abu
      // further — the release ANGLE still aims it, but the strength is always the same.
      const dir = (s.omega < 0) ? -1 : 1;                 // launch in the swing's direction
      player.vx = Math.cos(s.theta) * SWING_LAUNCH * dir;
      player.vy = -Math.sin(s.theta) * SWING_LAUNCH * dir - 470;
      player.launchVx = player.vx;
      player.swinging = false; player.swing = null; player.onGround = false;
      player.prevJump = upHeld;
      return false;
    }
    // Hang from the anchor at length L.
    player.x = s.ax + Math.sin(s.theta) * s.L - player.w / 2;
    player.y = s.ay + Math.cos(s.theta) * s.L;
    player.vx = 0; player.vy = 0;
    player.walkPhase += dt * (Math.abs(s.omega) + 1);
    if (invulnTimer > 0) invulnTimer -= dt;
    player.prevJump = upHeld;
    return true;
  }

  // Grab: hands near a rope's hanging span and pressing Up (or flying into it).
  const cx = player.x + player.w / 2, hy = player.y;
  if (upPressed || !player.onGround) for (const r of ropes) {
    const L = r.bottom - r.top, ax = r.x, ay = r.top;
    if (Math.abs(cx - ax) < 26 && hy > ay && hy < r.bottom + 24 && (upPressed || Math.abs(player.vx) > 30)) {
      const dx = cx - ax, dy = Math.max(SWING_MIN_L, hy - ay);
      const len = Math.min(L, Math.hypot(dx, dy));
      player.swinging = true;
      player.swing = { ax, ay, L: len, maxL: L, theta: Math.atan2(dx, dy), omega: player.vx / Math.max(40, len) };
      player.onGround = false; player.vy = 0;
      player.ropeHold = 99;   // treat the grab's held jump as a "hold" so releasing it doesn't fire a jump-off
      player.prevJump = upHeld;
      return true;
    }
  }
  return false;
}

// Horizontal traverse rope (Level 1): Abu hangs BELOW a taut rope and shimmies
// across hand-over-hand (Left/Right). Grab by stepping off the ledge onto it (or
// pressing Up while it overlaps him); Down/Jump lets go; reaching an anchor steps
// him onto the ground there. Returns true while he's on the rope.
const ROPE_TRAVERSE_SPEED = 95;   // px/s hand-over-hand
const ROPE_GRAB_V = 6;            // hands grip this far above the strand
function updateTraverse(dt) {
  const lvl = currentLevel();
  if (!lvl.climbRopes) return false;
  if (player.ropeCd > 0) player.ropeCd -= dt;
  const upHeld = anyKey(JUMP_KEYS), upPressed = upHeld && !player.prevJump;
  const down = anyKey(DOWN_KEYS), left = anyKey(LEFT_KEYS), right = anyKey(RIGHT_KEYS);
  const cx = player.x + player.w / 2;

  if (player.traverse) {
    const r = player.traverse;
    if (down || upPressed) {                              // let go: down drops, Up hops off
      player.traverse = null; player.onGround = false;
      player.vy = upPressed ? -360 : 60; player.ropeCd = 0.35; player.prevJump = upHeld;
      return false;
    }
    let mv = (right ? 1 : 0) - (left ? 1 : 0);
    if (mv) player.facing = mv;
    player.x += mv * ROPE_TRAVERSE_SPEED * dt;
    player.traverseAnim += Math.abs(mv) * dt;
    player.vx = 0; player.vy = 0; player.onGround = false;
    player.y = r.y - ROPE_GRAB_V;                         // hands grip the strand; body hangs below
    if (cx <= r.x0) {                                     // left anchor -> step onto the ledge
      player.x = r.x0 - player.w / 2; player.y = surfaceY(r.x0) - player.h;
      player.onGround = true; player.vy = 0; player.traverse = null; player.ropeCd = 0.35; player.prevJump = upHeld;
      return false;
    }
    if (cx >= r.x1) {                                     // right anchor -> drop onto the ground below
      player.x = r.x1 - player.w / 2; player.traverse = null; player.onGround = false;
      player.vy = 80; player.ropeCd = 0.35; player.prevJump = upHeld;
      return false;
    }
    if (invulnTimer > 0) invulnTimer -= dt;
    player.prevJump = upHeld;
    return true;
  }

  // Grab: the strand overlaps Abu's reach (raised arms just above his head down
  // through his body) while he's airborne over the gap, or he presses Up next to it.
  if (player.ropeCd > 0 || player.mantle || player.descend) return false;
  for (const r of lvl.climbRopes) {
    if (cx < r.x0 || cx > r.x1) continue;
    if (r.y >= player.y - 24 && r.y <= player.y + player.h && (upHeld || player.vy > 20)) {
      player.traverse = r; player.traverseAnim = 0;
      player.y = r.y - ROPE_GRAB_V; player.vx = 0; player.vy = 0; player.onGround = false;
      player.prevJump = upHeld;
      return true;
    }
  }
  return false;
}

// Ledge mantle (Level 1): hang from the caught edge, then pull up onto the platform.
function updateMantle(dt) {
  const m = player.mantle;
  m.t += dt;
  if (m.phase === "hang") {
    if (m.t >= 0.20) { m.phase = "climb"; m.t = 0; m.fromY = player.y; }
  } else {
    const k = Math.min(1, m.t / 0.40), ease = 1 - (1 - k) * (1 - k);
    player.y = m.fromY + (m.top - player.h - m.fromY) * ease;
    const tx = Math.max(m.px + 4, Math.min(m.px + m.pw - player.w - 4, player.x));
    player.x += (tx - player.x) * Math.min(1, 8 * dt);   // slide onto the deck
    if (k >= 1) {
      player.y = m.top - player.h; player.x = tx;
      player.onGround = true; player.onPlatform = true; player.vy = 0; player.mantle = null;
      drainPower(POWER_MANTLE);                          // climbing up costs stamina
      dustBurst(player.x + player.w / 2, m.top);
    }
  }
  if (invulnTimer > 0) invulnTimer -= dt;
}

// Descent rope (Level 1): climb down (Down) / up (Up) a rope hung off a platform
// edge; reach the ground to step off, or Jump / sideways to let go.
function updateDescend(dt) {
  const d = player.descend;
  const down = anyKey(DOWN_KEYS), up = anyKey(JUMP_KEYS);
  const jumpPressed = up && !player.prevJump, side = anyKey(LEFT_KEYS) || anyKey(RIGHT_KEYS);
  player.x = d.x - player.w / 2; player.vx = 0; player.vy = 0;
  if (jumpPressed || side) {                          // let go
    player.descend = null; player.onGround = false;
    if (side) { const dir = anyKey(RIGHT_KEYS) ? 1 : -1; player.facing = dir; player.x += dir * 6; }
    player.vy = jumpPressed ? -360 : -120; player.prevJump = up;
    return;
  }
  if (down) { player.y += DESCEND_SPEED * dt; drainPower(POWER_CLIMB_RATE * dt); }
  else if (up) { player.y -= DESCEND_SPEED * dt; drainPower(POWER_CLIMB_RATE * dt); }
  if (player.y + player.h <= d.top) {                 // back up to the platform deck
    player.y = d.top - player.h; player.descend = null; player.onGround = true;
  }
  if (player.y + player.h >= d.bottom) {              // reached the rope's end — drop off
    player.y = d.bottom - player.h; player.descend = null; player.onGround = false; player.vy = 80;
  }
  player.prevJump = up;
  if (invulnTimer > 0) invulnTimer -= dt;
}

// Waterfall ambience: as Abu nears a flow, the water rush swells and the music
// ducks. Distance is to the nearest point on each fall's column (top->bottom).
function updateWaterAmbience(dt) {
  const lvl = currentLevel();
  let nearest = Infinity;
  if (lvl.waterfalls) {
    const px = player.x + player.w / 2, py = player.y + player.h / 2;
    for (const wf of lvl.waterfalls) {
      const cy = Math.max(wf.yTop, Math.min(wf.yBot, py));               // closest height on the fall
      const f = (wf.yBot - wf.yTop) ? (cy - wf.yTop) / (wf.yBot - wf.yTop) : 0;
      const cx = wf.xTop + (wf.xBot - wf.xTop) * f;                      // column x at that height
      const d = Math.hypot(px - cx, py - cy);
      if (d < nearest) nearest = d;
    }
  }
  const target = nearest < WATER_DUCK_DIST ? 1 - nearest / WATER_DUCK_DIST : 0;
  waterDuck += (target - waterDuck) * Math.min(1, (target > waterDuck ? 6 : 2.5) * dt);
  Music.setWaterLevel(waterDuck);
}
function updatePlayer(dt) {
  if (player.dying) {              // death animation — play it out, then dock a life + respawn at the sequence start
    player.vx = 0; player.dyingTimer -= dt;
    if (player.dyingTimer <= 0) {
      player.dying = false; player.fatalFalling = false; player.airPeakY = player.y;
      loseLife();
      if (state !== "gameover") respawnAtSeqStart();
    }
    return;
  }
  if (updateWater(dt)) return;     // in deep water (seq7) — swim this frame
  if (updateSwing(dt)) return;     // on a rope — the pendulum handles movement this frame
  if (player.mantle) { updateMantle(dt); return; }   // climbing a platform edge
  if (player.descend) { updateDescend(dt); return; } // climbing down a descent rope
  if (updateTraverse(dt)) return;  // hanging across a horizontal traverse rope (Level 1)

  // Energy-bottle power-up: count the buff timer; freeze movement during the
  // brief drink->surge->flex transformation animation.
  if (player.poweredT > 0) player.poweredT -= dt;
  if (player.powerupAnimT > 0) player.powerupAnimT -= dt;

  let move = 0;
  if (anyKey(LEFT_KEYS)) move -= 1;
  if (anyKey(RIGHT_KEYS)) move += 1;
  if (move !== 0) player.facing = move;
  if (player.collapsed) move = 0;   // doubled over at 0 stamina — no walking this frame
  if (player.powerupAnimT > 0) move = 0;   // hold still while transforming

  // Movement is normally instant (vx = input). Two exceptions:
  //  - just launched off a rope swing: keep that horizontal momentum in the air
  //    (with light steering + decay) so the launch carries Abu forward.
  //  - on a Level-5 ice lake: velocity only eases toward input, so he slides.
  const target = move * PLAYER_SPEED * (player.exhausted ? EXHAUST_SPEED_MUL : 1);   // slower when exhausted
  if (!player.onGround && Math.abs(player.launchVx) > 5) {
    player.launchVx += move * 150 * dt;     // a little air steering
    player.launchVx *= (1 - 0.9 * dt);      // decay back toward normal control
    player.vx = player.launchVx;
  } else if (currentLevel().terrain === "natural" && player.onGround &&
             isOnIce(player.x + player.w / 2)) {
    player.launchVx = 0;
    const zone = iceZoneAt(player.x + player.w / 2);
    if (zone && zone.fwd) {
      // Forced FORWARD ice slide: always drifts right, can't stop or reverse. Jump off
      // the end onto the rope, or keep sliding into the chasm and die.
      player.facing = 1;
      player.slideVx += (PLAYER_SPEED - player.slideVx) * Math.min(1, ICE_GRIP * dt);
      if (player.slideVx < 0) player.slideVx = 0;
      player.vx = player.slideVx;
    } else {
      const grip = (move !== 0 ? ICE_GRIP : ICE_STOP_GRIP);
      player.slideVx += (target - player.slideVx) * Math.min(1, grip * dt);
      player.vx = player.slideVx;
    }
  } else {
    player.launchVx = 0;
    player.vx = target;
    player.slideVx = target;   // stay in sync so the first icy step is smooth
  }

  // Advance the walk cycle only while moving on the ground, and kick up a
  // little dust on every footfall so it reads as walking, not sliding.
  if (move !== 0 && player.onGround) {
    const prevPhase = player.walkPhase;
    player.walkPhase += dt * 9.5;
    // |sin| dips to 0 at each multiple of PI — that's a footfall.
    if (Math.floor(player.walkPhase / Math.PI) !== Math.floor(prevPhase / Math.PI)) {
      footDust(player.x + player.w / 2 - player.facing * 5, player.y + player.h);
    }
  } else if (player.onGround) {
    player.walkPhase = 0;   // reset to a neutral stance when standing still
  }

  // --- Jump feel: coyote time, jump buffering, variable height ---
  // Coyote: keep "can jump" alive briefly after walking off a ledge.
  if (player.onGround) player.coyoteTimer = COYOTE_TIME;
  else player.coyoteTimer = Math.max(0, player.coyoteTimer - dt);

  const jumpHeld     = anyKey(JUMP_KEYS);
  const jumpPressed  = jumpHeld && !player.prevJump;   // rising edge
  const jumpReleased = !jumpHeld && player.prevJump;   // falling edge
  player.prevJump = jumpHeld;

  // Buffer a fresh press so it still fires if made just before landing.
  if (jumpPressed) player.jumpBufferTimer = JUMP_BUFFER;
  else if (player.jumpBufferTimer > 0) player.jumpBufferTimer -= dt;

  if (player.jumpBufferTimer > 0 && !player.collapsed && !player.inCave && (player.onGround || player.coyoteTimer > 0)) {   // no jumping on the low-ceiling cave floor
    player.vy = JUMP_VELOCITY * (inClimb ? 1.0 : (currentLevel().jumpMul || 1));   // full hops on the summit steps
    player.onGround = false;
    if (isOnIce(player.x + player.w / 2) && Math.abs(player.slideVx) > 5) player.launchVx = player.slideVx;   // ice momentum carries into the jump (reach the rope)
    player.coyoteTimer = 0;
    player.jumpBufferTimer = 0;
    Music.sfxJump();
  }

  // Variable height: releasing the button early cuts the rise -> short hop.
  if (jumpReleased && player.vy < 0) player.vy *= JUMP_CUT;

  player.vy += GRAVITY * dt;

  updateCaveLayer();   // pick the cave lower-floor vs the arch/ground for this frame

  const natural = currentLevel().terrain === "natural";

  // --- Horizontal move ---
  const prevX = player.x;
  let nx = player.x + player.vx * dt;
  if (nx < 0) nx = 0;
  // Jump-obstacles (seq5 black lines): a steep step acts as a SOLID WALL. While
  // Abu's feet are below the ledge top he can't cross it — he must jump up. (Done
  // before the auto-step so he can't climb the interpolated slope.)
  let obstacleBlocked = false;
  const lvlJO = currentLevel().jumpObstacles;
  if (lvlJO) for (const o of lvlJO) {
    // upper-ledge top = the higher (smaller y) surface just past the step; derived
    // from surfaceY so it follows any fgYAdjust without needing a hard-coded top.
    const top = o.top != null ? o.top : Math.min(surfaceY(o.x - 14), surfaceY(o.x + 14));
    if (player.y + player.h <= top + 6) continue;     // feet at/above the ledge -> clear to pass
    const pcx = prevX + player.w / 2, ncx = nx + player.w / 2;
    if (pcx <= o.x && ncx > o.x - 4) { nx = o.x - 4 - player.w / 2; obstacleBlocked = true; }   // blocked walking up from the low side
  }
  // Natural terrain: auto-step small ledges, but a tall ledge is a wall to jump.
  if (natural && player.onGround && player.vx !== 0 && !obstacleBlocked) {
    const gs = pSurf(nx + player.w / 2);
    const rise = (player.y + player.h) - gs;     // >0: surface is above the feet
    // Climb strictness: a level may set `steepStepUp` (e.g. 3) so even a slight rise
    // blocks walking and Abu must JUMP to climb it (uphill only). Default 20px step.
    const stepUp = currentLevel().steepStepUp || TERR_STEP_UP;
    if (rise > stepUp) {
      nx = player.x;                              // too tall — blocked, must jump
    } else if (rise > -TERR_STEP_DOWN) {
      player.y = gs - player.h;                   // step up / down a small ledge
    }
    // a bigger drop is left to gravity below (walk off the ledge and fall)
  }
  player.x = nx;
  // In the cave, a left wall at the entrance: Abu drops in and exits RIGHT (where the
  // cave floor meets the surface), so he can't walk/drift left back up onto the high arch.
  if (player.inCave) { const cf = currentLevel().caveFloor; if (cf) player.x = Math.max(player.x, cf.x0 - player.w / 2); }

  // Strong wind (Level 5): a steady backward push plus gusts, stronger mid-air
  // where the player has no footing.
  if (currentLevel().wind) {
    player.x += windCurrent * (player.onGround ? 0.55 : 1.0) * dt;
    if (player.x < 0) player.x = 0;
  }

  const prevBottom = player.y + player.h;
  player.y += player.vy * dt;
  player.onGround = false;

  if (player.vy >= 0) {
    const impactVy = player.vy;                 // descending speed this frame
    const newBottom = player.y + player.h;
    for (const p of platforms) {
      if (p.solid === false) continue;   // fallen crumbling block — no landing
      const overlapX = player.x + player.w > p.x && player.x < p.x + p.w;
      if (overlapX && prevBottom <= p.y + 1 && newBottom >= p.y) {
        player.y = p.y - player.h; player.vy = 0; player.onGround = true; player.onPlatform = true;
        if (impactVy > 250) dustBurst(player.x + player.w / 2, p.y);
        break;
      }
    }
    // Level-5 crashing platforms: land normally, but stepping on a solid one starts
    // it shaking (it breaks a moment later in updateCrashPlats).
    if (!player.onGround) for (const p of crashPlats) {
      if (p.state === "gone") continue;
      const overlapX = player.x + player.w > p.x && player.x < p.x + p.w;
      if (overlapX && prevBottom <= p.y + 1 && newBottom >= p.y) {
        player.y = p.y - player.h; player.vy = 0; player.onGround = true;
        if (p.state === "solid") { p.state = "shaking"; p.timer = rand(CRASH_FALL_MIN, CRASH_FALL_MAX); }
        if (impactVy > 250) dustBurst(player.x + player.w / 2, p.y);
        break;
      }
    }
    // Land on the ground: a terrace top on natural terrain, else the flat ground
    // (solid everywhere except over a lava pit).
    if (!player.onGround) {
      const gs = inClimb ? CLIMB_FLOOR_Y : (natural ? pSurf(player.x + player.w / 2) : GROUND_Y);
      const solid = inClimb ? true : (natural ? true : groundSolidAt(player.x + player.w / 2));
      if (newBottom >= gs && solid) {
        player.y = gs - player.h; player.vy = 0; player.onGround = true;
        if (player.onPlatform) drainPower(POWER_FALL);   // dropped off a platform instead of the rope
        player.onPlatform = false;
        if (impactVy > 250) dustBurst(player.x + player.w / 2, gs);
      }
    }
  }
  // Track the last SAFE footing: grounded on real terrain that also has ground a
  // little ahead AND behind (so the respawn point is never right at a gap edge).
  if (natural && player.onGround) {
    const cx2 = player.x + player.w / 2, here = surfaceY(cx2);
    if (here < 5000 && surfaceY(cx2 + 36) < 5000 && surfaceY(cx2 - 36) < 5000) {
      lastSafeX = player.x; lastSafeFeetY = here;
    }
  }
  // Fell into a gap in the green line (no ground below) -> lose a life (unless still
  // invulnerable) and respawn on the last safe ground.
  if (natural && !inClimb && !player.dying && player.y > VOID_DEATH_Y) {
    startDeathSequence();   // death animation + sad sound, then respawn at the sequence start
  }

  // Fatal fall (Level 1 high ledges): track the airborne peak; dropping past
  // FATAL_FALL_DIST commits a lethal fall — Abu crashes and loses a life on impact.
  if (currentLevel().upperPlat && !inClimb) {
    if (player.onGround) {
      if (player.fatalFalling) startDeathSequence();
      else player.airPeakY = player.y;
    } else {
      if (player.y < player.airPeakY) player.airPeakY = player.y;
      if ((player.y - player.airPeakY) > FATAL_FALL_DIST) player.fatalFalling = true;
    }
  }

  // Ledge grab (Level 1): a short jump that catches a platform edge — Abu grabs the
  // lip and mantles up (handled by updateMantle) instead of standing on it directly.
  if (currentLevel().ledgeGrab && !inClimb && !player.onGround && !player.mantle && player.vy > -260) {
    const cx = player.x + player.w / 2, handY = player.y;
    for (const p of platforms) {
      const nearX = cx > p.x - 10 && cx < p.x + p.w + 10;
      const handsAtLip = handY >= p.y - 34 && handY <= p.y + 22;   // hands around the lip
      const feetBelow = player.y + player.h > p.y + 8;             // feet still below the top
      if (nearX && handsAtLip && feetBelow) {
        player.mantle = { px: p.x, pw: p.w, top: p.y, t: 0, phase: "hang" };
        player.vx = 0; player.vy = 0;
        player.y = p.y - 4;                                        // hands at the lip, body hanging below
        player.x = Math.max(p.x - player.w * 0.45, Math.min(p.x + p.w - player.w * 0.55, player.x));
        player.facing = (cx < p.x + p.w / 2) ? 1 : -1;            // face into the platform
        break;
      }
    }
  }

  // Descent rope (Level 1): standing on a platform edge over a rope + holding Down
  // → grab it and climb down.
  if (currentLevel().descend && !player.descend && player.onGround && anyKey(DOWN_KEYS)) {
    const cx = player.x + player.w / 2, feet = player.y + player.h;
    for (const dr of descentRopes) {
      if (Math.abs(cx - dr.x) < 22 && Math.abs(feet - dr.top) < 12 && dr.bottom - dr.top > 30) {
        player.descend = { x: dr.x, top: dr.top, bottom: dr.bottom };
        player.x = dr.x - player.w / 2; player.y = dr.top - 6; player.vy = 0; player.onGround = false; player.onPlatform = false;
        break;
      }
    }
  }

  if (invulnTimer > 0) invulnTimer -= dt;
}

function recordBest() {
  if (score > bestScore) {
    bestScore = score; newBest = true;
    try { localStorage.setItem("abushakra_best", String(bestScore)); } catch (e) {}
  }
}

function loseLife() {
  if (invulnTimer > 0) return;
  lives -= 1;
  invulnTimer = INVULN_TIME;
  addShake(11);
  if (lives <= 0) {
    lives = 0; state = "gameover"; Music.stop(); Music.sfxOver();
    recordBest();
    if (window.AbuTracking) { AbuTracking.submitLevel(currentLevel().id, false); AbuTracking.finalizeRun("game_over"); }
  } else {
    Music.sfxHurt();
  }
}

// Level-1 stamina: exertion drains it. Hitting empty does NOT cost a life or make Abu
// collapse — it just stays empty (red) and he moves slowly until he reaches a shelter / drinks.
function drainPower(amt) {
  if (!currentLevel().power) return;
  power = Math.max(0, power - amt);
}
function startCollapse() {
  player.collapsed = true; player.collapseTimer = COLLAPSE_TIME;
  player.vx = 0;
  player.descend = null; player.mantle = null;               // slip off the rope / ledge
  if (player.swinging) { player.swinging = false; player.swing = null; }
  Music.sfxHurt(); addShake(5);
}
// Hit the ground after a lethal fall: freeze, play the crash sequence, then loseLife().
function startDeathSequence() {
  if (player.dying) return;
  player.dying = true; player.dyingTimer = DEATH_SEQ_TIME; player.vx = 0; player.vy = 0;
  Music.sfxSad(); addShake(12);   // sad death sound
}
// Respawn at the START of the sequence Abu is currently in (its tile's left edge).
function respawnAtSeqStart() {
  const ftw = currentLevel().fgTileW || 1350;
  const tile = Math.floor(player.x / ftw);
  // seq1 (the first sequence) respawns at the game-start spot; later sequences at their tile start.
  let x = (tile === 0 && currentLevel().terrain === "natural") ? LEVEL1_START_X : tile * ftw + 90;
  for (let t = 0; t < 80 && surfaceY(x) >= 5000; t++) x += 12;   // skip onto solid ground if it's a gap
  player.x = x; player.vx = 0; player.vy = 0; player.onGround = true; player.inCave = false;
  player.y = surfaceY(x) - player.h; player.fatalFalling = false; player.airPeakY = player.y;
  lastSafeX = x; lastSafeFeetY = surfaceY(x);
  power = POWER_MAX; player.exhausted = false; player.collapsed = false;   // respawn with full stamina
  invulnTimer = INVULN_TIME;
}
// Recover inside a shelter; run the exhaustion/collapse state machine.
function updatePower(dt) {
  playerSheltered = false;
  const lvl = currentLevel();
  if (!lvl.power) { player.exhausted = false; player.collapsed = false; return; }
  const cx = player.x + player.w / 2, feet = player.y + player.h;
  for (const s of shelters) {
    if (cx > s.x && cx < s.x + s.w && player.onGround && Math.abs(feet - s.top) < 10) { playerSheltered = true; break; }
  }
  if (playerSheltered) power = Math.min(POWER_MAX, power + POWER_SHELTER_RATE * dt);   // slow, visible refill (campfire)
  else {
    // Moving/exerting drains; NOTHING auto-refills. Once stamina is low it STAYS low (red)
    // until a shelter or an energy drink — Abu never gets free stamina back. Low stamina
    // just slows him down (EXHAUST_SPEED_MUL), it does not make him collapse.
    const exerting = Math.abs(player.vx) > 1 || !player.onGround ||
                     player.mantle || player.descend || player.swinging || player.throwing;
    if (exerting) power = Math.max(0, power - POWER_MOVE_RATE * dt);
  }
  player.collapsed = false;
  player.exhausted = power < POWER_EXHAUST;
}

/* =============================================================
   COLLISIONS
   ============================================================= */
function handleCarabiners() {
  for (const c of carabiners) if (!c.collected && aabb(player, c)) {
    c.collected = true; score += CARABINER_POINTS; runScore += CARABINER_POINTS; levelCarabiners += 1; carabinersThisLevel += 1;  // carabiners add to the competitive score; the gate counts carabinersThisLevel separately
    if (window.AbuTracking) AbuTracking.trackCarabiner(currentLevel().id);   // online run: real pickup only (not ammo/thrown)
    sparkleBurst(c.x + c.w / 2, c.y + c.h / 2);
    Music.sfxCoin();
  }
  carabiners = carabiners.filter(c => !c.collected);
}

// Knife pickups on the Level-1 climb top ledges — each adds one throwable knife
// (ammo only; NOT a carabiner, so it doesn't count toward the gate or the score).
function handleKnifeItems() {
  for (const k of knifeItems) if (!k.collected && aabb(player, k)) {
    k.collected = true; carabinerAmmo += 1;        // +1 knife in hand (carries over between levels)
    sparkleBurst(k.x + k.w / 2, k.y + k.h / 2);
    Music.sfxCoin();
  }
  knifeItems = knifeItems.filter(k => !k.collected);
}
// Energy bottles: collect to refill stamina (Level-1 power).
function handleEnergyItems() {
  for (const e of energyItems) if (!e.collected && aabb(player, e)) {
    e.collected = true;
    energyDrinks += 1;                         // stored in the HUD — drink later with DRINK_KEYS
    sparkleBurst(e.x + e.w / 2, e.y + e.h / 2);
    Music.sfxCoin();
  }
  energyItems = energyItems.filter(e => !e.collected);
}
// Edelweiss: collect for an extra life.
function handleLifeItems() {
  for (const e of lifeItems) if (!e.collected && aabb(player, e)) {
    e.collected = true;
    lives += 1;
    sparkleBurst(e.x + e.w / 2, e.y + e.h / 2);
    Music.sfxOneUp();
  }
  lifeItems = lifeItems.filter(e => !e.collected);
}
// Speargun: collect it to fire harpoons (Throw key) while swimming.
function handleWeaponItems() {
  for (const e of weaponItems) if (!e.collected && aabb(player, e)) {
    e.collected = true; player.hasHarpoon = true;
    sparkleBurst(e.x + e.w / 2, e.y + e.h / 2);
    Music.sfxGear();
    toast = { text: "Speargun! Press F in the water", timer: 2.0 };
  }
  weaponItems = weaponItems.filter(e => !e.collected);
}
function drawWeaponItems() {
  if (!imgLoaded.harpoonGun) return;
  const img = images.harpoonGun, ratio = img.naturalWidth / img.naturalHeight;
  for (const e of weaponItems) {
    if (e.collected) continue;
    const sx = e.x - cameraX; if (sx > VIEW_W || sx + e.w < 0) continue;
    const bob = Math.sin(performance.now() / 320 + e.t) * 3, cy = e.y + bob;
    const pulse = 0.4 + 0.22 * (0.5 + 0.5 * Math.sin(performance.now() / 280 + e.t));   // pulsing yellow highlight (like gear)
    ctx.save();
    ctx.globalAlpha = pulse; ctx.fillStyle = "#ffe07a";
    ctx.beginPath(); ctx.ellipse(sx + e.w / 2, cy + e.h / 2, e.w * 0.62, e.h * 0.66, 0, 0, 6.28); ctx.fill();
    ctx.restore();
    const dw = e.w, dh = dw / ratio;
    ctx.drawImage(img, sx + (e.w - dw) / 2, cy + e.h - dh, dw, dh);
  }
}
// Drink a stored energy bottle (DRINK_KEYS): refill stamina + play the
// drink->surge->flex transformation. Edge-triggered; one bottle per press.
function updateDrink() {
  const held = anyKey(DRINK_KEYS), pressed = held && !player.prevDrink;
  player.prevDrink = held;
  if (pressed && energyDrinks > 0 && player.powerupAnimT <= 0 && !player.collapsed) {
    energyDrinks -= 1;
    power = Math.min(POWER_MAX, power + ENERGY_REFILL);
    player.powerupAnimT = POWERUP_ANIM_TIME;
    player.poweredT = POWERUP_TIME;             // 10s buffed: touching any enemy kills it
    sparkleBurst(player.x + player.w / 2, player.y + player.h / 2);
    Music.sfxGear();
  }
}

// One shoes/rope/helmet per level, on fixed reachable ground spots along the path.
const GEAR_SPAWN_X = [480, 1100, 1800];
// Pick up to 3 floating-platform tops (spread across the next few tiles, skipping
// the shelter platform) so each gear must be reached by a jump-chain + mantle.
function gearPlatformSpots(lvl, base) {
  if (!lvl.platforms) return [];
  const tw = lvl.tileW, startTile = Math.floor(base / tw), spots = [];
  for (let t = startTile; spots.length < 3 && t < startTile + 8; t++) {
    const evenTile = (((t % 2) + 2) % 2) === 0;
    for (const bx of lvl.platforms) {
      if (bx.shelter && evenTile) continue;                 // leave the cabin platform clear
      spots.push({ cx: t * tw + (bx.x0 + bx.x1) / 2, top: bx.top });
      if (spots.length >= 3) break;
    }
  }
  return spots;
}
// The descent rope nearest (and ahead of) `base`, to hang a gear at the bottom of.
function pickDescentSpot(base) {
  if (!descentRopes.length) return null;
  const ahead = descentRopes.filter(r => r.x >= base - 40).sort((a, b) => a.x - b.x);
  return ahead[0] || descentRopes.slice().sort((a, b) => a.x - b.x)[0];
}
// Top-ledge spots for the three gear: climb stacks 2 / 4 / 6 (every OTHER climb loop),
// so a knife stack sits between each gear stack (stacks 1/3/5/7+ get a knife instead).
function gearClimbSpots(lvl, base) {
  const tw = lvl.tileW; let t = Math.floor(base / tw);
  if ((((t % 2) + 2) % 2) !== 0) t++;                       // first even (climb) tile at/after base
  const L = UPPER_PLAT.ledges.find(l => l.shoes) || UPPER_PLAT.ledges[UPPER_PLAT.ledges.length - 1];
  return [0, 1, 2].map(k => ({ cx: (t + 2 + k * 4) * tw + L.cxOff, top: L.top }));   // stacks 2,4,6
}
// Gear placement. On the climb level each gear sits on the TOP ledge of its own loop
// (shoes loop 1, helmet loop 2, rope loop 3) — Abu climbs the whole stack each time —
// and a red snake guards every gear ledge. Other levels drop gear on the ground.
function spawnGearForLevel(base = 0) {
  gearItems = [];
  enemies = enemies.filter(e => !e.guard && !e.eagleGuard && !e.eagle); // clear old guards (respawned below)
  const lvl = currentLevel();
  if (lvl.knifeSpots) {   // throwable-knife pickups on specific ledges/rocks
    knifeItems = knifeItems.filter(k => !k.spotKnife);
    for (const s of lvl.knifeSpots)
      knifeItems.push({ spotKnife: true, x: s.x - KNIFE_PICK_W / 2, y: s.top - KNIFE_PICK_H - 6,
                        w: KNIFE_PICK_W, h: KNIFE_PICK_H, t: Math.random() * 6.28, collected: false });
  }
  if (lvl.energySpots) {  // energy-bottle stamina pickups
    energyItems = energyItems.filter(e => !e.spotEnergy);
    for (const s of lvl.energySpots)
      energyItems.push({ spotEnergy: true, x: s.x - ENERGY_PICK_W / 2, y: s.top - ENERGY_PICK_H,
                         w: ENERGY_PICK_W, h: ENERGY_PICK_H, t: Math.random() * 6.28, collected: false });
  }
  if (lvl.lifeSpots) {    // edelweiss — collect for +1 life
    lifeItems = lifeItems.filter(e => !e.spotLife);
    for (const s of lvl.lifeSpots)
      lifeItems.push({ spotLife: true, x: s.x - LIFE_PICK_W / 2, y: s.top - LIFE_PICK_H,
                       w: LIFE_PICK_W, h: LIFE_PICK_H, t: Math.random() * 6.28, collected: false });
  }
  if (lvl.weaponSpots && !player.hasHarpoon) {   // speargun pickup
    weaponItems = weaponItems.filter(e => !e.spotWeapon);
    for (const s of lvl.weaponSpots)
      weaponItems.push({ spotWeapon: true, x: s.x - WEAPON_PICK_W / 2, y: s.top - WEAPON_PICK_H,
                         w: WEAPON_PICK_W, h: WEAPON_PICK_H, t: Math.random() * 6.28, collected: false });
  }
  if (lvl.carabinerSpots)   // fixed carabiner pickups (rest on the surface)
    for (const s of lvl.carabinerSpots)
      carabiners.push({ x: s.x - CARABINER_W / 2, y: s.top - CARABINER_H, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
  const gearW = g => g.h * ((imgLoaded[g.asset] && images[g.asset].naturalHeight) ? images[g.asset].naturalWidth / images[g.asset].naturalHeight : 1);
  if (lvl.gearSpots) {
    // Gear on specific ledges (each red-snake guarded); any unlisted gear on the ground.
    const placed = {};
    for (const sp of lvl.gearSpots) {
      if (gearThisLevel[sp.id]) { placed[sp.id] = true; continue; }
      const g = GEAR.find(x => x.id === sp.id); if (!g) continue;
      const w = gearW(g);
      gearItems.push({ id: g.id, asset: g.asset, label: g.label, x: sp.x - w / 2, y: sp.top - g.h, w, h: g.h, t: Math.random() * 6.28 });
      if (sp.guard === "eagle") spawnGuardEagle(sp.eagleX != null ? sp.eagleX : sp.x, sp.eagleY != null ? sp.eagleY : sp.top - 46);   // flying eagle hovers above the rock (eagleX/eagleY override the anchor)
      else if (sp.guard !== false) spawnGuardSnake(sp.x, sp.top, sp.gw || 110);
      placed[sp.id] = true;
    }
    GEAR.forEach((g, i) => {   // remaining gear (e.g. helmet) on the ground so the gate stays completable
      if (placed[g.id] || gearThisLevel[g.id]) return;
      const w = gearW(g), cx = base + GEAR_SPAWN_X[i];
      gearItems.push({ id: g.id, asset: g.asset, label: g.label, x: cx - w / 2, y: surfaceY(cx) - 8 - g.h, w, h: g.h, t: Math.random() * 6.28 });
    });
    return;
  }
  if (lvl.upperPlat) {
    const spots = gearClimbSpots(lvl, base), slot = { shoes: 0, helmet: 1, rope: 2 };
    const gL = UPPER_PLAT.ledges.find(l => l.guard);
    const ledgeW = UPPER_PLAT.grassHalfW * 2 * UPPER_PLAT.scale * ((gL && gL.wMul) || 1);
    GEAR.forEach((g) => {
      if (gearThisLevel[g.id]) return;
      const sp = spots[slot[g.id]], w = gearW(g);
      gearItems.push({ id: g.id, asset: g.asset, label: g.label, x: sp.cx - w / 2, y: sp.top - g.h, w, h: g.h, t: Math.random() * 6.28 });
      spawnGuardSnake(sp.cx, sp.top, ledgeW);                // a snake guards each gear ledge
    });
    return;
  }
  GEAR.forEach((g, i) => {
    if (gearThisLevel[g.id]) return;
    const w = gearW(g), cx = base + GEAR_SPAWN_X[i];
    gearItems.push({ id: g.id, asset: g.asset, label: g.label, x: cx - w / 2, y: surfaceY(cx) - 8 - g.h, w, h: g.h, t: Math.random() * 6.28 });
  });
}
// Forgiving pickup: collect the gear, flag it, jingle + sparkle + toast.
function handleGear() {
  const pad = 8, box = { x: player.x - pad, y: player.y - pad, w: player.w + 2 * pad, h: player.h + 2 * pad };
  for (const it of gearItems) if (!it.collected && aabb(box, it)) {
    it.collected = true; gearThisLevel[it.id] = true; gearPop[it.id] = 0.45;
    if (window.AbuTracking) AbuTracking.trackGear(currentLevel().id, it.id);   // online run: once per gear type/level
    sparkleBurst(it.x + it.w / 2, it.y + it.h / 2);
    Music.sfxGear();
    toast = { text: "Found: " + it.label + "!", timer: 1.6 };
  }
  gearItems = gearItems.filter(it => !it.collected);
}
function handleHazards() {
  // Empty holes — falling in costs a life; rescue back to the near solid edge.
  const cx = player.x + player.w / 2;
  if (player.y + player.h > GROUND_Y + PIT_FALL_DEPTH) {
    for (const pit of pits) {
      if (cx > pit.x && cx < pit.x + pit.w) {
        loseLife();                            // self-guards during invulnerability
        if (state === "playing") {             // lift back onto solid ground
          player.x = Math.max(0, pit.x - player.w - 6);
          player.y = GROUND_Y - player.h; player.vy = 0; player.onGround = true;
        }
        break;
      }
    }
  }
}
function handleEnemies() {
  for (const e of enemies) {
    if (!e.alive || !aabb(player, e)) continue;
    // Energy-drink buff: touching ANY enemy instantly kills it (one-shot, even tanks).
    if (player.poweredT > 0) {
      e.alive = false; score += e.points; runScore += e.points;
      if (window.AbuTracking) AbuTracking.trackKill(currentLevel().id, e.points);
      poofBurst(e.x + e.w / 2, e.y + e.h / 2); sparkleBurst(e.x + e.w / 2, e.y + e.h / 2);
      addShake(6); Music.sfxStomp(); if (e.eagle) Music.sfxEagleHit();
      continue;
    }
    const feet = player.y + player.h;
    const stomping = player.vy > 0 && feet < e.y + e.h * 0.6;
    if (stomping) {
      player.vy = STOMP_BOUNCE; player.onGround = false;
      e.hp -= 1;
      if (e.hp <= 0) {
        e.alive = false; score += e.points; runScore += e.points;
        if (window.AbuTracking) AbuTracking.trackKill(currentLevel().id, e.points);   // online: enemy kill -> score
        poofBurst(e.x + e.w / 2, e.y + e.h / 2); addShake(5); Music.sfxStomp(); if (e.eagle) Music.sfxEagleHit();
      } else {
        // Survived (tank): flash, small poof, keep going.
        e.hitFlash = 0.3; poofBurst(e.x + e.w / 2, e.y + e.h / 2); addShake(4); Music.sfxStomp();
      }
    }
    // Any enemy touch is a death: play the death sequence (then respawn at the sequence start).
    else if (invulnTimer <= 0 && !player.dying && !playerSheltered) { if (e.eagle) Music.sfxEagleHit(); startDeathSequence(); }
  }
  enemies = enemies.filter(e => e.alive);
}

// --- Throwable carabiner attack ---------------------------------------------
// Press F: play a 3-frame throw; release a spinning carabiner at frame 2. Movement
// and gravity continue during the throw, but another can't start until it finishes.
function updateThrow(dt) {
  if (player.throwCd > 0) player.throwCd -= dt;
  if (player.harpoonAnimT > 0) player.harpoonAnimT -= dt;
  const held = anyKey(THROW_KEYS), pressed = held && !player.prevThrow;
  player.prevThrow = held;
  const busy = player.dying || player.collapsed || player.swinging || player.descend || player.mantle;
  // In the water: the speargun fires a harpoon (if collected); no knife-throwing while swimming.
  if (player.inWater) {
    if (pressed && player.hasHarpoon && player.throwCd <= 0 && !busy) {
      player.harpoonAnimT = HARPOON_ANIM_TIME; spawnHarpoon(); player.throwCd = HARPOON_CD;
    }
    return;
  }
  if (pressed && !player.throwing && player.throwCd <= 0 && carabinerAmmo > 0 && !busy) {
    player.throwing = true; player.throwTimer = 0; player.threw = false;
    carabinerAmmo -= 1;                         // each throw uses one stored carabiner
  }
  if (player.throwing) {
    player.throwTimer += dt;
    if (!player.threw && player.throwTimer >= THROW_TIME * THROW_RELEASE) { player.threw = true; spawnCarabiner(); }
    if (player.throwTimer >= THROW_TIME) { player.throwing = false; player.throwCd = THROW_COOLDOWN; }
  }
}
function spawnCarabiner() {
  const dir = player.facing >= 0 ? 1 : -1;
  const hx = player.x + player.w / 2 + dir * (player.w * 0.75);   // at the extended throwing hand
  const hy = player.y + player.h * 0.40;
  projectiles.push({ x: hx - PROJ_W / 2, y: hy - PROJ_H / 2, w: PROJ_W, h: PROJ_H, vx: PROJ_SPEED * dir, dir, angle: 0, inCave: !!player.inCave });
  Music.sfxJump();   // quick throw whoosh
}
function spawnHarpoon() {
  const dir = player.facing >= 0 ? 1 : -1;
  const hx = player.x + player.w / 2 + dir * (player.w * 0.7);
  const hy = player.y + player.h * 0.45;
  projectiles.push({ x: hx - HARPOON_W / 2, y: hy - HARPOON_H / 2, w: HARPOON_W, h: HARPOON_H, vx: HARPOON_SPEED * dir, dir, angle: 0, harpoon: true });
  sparkleBurst(hx, hy); Music.sfxStomp();   // speargun "thunk"
}
function updateProjectiles(dt) {
  const lvl = currentLevel();
  for (const pr of projectiles) {
    if (pr.dead) continue;
    pr.x += pr.vx * dt;                          // horizontal flight
    if (!pr.harpoon) pr.angle += pr.dir * 14 * dt;   // knives spin; the harpoon flies straight
    const sx = pr.x - cameraX;
    if (sx < -60 || sx > VIEW_W + 60) { pr.dead = true; continue; }   // left the screen
    const cx = pr.x + pr.w / 2, cy = pr.y + pr.h / 2;
    for (const e of enemies) {                  // enemy hit (one projectile damages once)
      if (!e.alive) continue;
      if (pr.x + pr.w > e.x && pr.x < e.x + e.w && pr.y + pr.h > e.y && pr.y < e.y + e.h) {
        e.hp -= 1;
        if (e.hp <= 0) { e.alive = false; score += e.points; runScore += e.points; if (window.AbuTracking) AbuTracking.trackKill(currentLevel().id, e.points); poofBurst(e.x + e.w / 2, e.y + e.h / 2); }
        else { e.hitFlash = 0.3; poofBurst(cx, cy); }
        sparkleBurst(cx, cy); Music.sfxStomp(); addShake(4);
        pr.dead = true; break;
      }
    }
    if (pr.dead) continue;
    if (pr.harpoon) continue;   // the harpoon flies underwater unobstructed (only dies on an enemy hit or off-screen)
    // Terrain block: knives thrown in the cave use the LOWER cave floor (not the arch
    // top above them, which would block them instantly); outside the cave range there
    // they fly on. Otherwise the normal surface (or flat ground on block levels).
    let blocked;
    if (lvl.terrain !== "natural") blocked = cy >= GROUND_Y;
    else if (pr.inCave) { const cfy = caveFloorY(cx); blocked = (cfy != null) && cy >= cfy; }
    else blocked = cy >= surfaceY(cx);
    if (!blocked) for (const p of platforms) {  // hit a solid platform
      if (p.solid === false) continue;
      if (cx > p.x && cx < p.x + p.w && cy > p.y && cy < p.y + p.h) { blocked = true; break; }
    }
    if (blocked) { poofBurst(cx, cy); pr.dead = true; }
  }
  enemies = enemies.filter(e => e.alive);
  projectiles = projectiles.filter(pr => !pr.dead);
}
function drawProjectiles() {
  for (const pr of projectiles) {
    const sx = pr.x + pr.w / 2 - cameraX, sy = pr.y + pr.h / 2;
    ctx.save();
    ctx.translate(sx, sy);
    if (pr.harpoon) {                                   // a steel spear flying straight in its direction
      if (pr.dir < 0) ctx.scale(-1, 1);
      const L = pr.w;
      ctx.strokeStyle = "#7a6248"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-L / 2, 0); ctx.lineTo(L / 2 - 8, 0); ctx.stroke();   // wooden shaft
      ctx.fillStyle = "#cfd6de"; ctx.beginPath(); ctx.moveTo(L / 2, 0); ctx.lineTo(L / 2 - 10, -5); ctx.lineTo(L / 2 - 10, 5); ctx.closePath(); ctx.fill();   // steel tip
      ctx.fillStyle = "#aeb6c2"; ctx.fillRect(L / 2 - 14, -3, 4, 6);   // barb
      ctx.restore(); continue;
    }
    ctx.rotate(pr.angle);
    if (imgLoaded.knife) { const img = images.knife, dw = 40, dh = dw * img.naturalHeight / img.naturalWidth; ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh); }
    else if (imgLoaded.carabiner) ctx.drawImage(images.carabiner, -pr.w / 2, -pr.h / 2, pr.w, pr.h);
    else { ctx.strokeStyle = "#aeb6c2"; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(0, 0, pr.w / 2 - 1, pr.h / 2 - 1, 0, 0, 6.28); ctx.stroke(); }
    ctx.restore();
  }
}

/* =============================================================
   CAMERA
   ============================================================= */
function updateCamera(dt) {
  cameraX = Math.max(0, player.x + player.w / 2 - VIEW_W * CAMERA_ANCHOR);
  // Vertical pan (Level 1): the camera follows the LEDGE Abu is standing on, not his
  // jump arc — so it pans only when he climbs to a new ledge, and stays put when he
  // just jumps in place on a ledge. The anchor updates only while he's grounded.
  let targetY = 0;
  if (currentLevel().upperPlat || currentLevel().camLift) {
    if (player.onGround) camAnchorFeet = player.y + player.h;   // remember this ledge's level
    if (camAnchorFeet < UPPER_CAM_ENGAGE) {
      // Holding Down on a high platform looks DOWN: anchor Abu near the top of the
      // view so the area below the platform is revealed.
      const lookDown = player.onGround && anyKey(DOWN_KEYS) && Math.abs(player.vx) < 1;
      targetY = Math.max(UPPER_CAM_MIN, Math.min(0, camAnchorFeet - VIEW_H * (lookDown ? 0.25 : 0.70)));
    }
  }
  cameraY += (targetY - cameraY) * Math.min(1, (dt || 0.016) * 7);
  if (Math.abs(cameraY) < 0.5) cameraY = 0;
}

/* =============================================================
   EFFECTS — particles (dust / sparkle / poof) and screen shake.
   Purely cosmetic; updated every frame regardless of game state.
   ============================================================= */
function spawnParticles(x, y, n, o) {
  for (let i = 0; i < n; i++) {
    const a = rand(o.angMin, o.angMax), sp = rand(o.spdMin, o.spdMax);
    const life = rand(o.lifeMin, o.lifeMax);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, grav: o.grav,
      life, maxLife: life, size: rand(o.sizeMin, o.sizeMax),
      color: o.colors[(Math.random() * o.colors.length) | 0]
    });
  }
}
// Tan dust kicked up on a hard landing (sprays sideways/up).
function dustBurst(x, y) {
  spawnParticles(x, y, 9, { angMin: -Math.PI, angMax: 0, spdMin: 40, spdMax: 170,
    grav: 520, lifeMin: 0.25, lifeMax: 0.5, sizeMin: 2, sizeMax: 4,
    colors: ["#d8c8a8", "#bfae8c", "#efe6d0"] });
}
// Small puff under a foot on each step (subtle — gates the "walking" read).
function footDust(x, y) {
  spawnParticles(x, y, 3, { angMin: -Math.PI * 0.85, angMax: -Math.PI * 0.15, spdMin: 18, spdMax: 64,
    grav: 480, lifeMin: 0.16, lifeMax: 0.32, sizeMin: 1.5, sizeMax: 3,
    colors: ["#d8c8a8", "#cbbf9f", "#e8dcc4"] });
}
// Steel/silver sparkle when a carabiner is clipped.
function sparkleBurst(x, y) {
  spawnParticles(x, y, 12, { angMin: 0, angMax: Math.PI * 2, spdMin: 60, spdMax: 220,
    grav: 120, lifeMin: 0.3, lifeMax: 0.6, sizeMin: 2, sizeMax: 4,
    colors: ["#e6ebf2", "#b8c0cc", "#ffffff"] });
}
// Green poof when an enemy is stomped.
function poofBurst(x, y) {
  spawnParticles(x, y, 14, { angMin: 0, angMax: Math.PI * 2, spdMin: 50, spdMax: 210,
    grav: 220, lifeMin: 0.3, lifeMax: 0.6, sizeMin: 3, sizeMax: 6,
    colors: ["#7bd36a", "#4f9e3f", "#bff2a8"] });
}
// White water splash at the swimmer's stroking hands.
function swimSplash(x, y) {
  spawnParticles(x, y, 5, { angMin: -Math.PI, angMax: 0, spdMin: 30, spdMax: 130,
    grav: 380, lifeMin: 0.2, lifeMax: 0.45, sizeMin: 1.5, sizeMax: 3.5,
    colors: ["#cfeaff", "#9fd4f5", "#ffffff"] });
}
// Rising bubbles trailing the swimmer (negative gravity -> float up).
function swimBubbles(x, y) {
  spawnParticles(x, y, 2, { angMin: -Math.PI * 0.72, angMax: -Math.PI * 0.28, spdMin: 12, spdMax: 42,
    grav: -55, lifeMin: 0.5, lifeMax: 1.0, sizeMin: 1, sizeMax: 2.6,
    colors: ["#bfe6ff", "#dff3ff", "#a8d8f0"] });
}
function addShake(mag) { if (mag > shake) shake = mag; }
// Icy shards when a crash platform cracks / breaks.
function iceCrack(x, y) {
  spawnParticles(x, y, 2, { angMin: -Math.PI, angMax: 0, spdMin: 20, spdMax: 90,
    grav: 500, lifeMin: 0.2, lifeMax: 0.4, sizeMin: 1.5, sizeMax: 3,
    colors: ["#dff2fb", "#a9d4e8", "#ffffff"] });
}
function iceBreak(x, y, w) {
  spawnParticles(x, y, 16, { angMin: 0, angMax: Math.PI, spdMin: 40, spdMax: 200,
    grav: 720, lifeMin: 0.35, lifeMax: 0.7, sizeMin: 2, sizeMax: 5,
    colors: ["#cfeaf6", "#9cc6db", "#ffffff", "#7fb4cf"] });
}

/* =============================================================
   LEVEL 5 "NIGHTMARE" SYSTEMS — ice lakes, crashing platforms, wind, snowstorm.
   All gated on per-level flags so other levels are untouched.
   ============================================================= */
// Reduced-friction zones repeat every tileW (local-x ranges in lvl.iceZones).
function iceZoneAt(worldX) {   // the absolute ice patch (Level 1) Abu is over, or null
  const lvl = currentLevel();
  if (lvl.iceSlides) for (const z of lvl.iceSlides) if (worldX >= z.x0 && worldX <= z.x1) return z;
  return null;
}
function isOnIce(worldX) {
  const lvl = currentLevel();
  if (lvl.iceSlides) for (const z of lvl.iceSlides) if (worldX >= z.x0 && worldX <= z.x1) return true;   // absolute ice patches (Level 1)
  if (!lvl.iceZones) return false;
  const tw = lvl.tileW || 675;
  const local = ((worldX % tw) + tw) % tw;
  for (const z of lvl.iceZones) if (local >= z.x0 && local <= z.x1) return true;
  return false;
}

function updateCrashPlats(dt) {
  for (const p of crashPlats) {
    if (p.state === "shaking") {
      p.timer -= dt;
      if (Math.random() < dt * 16) iceCrack(p.x + Math.random() * p.w, p.y);
      if (p.timer <= 0) { p.state = "gone"; p.goneAt = 0; iceBreak(p.x + p.w / 2, p.y, p.w); addShake(4); }
    } else if (p.state === "gone" && p.respawn) {
      p.goneAt += dt;
      if (p.goneAt >= 5) p.state = "solid";
    }
  }
}

function drawCrashPlatforms() {
  for (const p of crashPlats) {
    if (p.state === "gone") continue;
    let ox = 0, oy = 0;
    if (p.state === "shaking") { ox = (Math.random() * 2 - 1) * 1.6; oy = (Math.random() * 2 - 1) * 1.6; }
    const x = p.x - cameraX + ox, y = p.y + oy;
    if (x > VIEW_W || x + p.w < 0) continue;
    ctx.fillStyle = p.state === "shaking" ? "#bfe0ee" : "#d6eef8";
    ctx.fillRect(x, y, p.w, p.h);
    ctx.fillStyle = "#9cc6db"; ctx.fillRect(x, y + p.h - 4, p.w, 4);     // shaded underside
    ctx.fillStyle = "#ffffff"; ctx.fillRect(x, y, p.w, 3);              // snow cap
    if (p.state === "shaking") {                                        // cracks
      ctx.strokeStyle = "rgba(45,75,95,0.85)"; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x + p.w * 0.5, y);  ctx.lineTo(x + p.w * 0.42, y + p.h);
      ctx.moveTo(x + p.w * 0.25, y); ctx.lineTo(x + p.w * 0.3, y + p.h);
      ctx.moveTo(x + p.w * 0.75, y); ctx.lineTo(x + p.w * 0.68, y + p.h);
      ctx.stroke();
    }
  }
}

// Cyan frozen patches hugging the terrain surface inside each ice zone.
function drawIceLakes() {
  const lvl = currentLevel();
  if (!lvl.iceZones) return;
  const tw = lvl.tileW || 675;
  const a = Math.floor(cameraX / tw) - 1, b = Math.floor((cameraX + VIEW_W) / tw) + 1;
  for (let t = a; t <= b; t++) for (const z of lvl.iceZones) {
    const wx0 = t * tw + z.x0, wx1 = t * tw + z.x1;
    if (wx1 - cameraX < 0 || wx0 - cameraX > VIEW_W) continue;
    ctx.fillStyle = "rgba(150,225,245,0.42)";
    ctx.beginPath();
    let started = false;
    for (let wx = wx0; wx <= wx1; wx += 8) { const gx = wx - cameraX, gy = surfaceY(wx); started ? ctx.lineTo(gx, gy) : (ctx.moveTo(gx, gy), started = true); }
    for (let wx = wx1; wx >= wx0; wx -= 8) ctx.lineTo(wx - cameraX, surfaceY(wx) + 8);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let wx = wx0; wx <= wx1; wx += 8) { const gx = wx - cameraX, gy = surfaceY(wx); wx === wx0 ? ctx.moveTo(gx, gy) : ctx.lineTo(gx, gy); }
    ctx.stroke();
  }
}

function initWeather() {
  weather = [];
  if (!currentLevel().snowstorm) return;
  for (let i = 0; i < SNOW_COUNT; i++)
    weather.push({ x: Math.random() * VIEW_W, y: Math.random() * VIEW_H, z: rand(0.4, 1.5), sway: Math.random() * 6.28 });
}

function updateWeather(dt) {
  const lvl = currentLevel();
  if (lvl.wind) {
    windT += dt;
    windCurrent = WIND_BASE + Math.sin(windT * 0.6) * WIND_GUST + Math.sin(windT * 1.7) * (WIND_GUST * 0.35);
  } else windCurrent = 0;
  if (!lvl.snowstorm) return;
  for (const f of weather) {
    f.sway += dt * 2;
    f.x += (windCurrent * 0.7 * f.z + Math.sin(f.sway) * 14 - 26 * f.z) * dt;
    f.y += (90 + 70 * f.z) * dt;
    if (f.y > VIEW_H + 4) { f.y = -4; f.x = Math.random() * (VIEW_W + 40) - 20; }
    if (f.x < -10) f.x += VIEW_W + 20;
    else if (f.x > VIEW_W + 10) f.x -= VIEW_W + 20;
  }
}

function drawWeather() {
  if (!currentLevel().snowstorm) return;
  ctx.fillStyle = "rgba(255,255,255,0.10)";     // faint whiteout fog
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  for (const f of weather) { const s = Math.max(1, Math.round(f.z * 2)); ctx.fillRect(f.x | 0, f.y | 0, s, s); }
}

// Falling icicles (Level 5): a ground marker telegraphs the impact spot, then a
// spike drops from the top. Dodgeable, but a real ranged threat with the ice/wind.
function updateIcicles(dt) {
  const lvl = currentLevel();
  if (lvl.icicles) {
    icicleTimer -= dt;
    if (icicleTimer <= 0) {
      const tx = player.x + player.w / 2 + rand(-50, 340);   // threaten the path ahead
      icicles.push({ x: tx, state: "warn", timer: ICICLE_WARN, y: 0, vy: 0, w: ICICLE_W, h: ICICLE_H });
      icicleTimer = rand(ICICLE_MIN, ICICLE_MAX) / difficulty();   // more frequent as difficulty ramps
    }
  }
  for (const ic of icicles) {
    if (ic.state === "warn") {
      ic.timer -= dt;
      if (ic.timer <= 0) { ic.state = "fall"; ic.y = -ICICLE_H; ic.vy = 520; }
    } else if (ic.state === "fall") {
      ic.vy += 700 * dt; ic.y += ic.vy * dt;
      const gy = surfaceY(ic.x);
      if (aabb(player, { x: ic.x - ic.w / 2, y: ic.y, w: ic.w, h: ic.h })) {
        loseLife(); ic.state = "done"; iceBreak(ic.x, ic.y + ic.h, ic.w);   // loseLife self-guards on i-frames
      } else if (ic.y + ic.h >= gy) {
        ic.state = "done"; iceBreak(ic.x, gy, ic.w); addShake(3);
      }
    }
  }
  icicles = icicles.filter(ic => ic.state !== "done" && ic.x > cameraX - 200 && ic.x < cameraX + VIEW_W + 500);
}

function drawIcicles() {
  if (!currentLevel().icicles) return;
  const now = performance.now();
  for (const ic of icicles) {
    const sx = ic.x - cameraX;
    if (sx < -40 || sx > VIEW_W + 40) continue;
    if (ic.state === "warn") {
      const gy = surfaceY(ic.x), pulse = 0.5 + 0.5 * Math.sin(now / 70);
      ctx.globalAlpha = 0.45 + 0.45 * pulse;
      ctx.strokeStyle = "#ff5a5a"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx - 8, gy - 24); ctx.lineTo(sx, gy - 13); ctx.lineTo(sx + 8, gy - 24); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(sx, gy - 3, 10, 4, 0, 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(205,238,252,0.85)";   // glint at the top, about to drop
      ctx.beginPath(); ctx.moveTo(sx - 5, 0); ctx.lineTo(sx + 5, 0); ctx.lineTo(sx, 11); ctx.closePath(); ctx.fill();
    } else if (ic.state === "fall") {
      const grad = ctx.createLinearGradient(0, ic.y, 0, ic.y + ic.h);
      grad.addColorStop(0, "#eaf7ff"); grad.addColorStop(1, "#7fb8d6");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.moveTo(sx - ic.w / 2, ic.y); ctx.lineTo(sx + ic.w / 2, ic.y); ctx.lineTo(sx, ic.y + ic.h); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fillRect(sx - ic.w / 2 + 2, ic.y, 2, ic.h * 0.6);
    }
  }
}

// Called whenever a new level starts (test button, fresh game, or advance).
function enterLevelEffects() {
  crashPlats = []; windT = 0; windCurrent = 0;
  icicles = []; icicleTimer = rand(ICICLE_MIN, ICICLE_MAX);
  ropes = []; descentRopes = []; shelters = [];
  power = POWER_MAX; playerSheltered = false;
  player.collapsed = false; player.collapseTimer = 0; player.exhausted = false;
  player.dying = false; player.fatalFalling = false; player.dyingTimer = 0; player.airPeakY = player.y;
  if (player) { player.swinging = false; player.swing = null; player.launchVx = 0; player.descend = null; player.onPlatform = false; }
  initWeather();
}

function updateEffects(dt) {
  for (const p of particles) {
    p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  if (shake > 0) shake = Math.max(0, shake - 36 * dt);
  for (const k in gearPop) if (gearPop[k] > 0) gearPop[k] = Math.max(0, gearPop[k] - dt);
  if (toast) { toast.timer -= dt; if (toast.timer <= 0) toast = null; }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    const s = p.size | 0;
    ctx.fillRect(Math.round(p.x - cameraX - s / 2), Math.round(p.y - s / 2), s, s);
  }
  ctx.globalAlpha = 1;
}

/* =============================================================
   DRAW
   ============================================================= */
function drawBackground() {
  if (inClimb) {   // playable summit climb: Zugspitze sky + keyed rock hill + rope
    drawClimbSky();                                                  // pinned parallax (this block is already inside -cameraY)
    ctx.save(); ctx.translate(-Math.round(cameraX), 0); drawClimbHill(); drawClimbRopeWorld(); ctx.restore();
    return;
  }
  const lvl = currentLevel();
  // Natural levels: draw the painted scene(s) 1:1 so the foreground ledges line
  // up with the collision heightmap (no parallax — art and terrain stay aligned).
  if (lvl.terrain === "natural") { drawNaturalScene(); return; }
  const bgKey = lvl.bg;
  if (!imgLoaded[bgKey]) {
    const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    g.addColorStop(0, "#87b5e8"); g.addColorStop(1, "#cfe7ff");
    ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    return;
  }
  const img = images[bgKey];
  const tileW = img.naturalWidth * (VIEW_H / img.naturalHeight);
  const scroll = cameraX * BG_PARALLAX;
  // World-stable tile index of the leftmost visible copy (parity must follow
  // world position, not the screen, so tiles don't flicker as we scroll).
  const firstIndex = Math.floor(scroll / tileW);
  const bleed = 1;  // 1px overlap so no hairline gap shows at a seam
  for (let i = firstIndex; ; i++) {
    const x = i * tileW - scroll;          // screen-x of this tile's left edge
    if (x >= VIEW_W) break;
    // Mirror every other copy: a flipped tile's left edge equals the previous
    // tile's right edge, so neighbours connect into a seamless loop.
    const mirror = (((i % 2) + 2) % 2) === 1;
    ctx.save();
    if (mirror) {
      ctx.translate(x + tileW + bleed, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(img, 0, 0, tileW + bleed, VIEW_H);
    } else {
      ctx.drawImage(img, x, 0, tileW + bleed, VIEW_H);
    }
    ctx.restore();
  }
}

function drawGround() {
  // Level 1: the painted scene (drawn in drawBackground) already includes the
  // ground; collision is the invisible ZUG_SURF heightmap.
  if (currentLevel().terrain === "natural") return;
  const bandH = VIEW_H - GROUND_Y;
  if (imgLoaded.platform) {
    const img = images.platform;
    const tileW = img.naturalWidth * (bandH / img.naturalHeight);
    let startX = -(cameraX % tileW);
    if (startX > 0) startX -= tileW;
    for (let x = startX; x < VIEW_W; x += tileW) ctx.drawImage(img, x, GROUND_Y, tileW, bandH);
  } else {
    ctx.fillStyle = "#6b6660"; ctx.fillRect(0, GROUND_Y, VIEW_W, bandH);
  }
}

// Draw the painted scene(s) 1:1 so the foreground ledges sit exactly where the
// collision heightmap says. Single-image levels mirror-tile one image; multi-
// scene (`tiles`) levels lay their scenes out in repeating sequence (no mirror).
function drawNaturalScene() {
  const lvl = currentLevel();
  const bleed = 1;

  // Level 1: two parallax layers (far mountains + transparent near foreground).
  if (lvl.bgMode === "parallax") { drawParallaxScene(lvl); return; }

  if (lvl.tiles) {
    const seqW = natSeqW(lvl);
    let wx = Math.floor(cameraX / seqW) * seqW;   // start of the sequence cycle at the left edge
    while (wx - cameraX < VIEW_W) {
      for (const t of lvl.tiles) {
        const x = wx - cameraX;
        if (x + t.tileW > 0 && x < VIEW_W && imgLoaded[t.bg]) {
          const im = images[t.bg];
          ctx.drawImage(im, 0, 0, im.naturalWidth, im.naturalHeight, x, 0, t.tileW + bleed, VIEW_H);
        }
        wx += t.tileW;
        if (wx - cameraX >= VIEW_W) break;
      }
    }
    return;
  }

  if (!imgLoaded[lvl.bg]) return;
  const img = images[lvl.bg];
  const tileW = lvl.tileW || ZUG_TILE_W;
  const first = Math.floor(cameraX / tileW);
  for (let i = first; ; i++) {
    const x = i * tileW - cameraX;
    if (x >= VIEW_W) break;
    const mirror = (((i % 2) + 2) % 2) === 1;
    ctx.save();
    if (mirror) {
      ctx.translate(x + tileW + bleed, 0); ctx.scale(-1, 1);
      ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, tileW + bleed, VIEW_H);
    } else {
      ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, x, 0, tileW + bleed, VIEW_H);
    }
    ctx.restore();
  }
}

// Level 1: far mountain backdrop (slow parallax, looped) + transparent near
// foreground (1:1, the painted ledges + floating platforms) drawn on top.
function drawParallaxScene(lvl) {
  // 1) Background: fill the screen height, slow parallax, MIRROR-tiled so the
  //    distant range/clouds loop with no seam (the image isn't seamless on its
  //    own; flipping every other copy makes the edges match).
  if (imgLoaded[lvl.bg]) {
    const bg = images[lvl.bg], bw = bg.naturalWidth * (VIEW_H / bg.naturalHeight);
    const scroll = cameraX * 0.4, first = Math.floor(scroll / bw), bleed = 1;
    for (let i = first; ; i++) {
      const x = i * bw - scroll;
      if (x >= VIEW_W) break;
      const mir = (((i % 2) + 2) % 2) === 1;
      ctx.save();
      // Pin the far sky to the camera vertically so it always fills the screen during
      // the upper-ledge pan (cameraY is 0 normally, so no change).
      if (mir) {
        ctx.translate(x + bw + bleed, 0); ctx.scale(-1, 1);
        ctx.drawImage(bg, 0, 0, bg.naturalWidth, bg.naturalHeight, 0, cameraY, bw + bleed, VIEW_H);
      } else {
        ctx.drawImage(bg, 0, 0, bg.naturalWidth, bg.naturalHeight, x, cameraY, bw + bleed, VIEW_H);
      }
      ctx.restore();
    }
  }
  // 2) Foreground: 1:1, tiled normally (no mirror), transparent over the bg.
  // `fgList` (optional) draws a SEQUENCE of paintings, one per tile (part 1,
  // part 2, …, repeating) instead of a single repeating image.
  // `fgTileW` lets the foreground be drawn at its own (undistorted) width
  // without changing the collision tile width. Defaults to the collision tileW.
  {
    const list = lvl.fgList || (lvl.fg ? [lvl.fg] : []);
    if (list.length) {
      const tileW = lvl.fgTileW || lvl.tileW || ZUG_TILE_W;
      // `fgYOffset` nudges the painting DOWN so its terrain meets the screen
      // bottom and the messy bottom edge clips off-screen (no gap / fringe).
      const oy = lvl.fgYOffset || 0, ov = lvl.fgOverlay || null, n = list.length;
      const yadj = lvl.fgYAdjust || null;
      // Holes cut through the foreground (Level 1): merge the on-screen cut x-ranges
      // into non-overlapping openings (adjacent cuts join so no thin sliver remains).
      let merged = null;
      if (lvl.fgHoles && lvl.fgHoles.length) {
        const segs = [];
        for (const h of lvl.fgHoles) {
          const a = h.x0 - cameraX, b = h.x1 - cameraX;
          if (b < 0 || a > VIEW_W) continue;
          segs.push([a, b]);
        }
        if (segs.length) {
          segs.sort((p, q) => p[0] - q[0]);
          merged = [];
          for (const s of segs) {
            const last = merged[merged.length - 1];
            if (last && s[0] <= last[1] + 4) last[1] = Math.max(last[1], s[1]);   // join touching/near cuts
            else merged.push([s[0], s[1]]);
          }
        }
      }
      // With cuts: draw the foreground to an offscreen layer, then punch each opening
      // out of it — solid interior, FEATHERED vertical edges — so the painting fades
      // softly into the far vista instead of a cheap hard line. Then composite over bg.
      const FEATHER = 26;
      const fx = merged ? fgFxLayer() : null;
      const tctx = fx ? fx.getContext("2d") : ctx;
      if (fx) tctx.clearRect(0, 0, VIEW_W, VIEW_H);
      const first = Math.floor(cameraX / tileW);
      for (let i = first; ; i++) {
        const x = i * tileW - cameraX;
        if (x >= VIEW_W) break;
        const key = list[((i % n) + n) % n];
        // Per-sequence vertical nudge: shift the painting up/down by `adj` (same
        // height, so it stays aligned with the flat-offset collision).
        const adj = (yadj && yadj[key]) || 0;
        if (imgLoaded[key]) {
          const fg = images[key];
          const an = lvl.fgAnim && lvl.fgAnim[key];   // animated painting (e.g. seq7 rippling water): pick a frame from a side-by-side strip
          if (an && an.keys) {                          // animate between separate full-frame paintings
            const fk = an.keys[Math.floor(performance.now() / (1000 / an.fps)) % an.keys.length];
            const f2 = imgLoaded[fk] ? images[fk] : fg;
            tctx.drawImage(f2, 0, 0, f2.naturalWidth, f2.naturalHeight, x, oy + adj, tileW + 1, VIEW_H);
          } else if (an) {                               // animate a side-by-side frame strip
            const cw = fg.naturalWidth / an.n;
            const fi = an.frozen != null ? an.frozen : Math.floor(performance.now() / (1000 / an.fps)) % an.n;   // `frozen` pauses on one frame
            tctx.drawImage(fg, fi * cw, 0, cw, fg.naturalHeight, x, oy + adj, tileW + 1, VIEW_H);
          } else {
            tctx.drawImage(fg, 0, 0, fg.naturalWidth, fg.naturalHeight, x, oy + adj, tileW + 1, VIEW_H);
          }
        }
        // optional per-painting overlay (e.g. the anchored rope on seq 2), drawn
        // at the same dest so it aligns exactly with that painting.
        const ovKey = ov && ov[key];
        if (ovKey && imgLoaded[ovKey]) {
          const im = images[ovKey];
          tctx.drawImage(im, 0, 0, im.naturalWidth, im.naturalHeight, x, oy, tileW + 1, VIEW_H);
        }
      }
      if (fx) {
        tctx.save();
        tctx.globalCompositeOperation = "destination-out";   // erase the painting where alpha is high
        for (const m of merged) { tctx.fillStyle = "#000"; tctx.fillRect(m[0], 0, m[1] - m[0], VIEW_H); }   // hollow the openings
        // Feather ONLY the vertical-cliff (void) cuts; solid-floor cuts keep a hard edge.
        for (const h of lvl.fgHoles) {
          if (!(h.surf == null || h.surf >= 9000)) continue;   // skip solid-floor ledges
          const a = h.x0 - cameraX, b = h.x1 - cameraX;
          if (b < -FEATHER || a > VIEW_W + FEATHER) continue;
          const gL = tctx.createLinearGradient(a - FEATHER, 0, a, 0);   // left edge: kept -> gone toward the cut
          gL.addColorStop(0, "rgba(0,0,0,0)"); gL.addColorStop(1, "rgba(0,0,0,1)");
          tctx.fillStyle = gL; tctx.fillRect(a - FEATHER, 0, FEATHER, VIEW_H);
          const gR = tctx.createLinearGradient(b, 0, b + FEATHER, 0);   // right edge: gone -> kept after the cut
          gR.addColorStop(0, "rgba(0,0,0,1)"); gR.addColorStop(1, "rgba(0,0,0,0)");
          tctx.fillStyle = gR; tctx.fillRect(b, 0, FEATHER, VIEW_H);
        }
        tctx.restore();
        ctx.drawImage(fx, 0, 0);   // composite the feathered foreground over the background
      }
    }
  }
}

// Swing ropes (Level 4): a rope sprite stretched from the anchor to Abu's hands
// (tracking the swing angle), hung from a snow-capped anchor rock.
function drawRopes() {
  const sw = player.swinging ? player.swing : null;
  for (const r of ropes) {
    const ax = r.x - cameraX;
    if (ax < -160 || ax > VIEW_W + 160) continue;
    const onThis = sw && sw.ax === r.x && sw.ay === r.top;
    // Always draw the rope at its FULL length along the swing angle (Abu grips a
    // point partway down it). Drawing only to his hands made the rope visibly
    // shrink/grow as he grabbed or slid down it — a rubber-band "elastic" look.
    let ex, ey;
    if (onThis) {
      const fullL = sw.maxL || (r.bottom - r.top);
      ex = ax + Math.sin(sw.theta) * fullL;
      ey = r.top + Math.cos(sw.theta) * fullL;
    } else { ex = ax; ey = r.bottom; }
    const len = Math.max(8, Math.hypot(ex - ax, ey - r.top));
    // Per-rope art: the `alt` rope uses the silvery rope + wooden post anchor.
    const ropeKey = (r.alt && imgLoaded.rope2) ? "rope2" : "rope";
    const rockKey = (r.alt && imgLoaded.ropeRock2) ? "ropeRock2" : "ropeRock";
    if (imgLoaded[ropeKey]) {
      const ang = Math.atan2(ey - r.top, ex - ax) - Math.PI / 2;  // sprite hangs along +y
      ctx.save();
      ctx.translate(ax, r.top); ctx.rotate(ang);
      ctx.drawImage(images[ropeKey], -5, 0, 10, len);
      ctx.restore();
    } else {
      ctx.strokeStyle = "#caa15a"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(ax, r.top); ctx.lineTo(ex, ey); ctx.stroke();
    }
    // Anchor sits on the anchor point, its tie-off meeting the rope top. The wooden
    // post's tie-off knot hangs lower-right in its sprite, so it's drawn lower and
    // nudged left so the knot lands on the rope.
    if (imgLoaded[rockKey]) {
      const img = images[rockKey], rkW = 76, rkH = rkW * img.naturalHeight / img.naturalWidth;
      const drop = r.alt ? 42 : 14, shift = r.alt ? 20 : 0;
      ctx.drawImage(img, ax - rkW / 2 - shift, r.top - rkH + drop, rkW, rkH);
    } else {
      ctx.fillStyle = "#7a5a28"; ctx.fillRect(ax - 6, r.top - 4, 12, 6);
    }
  }
}

const BRIDGE_META = {

// Small traveling surface waves on the seq7 lake: a few thin sine crest lines that drift
// sideways at different speeds/depths for a layered ripple look. Pure procedural overlay.
function drawLakeWaves() {
  const lvl = currentLevel();
  if (!lvl.waterZones) return;
  const t = performance.now() / 1000;
  const LINES = [
    { d: 3,  amp: 2.0, wl: 150, spd: 1.3,  ph: 0.0, col: "rgba(226,246,255,0.55)", w: 1.6 },
    { d: 16, amp: 2.6, wl: 205, spd: -0.9, ph: 1.7, col: "rgba(193,229,250,0.40)", w: 1.4 },
    { d: 31, amp: 3.0, wl: 270, spd: 0.7,  ph: 3.1, col: "rgba(171,213,242,0.30)", w: 1.3 },
  ];
  for (const z of lvl.waterZones) {
    const x0 = Math.max(z.x0, cameraX - 4), x1 = Math.min(z.x1, cameraX + VIEW_W + 4);
    if (x1 <= x0) continue;
    for (const ln of LINES) {
      ctx.beginPath();
      for (let wx = x0; wx <= x1; wx += 6) {
        const y = z.top + ln.d + ln.amp * Math.sin(wx / ln.wl * 6.2832 + t * ln.spd + ln.ph);
        const sx = wx - cameraX;
        if (wx === x0) ctx.moveTo(sx, y); else ctx.lineTo(sx, y);
      }
      ctx.strokeStyle = ln.col; ctx.lineWidth = ln.w; ctx.stroke();
    }
  }
}
function drawBridges() {
  const lvl = currentLevel();
  if (!lvl.bridges) return;
  for (const br of lvl.bridges) {
    const m = BRIDGE_META[br.img || "woodBridge"]; if (!m || !imgLoaded[m.img]) continue;
    const img = images[m.img], scale = (br.x1 - br.x0) / (m.R - m.L);
    const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
    const dx = br.x0 - m.L * scale - cameraX, dy = br.top - m.top * scale;
    if (dx > VIEW_W || dx + dw < 0) continue;
    ctx.drawImage(img, dx, dy, dw, dh);
  }
}

// Collapsing rock ledges (Zugspitze_Collapsing_Rock_Ledge_3frames): 3 frames
// (stable / cracking / collapse), 724 px each. The flat top (src y `ty`, centre
// `tcx`, span `tx0..tx1`) lands on (x, top). If Abu stays > COLLAPSE_LINGER s it
// cracks, collapses, and drops away (then respawns).
const COLLAPSE_SCALE = 0.256;   // 0.32 * 0.8
// Per-sprite top-surface anchor (src px): (tcx,ty) lands on (x,top); tx0..tx1 = walkable width.
const COLLAPSE_SPRITES = {
  collapseLedge:  { ty: 225, tcx: 397, tx0: 168, tx1: 627, fw: 724 },   // v1: wall ledge
  collapseLedge2: { ty: 205, tcx: 315, tx0: 138, tx1: 492, fw: 724 },   // v2: floating snowy island
};
const COLLAPSE_LINGER = 5.0;   // s on the ledge before it starts to crack
const COLLAPSE_CRACK = 0.6;    // s of cracking (frame 1)
const COLLAPSE_FALL = 0.32;    // s of collapse (frame 2) before it's gone
const COLLAPSE_RESPAWN = 3.5;  // s before a fallen ledge reappears
let collapsers = [];           // runtime state of the current level's collapsing ledges

function initCollapsers() {
  const lvl = currentLevel();
  collapsers = (lvl.collapseLedges || []).map(c => ({ x: c.x, top: c.top, linger: c.linger || COLLAPSE_LINGER, vibrate: !!c.vibrate, img: c.img || "collapseLedge", scale: c.scale || 1, state: "stable", t: 0 }));
}
// Collision box of a collapse ledge's flat top (solid while stable/cracking).
function collapserBox(c) {
  const s = COLLAPSE_SCALE * (c.scale || 1), m = COLLAPSE_SPRITES[c.img] || COLLAPSE_SPRITES.collapseLedge;
  return { x: c.x - (m.tcx - m.tx0) * s, y: c.top, w: (m.tx1 - m.tx0) * s, h: 26, kind: "static", solid: true, collapser: c };
}
function updateCollapsers(dt) {
  for (const c of collapsers) {
    if (c.state === "stable") {
      const box = collapserBox(c);
      const riding = player.onGround && player.x + player.w > box.x && player.x < box.x + box.w &&
                     Math.abs((player.y + player.h) - box.y) < 4;
      if (riding) { c.t += dt; if (c.t >= c.linger) { c.state = "cracking"; c.t = 0; } }
      else c.t = Math.max(0, c.t - dt * 0.5);   // recover a little when he steps off
    } else if (c.state === "cracking") {
      c.t += dt; addShake(2);
      if (c.t >= COLLAPSE_CRACK) { c.state = "collapse"; c.t = 0; }
    } else if (c.state === "collapse") {
      c.t += dt;                                 // collision already removed -> Abu falls
      if (c.t >= COLLAPSE_FALL) { c.state = "gone"; c.t = 0; }
    } else if (c.state === "gone") {
      c.t += dt; if (c.t >= COLLAPSE_RESPAWN) { c.state = "stable"; c.t = 0; }
    }
  }
}
function drawCollapsers() {
  for (const c of collapsers) {
    if (c.state === "gone") continue;
    const key = c.img || "collapseLedge";
    if (!imgLoaded[key]) continue;
    const s = COLLAPSE_SCALE * (c.scale || 1);
    const img = images[key], m = COLLAPSE_SPRITES[key] || COLLAPSE_SPRITES.collapseLedge, fw = m.fw;
    const frame = c.state === "stable" ? 0 : c.state === "cracking" ? 1 : 2;
    let dx = c.x - m.tcx * s - cameraX, dy = c.top - m.ty * s;
    if (c.vibrate && c.state === "stable") {                         // unstable telegraph: slow wobble
      const vt = performance.now() / 1000;
      dx += Math.sin(vt * 7 + c.x) * 1.8;                            // ~1.1 Hz sway (lower = slower)
      dy += Math.sin(vt * 9 + c.x) * 1.4;
    }
    if (c.state === "cracking") dx += (Math.random() * 2 - 1) * 2;   // shudder (stronger, about to fall)
    if (dx > VIEW_W || dx + fw * s < 0) continue;
    ctx.drawImage(img, frame * fw, 0, fw, img.naturalHeight, dx, dy, fw * s, img.naturalHeight * s);
  }
}

// Anchored rope strung between two tops (rope_anchor_hill.png). Each end (x,y)

// Horizontal traverse rope (Zugspitze_Horizontal_Anchor_Rope.png, 2172x724): the
