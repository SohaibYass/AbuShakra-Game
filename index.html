<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>AbuShakra Adventure</title>

<!-- PWA: installable + offline -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1b1b25" />

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AbuShakra" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1b1b25;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
    touch-action: none;            /* no scroll/zoom gestures while playing */
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    image-rendering: pixelated;
    background: #87b5e8;
    max-width: 100vw;
    max-height: 100vh;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }

  /* Music on/off — always visible, top-right. */
  #btn-mute {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(20,22,34,0.45);
    color: #fff; font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px);
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    z-index: 10;
  }
  #btn-mute:active { transform: scale(0.92); }

  /* On-screen touch controls — hidden by default, shown on touch devices. */
  #touch-controls { display: none; }
  body.touch #touch-controls { display: block; }
  #touch-controls .btn {
    position: fixed;
    bottom: max(22px, env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center;
    width: 88px; height: 88px;
    border-radius: 50%;
    background: rgba(20,22,34,0.42);
    border: 2px solid rgba(255,255,255,0.6);
    color: #fff;
    font-size: 38px; font-weight: 700;
    text-align: center;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.06s ease, background 0.06s ease;
    cursor: pointer;
  }
  #touch-controls .btn.pressed {
    background: rgba(120,180,255,0.7);
    border-color: #fff;
    transform: scale(0.92);
  }
  #touch-controls #btn-left  { left: max(20px, env(safe-area-inset-left)); }
  #touch-controls #btn-right { left: calc(max(20px, env(safe-area-inset-left)) + 104px); }
  #touch-controls #btn-jump  {
    right: max(20px, env(safe-area-inset-right));
    width: 104px; height: 104px;
    font-size: 22px; letter-spacing: 1px;
    background: rgba(60,150,90,0.5);
  }
  #touch-controls #btn-jump.pressed { background: rgba(90,220,130,0.8); }
</style>
</head>
<body>
<canvas id="game" width="800" height="450"></canvas>
<button id="btn-mute" aria-label="Toggle music">&#128266;</button>
<div id="touch-controls">
  <div id="btn-left"  class="btn">&#9664;</div>
  <div id="btn-right" class="btn">&#9654;</div>
  <div id="btn-jump"  class="btn">JUMP</div>
</div>
<script>
"use strict";

/* =============================================================
   ASSETS — swap your image files here, all in one place.
   Missing/broken files fall back to colored shapes so the game
   never crashes.
   ============================================================= */
const ASSETS = {
  player:     "character.png",
  walk:       "character_walk.png?v=4",   // 10-frame walk-cycle sprite sheet (bump ?v on regen)
  enemy:      "enemy.png",
  platform:   "platform.png",     // generated stone tile
  carabiner:  "carabiner.png",    // climbing clip pickup
  title:      "AbuVsSnake.png?v=14",  // splash art; bump ?v on each cover update to dodge stale image caches
  // Per-level Dolomites backgrounds (see LEVELS below).
  bgZugspitze: "Zugspitze.png",
  bgLavaredo: "bgLavaredo.png",
  bgOdle:     "bgOdle.png",
  bgLatemar:  "bgLatemar.png"
};

/* =============================================================
   TUNABLE CONSTANTS — tweak difficulty / feel here.
   ============================================================= */
const VIEW_W = 800, VIEW_H = 450;

const GROUND_Y = 392;          // top surface of the continuous ground

// Level-1 "natural terrain": the playable ground is an uneven chain of rock
// LEDGES (terraces) following the Zugspitze art — you step and climb over them
// instead of walking a flat line. Rock is textured from the Zugspitze image.
const FG_SRC_TOP     = 0.80;            // image row where the foreground rock band starts (texture)
const TERR_SEG_MIN   = 78, TERR_SEG_MAX = 150;  // ledge (terrace) width
const TERR_MIN_TOP   = GROUND_Y - 104;  // highest ledge
const TERR_MAX_TOP   = GROUND_Y + 26;   // lowest dip
const TERR_STEP_UP   = 20;              // auto-climb rises up to this; taller needs a jump
const TERR_STEP_DOWN = 28;              // auto-descend small drops; bigger and you fall
const GRASS_CAP      = 8;               // grassy strip thickness on each ledge top

const GRAVITY        = 2000;   // px/s^2
const JUMP_VELOCITY  = -760;   // px/s upward impulse (jump height ~144px)
const STOMP_BOUNCE   = -520;   // px/s bounce after a stomp
const HOPPER_JUMP    = -640;   // px/s, the hopper enemy's periodic jump
const COYOTE_TIME    = 0.10;   // s after leaving a ledge you can still jump
const JUMP_BUFFER    = 0.12;   // s a jump press is remembered before landing
const JUMP_CUT       = 0.45;   // upward speed kept when jump is released early
const PLAYER_SPEED   = 280;    // px/s walk speed
const ENEMY_SPEED    = 90;     // px/s, enemies walk left
const CAMERA_ANCHOR  = 0.35;   // player kept at 35% from left of screen
const BG_PARALLAX     = 0.5;   // background scrolls at half camera speed

const CARABINER_POINTS = 10;
const STOMP_POINTS     = 50;
const START_LIVES      = 3;
const LEVEL_BONUS_LIVES = 1;   // +1 life awarded on each level advance

const ENEMY_SPAWN_MIN = 1.6, ENEMY_SPAWN_MAX = 3.2;  // seconds
const MAX_ENEMIES     = 6;

/* Three levels on real Dolomites climbing locations. Cumulative score
   milestones: one continuous run, the world swaps as your TOTAL score
   passes each target. Difficulty (enemy spawn / speed) is driven per level. */
const LEVELS = [
  { id: 1, name: "Zugspitze", bg: "bgZugspitze", target: 500,
    enemySpeedMul: 1.0, spawnMul: 1.0,
    enemyMix: ["walker", "walker", "walker", "hopper"],
    // Hazard probabilities (mover = a moving/elevator platform; pit = an empty
    // hole in the ground). Each level ramps up: L1 a gentle taste, L3 the most.
    haz: { mover: 0.00, pit: 0.00 },
    // Natural terrain: the foreground rock from the art IS the playable ground —
    // no block platforms. (Only Level 1 for now.)
    terrain: "natural" },
  { id: 2, name: "Odle Group",              bg: "bgOdle",     target: 1000,
    enemySpeedMul: 1.35, spawnMul: 0.75,
    enemyMix: ["walker", "walker", "hopper", "hopper", "flyer"],
    haz: { mover: 0.18, pit: 0.10 } },
  { id: 3, name: "Latemar Group",           bg: "bgLatemar",  target: 1500,
    enemySpeedMul: 1.7,  spawnMul: 0.55,
    enemyMix: ["walker", "hopper", "flyer", "flyer", "tank", "tank"],
    haz: { mover: 0.24, pit: 0.20 } }
];

// Elevated stone platforms (the ones you jump onto).
const PLAT_GAP_MIN   = 150, PLAT_GAP_MAX = 300;   // horizontal spacing
const PLAT_WIDTH_MIN = 96,  PLAT_WIDTH_MAX = 224;
const PLAT_RISE_MIN  = 55,  PLAT_RISE_MAX  = 130;  // height above ground (reachable)
const PLAT_THICK     = 28;

const INVULN_TIME    = 1.5;    // seconds invulnerable after a hit

// --- Hazards ---
const PIT_W_MAX      = 150;    // empty holes never wider than this (always jumpable)
const PIT_FALL_DEPTH = 20;     // px below GROUND_Y you must drop for a fall to count

// Sprite sizes (match cropped art aspect ratios).
const PLAYER_W = 30, PLAYER_H = 62;
const WALK_FRAMES = 10;  // frames in character_walk.png (one full 2-step loop)
// Each walk cell is padded (headroom + side room for body bob/rock/sway); these
// fractions must match gen_walk.py so the body draws at the standing-sprite scale.
const WALK_PAD_X = 0.119, WALK_PAD_Y = 0.120;
const ENEMY_W  = 46, ENEMY_H  = 46;
// A carabiner is taller than it is wide (art is ~140x200, ratio 0.7).
const CARABINER_W = 23, CARABINER_H = 31;

/* Enemy types. `speed` multiplies ENEMY_SPEED; `hp` is stomps-to-kill;
   `air` floats (no gravity). Sizes/points tuned so tougher = bigger reward. */
const ENEMY_TYPES = {
  walker: { w: ENEMY_W, h: ENEMY_H, speed: 1.0,  hp: 1, points: STOMP_POINTS, color: "#c0392b", air: false },
  hopper: { w: 42,      h: 42,      speed: 1.15, hp: 1, points: 70,  color: "#27ae60", air: false },
  flyer:  { w: 46,      h: 34,      speed: 1.30, hp: 1, points: 80,  color: "#8e44ad", air: true  },
  tank:   { w: 72,      h: 72,      speed: 0.55, hp: 2, points: 120, color: "#7f8c8d", air: false }
};

/* =============================================================
   ASSET LOADING
   ============================================================= */
const images = {}, imgLoaded = {};
function loadImages(cb) {
  const keys = Object.keys(ASSETS);
  let remaining = keys.length;
  if (!remaining) return cb();
  keys.forEach(key => {
    const img = new Image();
    images[key] = img; imgLoaded[key] = false;
    const done = () => { if (--remaining === 0) cb(); };
    img.onload = () => { imgLoaded[key] = img.naturalWidth > 0; done(); };
    img.onerror = () => { imgLoaded[key] = false; done(); };
    img.src = ASSETS[key];
  });
}
function drawSprite(key, x, y, w, h, color) {
  if (imgLoaded[key]) ctx.drawImage(images[key], x, y, w, h);
  else { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }
}

/* =============================================================
   CANVAS
   ============================================================= */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;
function resize() {
  const s = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
  canvas.style.width  = Math.floor(VIEW_W * s) + "px";
  canvas.style.height = Math.floor(VIEW_H * s) + "px";
}
window.addEventListener("resize", resize); resize();

/* =============================================================
   INPUT
   ============================================================= */
const keys = {};
const JUMP_KEYS = ["Space", "ArrowUp", "KeyW"];
const LEFT_KEYS = ["ArrowLeft", "KeyA"];
const RIGHT_KEYS = ["ArrowRight", "KeyD"];
window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  // Any of jump / Enter / R advances whichever non-play screen we're on.
  if (state !== "playing" && (JUMP_KEYS.includes(e.code) || e.code === "Enter" || e.code === "KeyR")) {
    advanceFromScreen();
  }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
canvas.addEventListener("mousedown", () => { if (state !== "playing") advanceFromScreen(); });
function anyKey(list) { return list.some(k => keys[k]); }

/* ---- Touch controls (phones / tablets) ---- */
const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add("touch");

/* iOS Safari ignores `user-scalable=no`, so the page can still zoom while
   playing. Block the two culprits: pinch (gesture* events) and double-tap. */
["gesturestart", "gesturechange", "gestureend"].forEach((t) =>
  document.addEventListener(t, (e) => e.preventDefault(), { passive: false })
);
let lastTouchEnd = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 320) e.preventDefault();  // suppress double-tap zoom
  lastTouchEnd = now;
}, { passive: false });

// Advance whichever non-play screen we're on (start / level-complete / won /
// game-over). Defined here; the level-flow helpers live in the LOOP section.
function advanceFromScreen() {
  if (state === "start") { state = "playing"; Music.start(); }
  else if (state === "levelcomplete") { advanceLevel(); }
  else if (state === "won" || state === "gameover") { resetGame(); Music.start(); }
}
// Start / restart the game from a tap (mirrors the click handler).
function tapAdvance() { if (state !== "playing") advanceFromScreen(); }
canvas.addEventListener("pointerdown", tapAdvance);

// Bind an on-screen button to a virtual key. Multi-touch safe; uses touch
// events with preventDefault so iOS never treats taps as zoom/scroll.
function bindButton(id, code, onPress) {
  const el = document.getElementById(id);
  if (!el) return;
  const press = (e) => {
    e.preventDefault();
    if (keys[code]) return;
    keys[code] = true; el.classList.add("pressed");
    if (onPress) onPress();
  };
  const release = (e) => {
    e.preventDefault();
    keys[code] = false; el.classList.remove("pressed");
  };
  el.addEventListener("touchstart", press,   { passive: false });
  el.addEventListener("touchend",   release, { passive: false });
  el.addEventListener("touchcancel", release, { passive: false });
  // Mouse fallback (desktop testing).
  el.addEventListener("pointerdown", press);
  el.addEventListener("pointerup", release);
  el.addEventListener("pointerleave", release);
}
bindButton("btn-left",  "ArrowLeft");
bindButton("btn-right", "ArrowRight");
bindButton("btn-jump",  "Space", tapAdvance);  // jump also starts/restarts

/* =============================================================
   MUSIC — original cheerful 8-bit loop, synthesized live with the
   Web Audio API (no audio files, no libraries). A lookahead
   scheduler queues notes slightly ahead of the clock so timing
   stays rock-solid regardless of frame rate.
   ============================================================= */
const Music = (() => {
  const NOTE = {
    E2:82.41, F2:87.31, G2:98.00, A2:110.00, B2:123.47,
    C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00, B3:246.94,
    C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
    C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, B5:987.77,
    C6:1046.50
  };
  const M = n => NOTE[n] || 0;
  // 32 eighth-notes over a I-V-vi-IV feel in C major (original melody).
  const melody = ["C5",0,"E5","G5","C6",0,"G5",0, "B4",0,"D5","G5","B5",0,"G5",0,
                  "A4",0,"C5","E5","A5",0,"E5",0, "F4",0,"A4","C5","F5",0,"C5","E5"].map(M);
  const bass   = ["C3",0,0,0,"G3",0,0,0, "G2",0,0,0,"D3",0,0,0,
                  "A2",0,0,0,"E3",0,0,0, "F2",0,0,0,"C3",0,0,0].map(M);
  const STEP = 0.15;            // seconds per eighth note
  let actx = null, master = null, enabled = true;
  let step = 0, nextTime = 0, ticker = null;

  function ensure() {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;            // very old browser -> silently no music
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.16;   // overall volume
    master.connect(actx.destination);
  }
  // iOS only starts audio from inside a user gesture. Create+resume the
  // context and play one silent sample to "unlock" it for later use.
  function unlock() {
    ensure();
    if (!actx) return;
    if (actx.state === "suspended") actx.resume();
    const b = actx.createBuffer(1, 1, 22050);
    const s = actx.createBufferSource();
    s.buffer = b; s.connect(actx.destination); s.start(0);
  }
  function blip(freq, time, dur, type, vol) {
    if (!freq) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(vol, time + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g); g.connect(master);
    o.start(time); o.stop(time + dur + 0.02);
  }
  // A note whose pitch glides from f0 to f1 — used for sound effects.
  function slide(f0, f1, time, dur, type, vol) {
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, time);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), time + dur);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(vol, time + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g); g.connect(master);
    o.start(time); o.stop(time + dur + 0.02);
  }
  const sfxReady = () => enabled && !!actx;
  function schedule() {
    if (!actx) return;
    // If the clock ran ahead of us (e.g. context was suspended while the
    // phone was locked), don't queue notes in the past — catch up cleanly.
    if (nextTime < actx.currentTime) nextTime = actx.currentTime + 0.05;
    while (nextTime < actx.currentTime + 0.12) {
      blip(melody[step], nextTime, STEP * 0.9,  "square",   0.5);
      blip(bass[step],   nextTime, STEP * 0.95, "triangle", 0.8);
      nextTime += STEP;
      step = (step + 1) % melody.length;
    }
  }
  return {
    unlock,
    // ---- Sound effects (share the unlocked context; gated by mute) ----
    sfxJump()  { if (!sfxReady()) return; slide(330, 760, actx.currentTime, 0.14, "square", 0.5); },
    sfxCoin()  { if (!sfxReady()) return; const t = actx.currentTime; blip(988, t, 0.07, "square", 0.5); blip(1319, t + 0.07, 0.12, "square", 0.5); },
    sfxStomp() { if (!sfxReady()) return; slide(440, 120, actx.currentTime, 0.16, "square", 0.6); },
    sfxHurt()  { if (!sfxReady()) return; slide(300, 80, actx.currentTime, 0.32, "sawtooth", 0.6); },
    sfxOver()  { if (!sfxReady()) return; const t = actx.currentTime; blip(523, t, 0.16, "square", 0.5); blip(392, t + 0.16, 0.16, "square", 0.5); blip(262, t + 0.32, 0.42, "square", 0.6); },
    sfxLevel() { if (!sfxReady()) return; const t = actx.currentTime; [523,659,784,1047].forEach((f, i) => blip(f, t + i * 0.09, 0.12, "square", 0.5)); },
    sfxWin()   { if (!sfxReady()) return; const t = actx.currentTime; [523,659,784,1047,784,1047,1319].forEach((f, i) => blip(f, t + i * 0.12, 0.16, "square", 0.55)); },
    start() {
      if (!enabled) return;
      ensure();
      if (!actx) return;
      if (actx.state === "suspended") actx.resume();
      if (ticker) return;                    // already playing
      step = 0; nextTime = actx.currentTime + 0.06;
      ticker = setInterval(schedule, 25);
    },
    resume() { if (actx && actx.state === "suspended") actx.resume(); },
    stop() { if (ticker) { clearInterval(ticker); ticker = null; } },
    toggle() {
      enabled = !enabled;
      if (!enabled) this.stop();
      return enabled;
    },
    get enabled() { return enabled; }
  };
})();

const muteBtn = document.getElementById("btn-mute");
function refreshMute() { muteBtn.textContent = Music.enabled ? "\u{1F50A}" : "\u{1F507}"; }
muteBtn.addEventListener("click", (e) => {
  e.preventDefault();
  const on = Music.toggle();
  if (on && state === "playing") Music.start();
  refreshMute();
});
refreshMute();

// Unlock audio on the very first user interaction (covers iOS, which only
// allows audio to begin from inside a gesture). Runs once.
function firstGestureUnlock() {
  Music.unlock();
  window.removeEventListener("pointerdown", firstGestureUnlock);
  window.removeEventListener("touchstart", firstGestureUnlock);
  window.removeEventListener("keydown", firstGestureUnlock);
}
window.addEventListener("pointerdown", firstGestureUnlock, { passive: true });
window.addEventListener("touchstart", firstGestureUnlock, { passive: true });
window.addEventListener("keydown", firstGestureUnlock);

// iOS suspends the audio context when the tab is backgrounded or the phone
// locks; resume it when we come back and the game is still in play.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state === "playing") Music.resume();
});

/* =============================================================
   STATE
   ============================================================= */
let state = "start";   // start | playing | levelcomplete | won | gameover
let score, lives, invulnTimer, enemySpawnTimer;
let player, platforms, carabiners, enemies;
let pits = [];      // empty holes in the ground {x, w}
let terrainSegments = [];   // Level-1 natural ledges {x, w, top}
let lastTerraceTop = GROUND_Y;
let cameraX, worldGenX;
let levelIndex = 0;   // index into LEVELS for the active world
let particles = [];   // cosmetic dust / sparkle / poof bits
let shake = 0;        // current screen-shake magnitude (px), decays to 0
let newBest = false;  // did this run beat the saved high score?
let bestScore = (() => {
  try { return parseInt(localStorage.getItem("abushakra_best"), 10) || 0; }
  catch (e) { return 0; }
})();
function currentLevel() { return LEVELS[levelIndex]; }
function prevTarget() { return levelIndex > 0 ? LEVELS[levelIndex - 1].target : 0; }
// Mild within-level ramp (1.0 -> ~1.6) combined with the level's own multiplier.
function difficulty() {
  return (1 + Math.min(cameraX / 6000, 0.6)) * currentLevel().enemySpeedMul;
}

function rand(a, b) { return a + Math.random() * (b - a); }
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

/* =============================================================
   ELEVATED PLATFORMS — generated ahead in world space, recycled
   once far behind the camera. The ground is a separate, always
   solid surface, so walking never drops you into a pit.
   ============================================================= */
function makePlatform(x) {
  const w = rand(PLAT_WIDTH_MIN, PLAT_WIDTH_MAX);
  const y = GROUND_Y - rand(PLAT_RISE_MIN, PLAT_RISE_MAX);
  const p = { x, y, w, h: PLAT_THICK, kind: "static", solid: true };

  const h = currentLevel().haz || {};
  const r = Math.random();
  if (h.mover && r < h.mover) {
    // Moving / elevator platform: oscillates on one axis, carries its rider.
    p.kind = "mover"; p.ox = x; p.phase = Math.random() * 6.28;
    if (Math.random() < 0.6) {
      // Vertical elevator — keep its low point a jump above the ground.
      p.axis = "y"; p.oy = GROUND_Y - rand(120, 190);
      p.amp = rand(40, 80); p.speed = rand(0.6, 1.1); p.y = p.oy;
    } else {
      p.axis = "x"; p.oy = y; p.amp = rand(50, 120); p.speed = rand(0.5, 1.0);
    }
  }

  if (p.kind === "static") addCarabinersAbove(p);   // keep clips off moving blocks
  return p;
}

function addCarabinersAbove(p) {
  if (Math.random() < 0.8) {
    const n = Math.floor(rand(1, 4));
    for (let i = 0; i < n; i++) {
      const cx = p.x + 16 + i * (CARABINER_W + 20);
      if (cx + CARABINER_W > p.x + p.w) break;
      carabiners.push({ x: cx, y: p.y - CARABINER_H - 14, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
    }
  }
}

// Maybe carve an empty hole into a gap. It's centred with solid ground either
// side and capped in width, so the gap always stays clearable with one jump.
function maybeGroundHazard(gapStart, gap) {
  const pPit = (currentLevel().haz || {}).pit || 0;
  if (pPit && Math.random() < pPit && gap > 110) {
    const pw = Math.min(PIT_W_MAX, gap - 50);
    pits.push({ x: gapStart + (gap - pw) / 2, w: pw });
  }
}

// Scatter reachable carabiners just above a terrace ledge (sometimes a jump-arc).
function maybeGroundCarabinersOn(seg) {
  const n = Math.floor(rand(1, 4));
  const arc = Math.random() < 0.5;
  const baseY = seg.top - rand(42, 80);
  for (let i = 0; i < n; i++) {
    const cx = seg.x + 14 + i * (CARABINER_W + 22);
    if (cx + CARABINER_W > seg.x + seg.w) break;
    const y = arc ? baseY - Math.sin((i + 1) / (n + 1) * Math.PI) * 40 : baseY;
    carabiners.push({ x: cx, y: y - CARABINER_H, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
  }
}

// Keep platforms / terrain generated up to a little past the right screen edge.
function generateAhead() {
  const target = cameraX + VIEW_W + 400;
  if (currentLevel().terrain === "natural") {
    // Natural terrain: a continuous chain of rock ledges at varying heights.
    while (worldGenX < target) {
      const w = rand(TERR_SEG_MIN, TERR_SEG_MAX);
      const steps = [0, 0, -18, 18, -34, 34, 0, -50, 50];   // mostly gentle, some climbs
      let nt = lastTerraceTop + steps[(Math.random() * steps.length) | 0];
      nt = Math.max(TERR_MIN_TOP, Math.min(TERR_MAX_TOP, nt));
      lastTerraceTop = nt;
      const seg = { x: worldGenX, w, top: nt };
      terrainSegments.push(seg);
      if (Math.random() < 0.5) maybeGroundCarabinersOn(seg);
      worldGenX += w;
    }
  } else {
    while (worldGenX < target) {
      const gap = rand(PLAT_GAP_MIN, PLAT_GAP_MAX);
      const gapStart = worldGenX;
      worldGenX += gap;
      maybeGroundHazard(gapStart, gap);
      platforms.push(makePlatform(worldGenX));
      worldGenX += PLAT_WIDTH_MAX; // reserve space so the next gap starts after this block
    }
  }
  // Recycle anything well behind the camera.
  const cutoff = cameraX - 300;
  platforms       = platforms.filter(p => p.x + p.w > cutoff);
  carabiners      = carabiners.filter(c => c.x + c.w > cutoff);
  pits            = pits.filter(p => p.x + p.w > cutoff);
  terrainSegments = terrainSegments.filter(s => s.x + s.w > cutoff);
}

// Ground surface height at a world-x for natural terrain (the ledge top there).
function surfaceY(worldX) {
  const segs = terrainSegments;
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i];
    if (worldX >= s.x && worldX < s.x + s.w) return s.top;
  }
  if (segs.length) return worldX < segs[0].x ? segs[0].top : segs[segs.length - 1].top;
  return GROUND_Y;
}

// True unless the given world-x sits over a lava pit (no solid floor there).
function groundSolidAt(cx) {
  for (const pit of pits) if (cx > pit.x && cx < pit.x + pit.w) return false;
  return true;
}

// Is the player currently resting on top of platform p (within a hair)?
function playerRidingOn(p) {
  return player && player.onGround &&
         player.x + player.w > p.x && player.x < p.x + p.w &&
         Math.abs((player.y + player.h) - p.y) < 3;
}

// Move moving/elevator platforms, advance crumbling blocks, and carry a rider.
// Runs BEFORE updatePlayer so landing tests see the new positions; rider
// detection uses last frame's onGround (still valid here).
function updatePlatforms(dt) {
  for (const p of platforms) {
    if (p.kind !== "mover") continue;
    p.phase += p.speed * dt;
    const off = Math.sin(p.phase) * p.amp;
    const nx = p.axis === "x" ? p.ox + off : p.ox;
    const ny = p.axis === "y" ? p.oy + off : p.oy;
    const dx = nx - p.x, dy = ny - p.y;
    p.x = nx; p.y = ny;
    if ((dx || dy) && playerRidingOn(p)) {  // carry the rider
      player.x += dx; player.y += dy;
    }
  }
}

/* =============================================================
   ENEMIES — spawn ahead, always walk left, recycle behind camera.
   ============================================================= */
function spawnEnemy() {
  if (enemies.length >= MAX_ENEMIES) return;
  const mix = currentLevel().enemyMix;
  const type = mix[(Math.random() * mix.length) | 0];
  const t = ENEMY_TYPES[type];
  const x = cameraX + VIEW_W + rand(40, 280);
  // Flyers float at a jump-reachable height; everyone else sits on the ground.
  const baseY = t.air ? GROUND_Y - t.h - rand(70, 120) : GROUND_Y - t.h;
  enemies.push({
    type, x, y: baseY, w: t.w, h: t.h, alive: true,
    speed: t.speed, hp: t.hp, points: t.points, color: t.color, air: t.air,
    vy: 0, baseY, phase: Math.random() * 6.28, jumpTimer: rand(0.3, 1.0), hitFlash: 0
  });
}
function updateEnemies(dt) {
  const d = difficulty();
  const natural = currentLevel().terrain === "natural";
  for (const e of enemies) {
    e.x -= ENEMY_SPEED * e.speed * d * dt;
    if (e.hitFlash > 0) e.hitFlash -= dt;
    const floor = natural ? surfaceY(e.x + e.w / 2) : GROUND_Y;
    if (e.type === "hopper") {
      // Gravity + a periodic hop while grounded (on the local terrain surface).
      e.vy += GRAVITY * dt; e.y += e.vy * dt;
      if (e.y + e.h >= floor) {
        e.y = floor - e.h; e.vy = 0;
        e.jumpTimer -= dt;
        if (e.jumpTimer <= 0) { e.vy = HOPPER_JUMP; e.jumpTimer = rand(0.5, 1.2); }
      }
    } else if (e.type === "flyer") {
      // Float, bobbing up and down (above the local surface on natural terrain).
      e.phase += dt * 3;
      const base = natural ? floor - e.h - 80 : e.baseY;
      e.y = base + Math.sin(e.phase) * 26;
    } else if (natural) {
      // walker & tank follow the uneven ground surface.
      e.y = floor - e.h;
    }
    // (on block levels walker & tank keep their fixed ground y.)
  }
  enemies = enemies.filter(e => e.alive && e.x + e.w > cameraX - 200);
  enemySpawnTimer -= dt;
  if (enemySpawnTimer <= 0) {
    spawnEnemy();
    // Higher levels spawn faster (smaller spawnMul); also tightens with distance.
    const ramp = 1 + Math.min(cameraX / 6000, 0.6);
    enemySpawnTimer = rand(ENEMY_SPAWN_MIN, ENEMY_SPAWN_MAX) * currentLevel().spawnMul / ramp;
  }
}

/* =============================================================
   PLAYER — full left/right control, gravity, jump.
   ============================================================= */
function initPlayer() {
  player = { x: 80, y: GROUND_Y - PLAYER_H, w: PLAYER_W, h: PLAYER_H,
             vx: 0, vy: 0, onGround: true, facing: 1, walkPhase: 0,
             coyoteTimer: 0, jumpBufferTimer: 0, prevJump: false };
}

function updatePlayer(dt) {
  let move = 0;
  if (anyKey(LEFT_KEYS)) move -= 1;
  if (anyKey(RIGHT_KEYS)) move += 1;
  player.vx = move * PLAYER_SPEED;
  if (move !== 0) player.facing = move;

  // Advance the walk cycle only while moving on the ground, and kick up a
  // little dust on every footfall so it reads as walking, not sliding.
  if (move !== 0 && player.onGround) {
    const prevPhase = player.walkPhase;
    player.walkPhase += dt * 9.5;
    // |sin| dips to 0 at each multiple of PI — that's a footfall.
    if (Math.floor(player.walkPhase / Math.PI) !== Math.floor(prevPhase / Math.PI)) {
      footDust(player.x + player.w / 2 - player.facing * 5, player.y + player.h);
    }
  } else if (player.onGround) {
    player.walkPhase = 0;   // reset to a neutral stance when standing still
  }

  // --- Jump feel: coyote time, jump buffering, variable height ---
  // Coyote: keep "can jump" alive briefly after walking off a ledge.
  if (player.onGround) player.coyoteTimer = COYOTE_TIME;
  else player.coyoteTimer = Math.max(0, player.coyoteTimer - dt);

  const jumpHeld     = anyKey(JUMP_KEYS);
  const jumpPressed  = jumpHeld && !player.prevJump;   // rising edge
  const jumpReleased = !jumpHeld && player.prevJump;   // falling edge
  player.prevJump = jumpHeld;

  // Buffer a fresh press so it still fires if made just before landing.
  if (jumpPressed) player.jumpBufferTimer = JUMP_BUFFER;
  else if (player.jumpBufferTimer > 0) player.jumpBufferTimer -= dt;

  if (player.jumpBufferTimer > 0 && (player.onGround || player.coyoteTimer > 0)) {
    player.vy = JUMP_VELOCITY;
    player.onGround = false;
    player.coyoteTimer = 0;
    player.jumpBufferTimer = 0;
    Music.sfxJump();
  }

  // Variable height: releasing the button early cuts the rise -> short hop.
  if (jumpReleased && player.vy < 0) player.vy *= JUMP_CUT;

  player.vy += GRAVITY * dt;

  const natural = currentLevel().terrain === "natural";

  // --- Horizontal move ---
  let nx = player.x + player.vx * dt;
  if (nx < 0) nx = 0;
  // Natural terrain: auto-step small ledges, but a tall ledge is a wall to jump.
  if (natural && player.onGround && player.vx !== 0) {
    const gs = surfaceY(nx + player.w / 2);
    const rise = (player.y + player.h) - gs;     // >0: surface is above the feet
    if (rise > TERR_STEP_UP) {
      nx = player.x;                              // too tall — blocked, must jump
    } else if (rise > -TERR_STEP_DOWN) {
      player.y = gs - player.h;                   // step up / down a small ledge
    }
    // a bigger drop is left to gravity below (walk off the ledge and fall)
  }
  player.x = nx;

  const prevBottom = player.y + player.h;
  player.y += player.vy * dt;
  player.onGround = false;

  if (player.vy >= 0) {
    const impactVy = player.vy;                 // descending speed this frame
    const newBottom = player.y + player.h;
    for (const p of platforms) {
      if (p.solid === false) continue;   // fallen crumbling block — no landing
      const overlapX = player.x + player.w > p.x && player.x < p.x + p.w;
      if (overlapX && prevBottom <= p.y + 1 && newBottom >= p.y) {
        player.y = p.y - player.h; player.vy = 0; player.onGround = true;
        if (impactVy > 250) dustBurst(player.x + player.w / 2, p.y);
        break;
      }
    }
    // Land on the ground: a terrace top on natural terrain, else the flat ground
    // (solid everywhere except over a lava pit).
    if (!player.onGround) {
      const gs = natural ? surfaceY(player.x + player.w / 2) : GROUND_Y;
      const solid = natural ? true : groundSolidAt(player.x + player.w / 2);
      if (newBottom >= gs && solid) {
        player.y = gs - player.h; player.vy = 0; player.onGround = true;
        if (impactVy > 250) dustBurst(player.x + player.w / 2, gs);
      }
    }
  }

  if (invulnTimer > 0) invulnTimer -= dt;
}

function recordBest() {
  if (score > bestScore) {
    bestScore = score; newBest = true;
    try { localStorage.setItem("abushakra_best", String(bestScore)); } catch (e) {}
  }
}

function loseLife() {
  if (invulnTimer > 0) return;
  lives -= 1;
  invulnTimer = INVULN_TIME;
  addShake(11);
  if (lives <= 0) {
    lives = 0; state = "gameover"; Music.stop(); Music.sfxOver();
    recordBest();
  } else {
    Music.sfxHurt();
  }
}

/* =============================================================
   COLLISIONS
   ============================================================= */
function handleCarabiners() {
  for (const c of carabiners) if (!c.collected && aabb(player, c)) {
    c.collected = true; score += CARABINER_POINTS;
    sparkleBurst(c.x + c.w / 2, c.y + c.h / 2);
    Music.sfxCoin();
  }
  carabiners = carabiners.filter(c => !c.collected);
}
function handleHazards() {
  // Empty holes — falling in costs a life; rescue back to the near solid edge.
  const cx = player.x + player.w / 2;
  if (player.y + player.h > GROUND_Y + PIT_FALL_DEPTH) {
    for (const pit of pits) {
      if (cx > pit.x && cx < pit.x + pit.w) {
        loseLife();                            // self-guards during invulnerability
        if (state === "playing") {             // lift back onto solid ground
          player.x = Math.max(0, pit.x - player.w - 6);
          player.y = GROUND_Y - player.h; player.vy = 0; player.onGround = true;
        }
        break;
      }
    }
  }
}
function handleEnemies() {
  for (const e of enemies) {
    if (!e.alive || !aabb(player, e)) continue;
    const feet = player.y + player.h;
    const stomping = player.vy > 0 && feet < e.y + e.h * 0.6;
    if (stomping) {
      player.vy = STOMP_BOUNCE; player.onGround = false;
      e.hp -= 1;
      if (e.hp <= 0) {
        e.alive = false; score += e.points;
        poofBurst(e.x + e.w / 2, e.y + e.h / 2); addShake(5); Music.sfxStomp();
      } else {
        // Survived (tank): flash, small poof, keep going.
        e.hitFlash = 0.3; poofBurst(e.x + e.w / 2, e.y + e.h / 2); addShake(4); Music.sfxStomp();
      }
    }
    else loseLife();
  }
  enemies = enemies.filter(e => e.alive);
}

/* =============================================================
   CAMERA
   ============================================================= */
function updateCamera() {
  cameraX = Math.max(0, player.x + player.w / 2 - VIEW_W * CAMERA_ANCHOR);
}

/* =============================================================
   EFFECTS — particles (dust / sparkle / poof) and screen shake.
   Purely cosmetic; updated every frame regardless of game state.
   ============================================================= */
function spawnParticles(x, y, n, o) {
  for (let i = 0; i < n; i++) {
    const a = rand(o.angMin, o.angMax), sp = rand(o.spdMin, o.spdMax);
    const life = rand(o.lifeMin, o.lifeMax);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, grav: o.grav,
      life, maxLife: life, size: rand(o.sizeMin, o.sizeMax),
      color: o.colors[(Math.random() * o.colors.length) | 0]
    });
  }
}
// Tan dust kicked up on a hard landing (sprays sideways/up).
function dustBurst(x, y) {
  spawnParticles(x, y, 9, { angMin: -Math.PI, angMax: 0, spdMin: 40, spdMax: 170,
    grav: 520, lifeMin: 0.25, lifeMax: 0.5, sizeMin: 2, sizeMax: 4,
    colors: ["#d8c8a8", "#bfae8c", "#efe6d0"] });
}
// Small puff under a foot on each step (subtle — gates the "walking" read).
function footDust(x, y) {
  spawnParticles(x, y, 3, { angMin: -Math.PI * 0.85, angMax: -Math.PI * 0.15, spdMin: 18, spdMax: 64,
    grav: 480, lifeMin: 0.16, lifeMax: 0.32, sizeMin: 1.5, sizeMax: 3,
    colors: ["#d8c8a8", "#cbbf9f", "#e8dcc4"] });
}
// Steel/silver sparkle when a carabiner is clipped.
function sparkleBurst(x, y) {
  spawnParticles(x, y, 12, { angMin: 0, angMax: Math.PI * 2, spdMin: 60, spdMax: 220,
    grav: 120, lifeMin: 0.3, lifeMax: 0.6, sizeMin: 2, sizeMax: 4,
    colors: ["#e6ebf2", "#b8c0cc", "#ffffff"] });
}
// Green poof when an enemy is stomped.
function poofBurst(x, y) {
  spawnParticles(x, y, 14, { angMin: 0, angMax: Math.PI * 2, spdMin: 50, spdMax: 210,
    grav: 220, lifeMin: 0.3, lifeMax: 0.6, sizeMin: 3, sizeMax: 6,
    colors: ["#7bd36a", "#4f9e3f", "#bff2a8"] });
}
function addShake(mag) { if (mag > shake) shake = mag; }

function updateEffects(dt) {
  for (const p of particles) {
    p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  if (shake > 0) shake = Math.max(0, shake - 36 * dt);
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    const s = p.size | 0;
    ctx.fillRect(Math.round(p.x - cameraX - s / 2), Math.round(p.y - s / 2), s, s);
  }
  ctx.globalAlpha = 1;
}

/* =============================================================
   DRAW
   ============================================================= */
function drawBackground() {
  const bgKey = currentLevel().bg;
  if (!imgLoaded[bgKey]) {
    const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    g.addColorStop(0, "#87b5e8"); g.addColorStop(1, "#cfe7ff");
    ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    return;
  }
  const img = images[bgKey];
  const tileW = img.naturalWidth * (VIEW_H / img.naturalHeight);
  const scroll = cameraX * BG_PARALLAX;
  // World-stable tile index of the leftmost visible copy (parity must follow
  // world position, not the screen, so tiles don't flicker as we scroll).
  const firstIndex = Math.floor(scroll / tileW);
  const bleed = 1;  // 1px overlap so no hairline gap shows at a seam
  for (let i = firstIndex; ; i++) {
    const x = i * tileW - scroll;          // screen-x of this tile's left edge
    if (x >= VIEW_W) break;
    // Mirror every other copy: a flipped tile's left edge equals the previous
    // tile's right edge, so neighbours connect into a seamless loop.
    const mirror = (((i % 2) + 2) % 2) === 1;
    ctx.save();
    if (mirror) {
      ctx.translate(x + tileW + bleed, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(img, 0, 0, tileW + bleed, VIEW_H);
    } else {
      ctx.drawImage(img, x, 0, tileW + bleed, VIEW_H);
    }
    ctx.restore();
  }
}

function drawGround() {
  // Level 1: natural rock terrain cropped from the Zugspitze art (no blocks).
  const lvl = currentLevel();
  if (lvl.terrain === "natural" && imgLoaded[lvl.bg]) {
    drawNaturalGround(images[lvl.bg]);
    return;
  }
  const bandH = VIEW_H - GROUND_Y;
  if (imgLoaded.platform) {
    const img = images.platform;
    const tileW = img.naturalWidth * (bandH / img.naturalHeight);
    let startX = -(cameraX % tileW);
    if (startX > 0) startX -= tileW;
    for (let x = startX; x < VIEW_W; x += tileW) ctx.drawImage(img, x, GROUND_Y, tileW, bandH);
  } else {
    ctx.fillStyle = "#6b6660"; ctx.fillRect(0, GROUND_Y, VIEW_W, bandH);
  }
}

// Draw the natural terrain: clip to the uneven ledge profile (terrace tops),
// fill it with the rock band cropped from the level art, then cap each ledge
// with grass. The collision (terrace tops) lives hidden inside this rock.
function drawNaturalGround(img) {
  // 1) Clip to the terrain silhouette (sample the surface across the screen).
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, VIEW_H);
  for (let sx = 0; sx <= VIEW_W; sx += 5) ctx.lineTo(sx, surfaceY(cameraX + sx));
  ctx.lineTo(VIEW_W, VIEW_H);
  ctx.closePath();
  ctx.clip();

  // 2) Fill with the foreground rock band, mirror-tiled, scrolling 1:1.
  const sTop = img.naturalHeight * FG_SRC_TOP, sH = img.naturalHeight - sTop;
  const destTop = TERR_MIN_TOP - 6, destH = VIEW_H - destTop;
  const tileW = img.naturalWidth * (destH / sH);
  const first = Math.floor(cameraX / tileW), bleed = 1;
  for (let i = first; ; i++) {
    const x = i * tileW - cameraX;
    if (x >= VIEW_W) break;
    const mirror = (((i % 2) + 2) % 2) === 1;
    ctx.save();
    if (mirror) {
      ctx.translate(x + tileW + bleed, 0); ctx.scale(-1, 1);
      ctx.drawImage(img, 0, sTop, img.naturalWidth, sH, 0, destTop, tileW + bleed, destH);
    } else {
      ctx.drawImage(img, 0, sTop, img.naturalWidth, sH, x, destTop, tileW + bleed, destH);
    }
    ctx.restore();
  }
  ctx.restore();   // drop the clip

  // 3) Grass cap along each ledge top so the edges read as grassy alpine rock.
  for (const s of terrainSegments) {
    const x0 = s.x - cameraX, x1 = s.x + s.w - cameraX;
    if (x1 < 0 || x0 > VIEW_W) continue;
    const gx = Math.max(0, x0), gw = Math.min(VIEW_W, x1) - gx;
    const g = ctx.createLinearGradient(0, s.top - 3, 0, s.top + GRASS_CAP);
    g.addColorStop(0, "#74c24a"); g.addColorStop(1, "#3c7a32");
    ctx.fillStyle = g; ctx.fillRect(gx, s.top - 3, gw, GRASS_CAP + 3);
    ctx.fillStyle = "rgba(150,220,110,0.7)"; ctx.fillRect(gx, s.top - 3, gw, 2);  // bright lip
  }
}

function drawPlatforms() {
  for (const p of platforms) {
    const sx = p.x - cameraX;
    if (sx > VIEW_W || sx + p.w < 0) continue;

    ctx.save();
    if (imgLoaded.platform) {
      // Tile the stone texture across the platform width.
      const img = images.platform;
      const tileW = img.naturalWidth * (p.h / img.naturalHeight);
      let drawn = 0;
      while (drawn < p.w) {
        const w = Math.min(tileW, p.w - drawn);
        const sw = img.naturalWidth * (w / tileW);
        ctx.drawImage(img, 0, 0, sw, img.naturalHeight, sx + drawn, p.y, w, p.h);
        drawn += w;
      }
    } else {
      ctx.fillStyle = "#7a756d"; ctx.fillRect(sx, p.y, p.w, p.h);
    }

    // Type cues so the player can read each platform at a glance.
    if (p.kind === "mover") {
      ctx.strokeStyle = "rgba(120,220,255,0.9)"; ctx.lineWidth = 2;
      ctx.strokeRect(sx + 1, p.y + 1, p.w - 2, p.h - 2);
      ctx.fillStyle = "rgba(120,220,255,0.95)";
      const cyp = p.y + p.h / 2;
      if (p.axis === "y") {  // up/down chevrons
        const mx = sx + p.w / 2;
        ctx.beginPath(); ctx.moveTo(mx - 6, cyp + 2); ctx.lineTo(mx, cyp - 5); ctx.lineTo(mx + 6, cyp + 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(mx - 6, cyp - 2); ctx.lineTo(mx, cyp + 5); ctx.lineTo(mx + 6, cyp - 2); ctx.fill();
      } else {               // left/right chevrons
        ctx.beginPath(); ctx.moveTo(sx + 10, cyp - 6); ctx.lineTo(sx + 4, cyp); ctx.lineTo(sx + 10, cyp + 6); ctx.fill();
        ctx.beginPath(); ctx.moveTo(sx + p.w - 10, cyp - 6); ctx.lineTo(sx + p.w - 4, cyp); ctx.lineTo(sx + p.w - 10, cyp + 6); ctx.fill();
      }
    }
    ctx.restore();
  }
}

// Empty holes — a dark chasm carved into the ground over each pit span.
function drawPits() {
  const top = GROUND_Y;
  for (const pit of pits) {
    const sx = pit.x - cameraX;
    if (sx > VIEW_W || sx + pit.w < 0) continue;
    const g = ctx.createLinearGradient(0, top, 0, VIEW_H);
    g.addColorStop(0, "#2a241e"); g.addColorStop(0.4, "#140f0b"); g.addColorStop(1, "#000000");
    ctx.fillStyle = g; ctx.fillRect(sx, top, pit.w, VIEW_H - top);
    // Inner edge shadow so the rim reads as a carved hole.
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(sx, top, 4, VIEW_H - top);
    ctx.fillRect(sx + pit.w - 4, top, 4, VIEW_H - top);
  }
}


function drawCarabiners() {
  for (const c of carabiners) {
    const sx = c.x - cameraX;
    if (sx > VIEW_W || sx + c.w < 0) continue;
    const bob = Math.sin(performance.now() / 300 + c.t) * 3;
    if (imgLoaded.carabiner) ctx.drawImage(images.carabiner, sx, c.y + bob, c.w, c.h);
    else {
      // Fallback: a metallic-grey oblong ring (carabiner shape).
      const cx = sx + c.w / 2, cy = c.y + c.h / 2 + bob;
      ctx.lineWidth = Math.max(3, c.w * 0.28); ctx.strokeStyle = "#aeb6c2";
      ctx.beginPath();
      ctx.ellipse(cx, cy, c.w / 2 - 1, c.h / 2 - 1, 0, 0, 6.28);
      ctx.stroke();
      ctx.fillStyle = "#d94f44";  // gate spring dot
      ctx.beginPath(); ctx.arc(cx + c.w / 2 - 2, c.y + bob + 4, 2.5, 0, 6.28); ctx.fill();
    }
  }
}

function drawEnemies() {
  for (const e of enemies) {
    const sx = e.x - cameraX;
    if (sx > VIEW_W || sx + e.w < 0) continue;

    // Flapping wings behind a flyer.
    if (e.type === "flyer") {
      const flap = Math.sin(performance.now() / 90) * 6;
      const wy = e.y + e.h * 0.4;
      ctx.fillStyle = "rgba(232,228,255,0.9)";
      ctx.beginPath();
      ctx.moveTo(sx + 4, wy); ctx.lineTo(sx - 16, wy - 11 + flap); ctx.lineTo(sx - 16, wy + 11 + flap);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(sx + e.w - 4, wy); ctx.lineTo(sx + e.w + 16, wy - 11 + flap); ctx.lineTo(sx + e.w + 16, wy + 11 + flap);
      ctx.closePath(); ctx.fill();
    }

    // A soft type-coloured glow so each variety reads at a glance
    // (the shared enemy.png is the same for all types, so colour it here).
    if (e.type !== "walker") {
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = e.color;
      const gx = sx + e.w / 2, gy = e.y + e.h / 2;
      const gr = Math.max(e.w, e.h) * 0.62;
      const grad = ctx.createRadialGradient(gx, gy, gr * 0.3, gx, gy, gr);
      grad.addColorStop(0, e.color);
      grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(gx, gy, gr, 0, 6.2832); ctx.fill();
      ctx.restore();
    }

    // Body. Hoppers squash/stretch with vertical speed.
    let dw = e.w, dh = e.h, dy = e.y;
    if (e.type === "hopper") {
      const stretch = e.vy < -40 ? 1.12 : (e.vy > 80 ? 0.9 : 1);
      dh = e.h * stretch; dw = e.w * (2 - stretch); dy = e.y + (e.h - dh);
    }
    drawSprite("enemy", sx + (e.w - dw) / 2, dy, dw, dh, e.color);

    // Tank: armour plate + remaining-HP pips above it.
    if (e.type === "tank") {
      ctx.fillStyle = "rgba(55,65,75,0.5)";
      ctx.fillRect(sx + 5, e.y + 6, e.w - 10, e.h * 0.34);
      for (let i = 0; i < e.hp; i++) {
        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(sx + 6 + i * 11, e.y - 9, 8, 5);
      }
    }

    // White flash when an enemy survived a stomp.
    if (e.hitFlash > 0 && Math.floor(performance.now() / 60) % 2 === 0) {
      ctx.globalAlpha = 0.5; ctx.fillStyle = "#fff";
      ctx.fillRect(sx, e.y, e.w, e.h); ctx.globalAlpha = 1;
    }
  }
}

function drawPlayer() {
  if (invulnTimer > 0 && Math.floor(performance.now() / 80) % 2 === 0) return;
  const sx = player.x - cameraX;

  // --- Procedural animation: derive bob / lean / squash from state ---
  let bob = 0, lean = 0, squashY = 1;
  const ph = player.walkPhase;
  if (!player.onGround) {
    lean = 0.07 * player.facing;           // lean into the jump arc
    squashY = 1.04;                        // slight stretch in the air
  } else if (Math.abs(player.vx) > 1) {
    // The walk sprite sheet carries the bob + leg motion; just add a slight
    // forward lean for momentum.
    lean = 0.03 * player.facing;
  } else {
    bob = Math.sin(performance.now() / 600) * 1.5; // idle breathing
  }

  const drawW = player.w, drawH = player.h * squashY;
  const footY = player.y + player.h + bob;       // keep feet anchored
  const cx = sx + player.w / 2;

  ctx.save();
  ctx.translate(cx, footY);
  ctx.rotate(lean);
  if (player.facing > 0) ctx.scale(-1, 1);  // art faces left; flip when going right
  if (imgLoaded.player) {
    if (player.onGround && Math.abs(player.vx) > 1) {
      drawWalkingSprite(drawW, drawH, ph);   // articulated legs while walking
    } else {
      ctx.drawImage(images.player, -drawW / 2, -drawH, drawW, drawH);
    }
  } else {
    ctx.fillStyle = "#2980b9";
    ctx.fillRect(-drawW / 2, -drawH, drawW, drawH);
  }
  ctx.restore();
}

// Walk animation: play the pre-baked 6-frame sprite sheet, picking the frame
// from the walk-cycle phase. Origin is at the feet (y=0), head at y=-drawH.
// Falls back to the standing sprite if the sheet hasn't loaded.
function drawWalkingSprite(drawW, drawH, ph) {
  if (!imgLoaded.walk) {
    ctx.drawImage(images.player, -drawW / 2, -drawH, drawW, drawH);
    return;
  }
  const sheet = images.walk;
  const cw = sheet.naturalWidth / WALK_FRAMES, chh = sheet.naturalHeight;
  const span = (2 * Math.PI) / WALK_FRAMES;              // phase per frame
  let f = Math.floor(ph / span) % WALK_FRAMES;
  if (f < 0) f += WALK_FRAMES;
  // The cell is padded; scale it up so the body matches the standing sprite and
  // anchor the feet (cell bottom) at y=0, centred horizontally.
  const dW = drawW * (1 + 2 * WALK_PAD_X);
  const dH = drawH * (1 + WALK_PAD_Y);
  ctx.drawImage(sheet, f * cw, 0, cw, chh, -dW / 2, -dH, dW, dH);
}

function drawHUD() {
  ctx.fillStyle = "#000"; ctx.globalAlpha = 0.35; ctx.fillRect(0, 0, VIEW_W, 40); ctx.globalAlpha = 1;
  ctx.fillStyle = "#fff"; ctx.font = "bold 22px Segoe UI, Arial";
  ctx.textAlign = "left";   ctx.fillText("Score: " + score, 16, 28);
  ctx.textAlign = "center"; ctx.fillStyle = "#ffd84d"; ctx.fillText("Best: " + bestScore, VIEW_W / 2, 28);
  ctx.fillStyle = "#fff";   ctx.textAlign = "right"; ctx.fillText("Lives: " + lives, VIEW_W - 16, 28);
  ctx.textAlign = "left";

  // Level name + progress toward this level's milestone (thin bar under the band).
  const lvl = currentLevel();
  const lo = prevTarget(), hi = lvl.target;
  const prog = Math.max(0, Math.min(1, (score - lo) / (hi - lo)));
  ctx.fillStyle = "#fff"; ctx.font = "bold 15px Segoe UI, Arial"; ctx.textAlign = "left";
  ctx.fillText("Lv " + lvl.id + " · " + lvl.name + " — " + score + " / " + hi, 16, 58);
  const barX = 16, barY = 64, barW = 240, barH = 8;
  ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(barX, barY, barW, barH);
  ctx.fillStyle = "#7fd6ff"; ctx.fillRect(barX, barY, barW * prog, barH);
  ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1; ctx.strokeRect(barX + 0.5, barY + 0.5, barW, barH);
}

function drawCenteredText(lines) {
  ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.textAlign = "center";
  let y = VIEW_H / 2 - (lines.length - 1) * 22;
  for (const l of lines) {
    ctx.fillStyle = l.color || "#fff"; ctx.font = l.font || "24px Segoe UI, Arial";
    ctx.fillText(l.text, VIEW_W / 2, y); y += l.gap || 44;
  }
  ctx.textAlign = "left";
}
function drawStartScreen() {
  // Cover-fit the title splash, then darken the lower strip for legible text.
  if (imgLoaded.title) {
    const img = images.title;
    const s = Math.max(VIEW_W / img.naturalWidth, VIEW_H / img.naturalHeight);
    const w = img.naturalWidth * s, h = img.naturalHeight * s;
    ctx.drawImage(img, (VIEW_W - w) / 2, (VIEW_H - h) / 2, w, h);
    const g = ctx.createLinearGradient(0, VIEW_H * 0.45, 0, VIEW_H);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.85)");
    ctx.fillStyle = g; ctx.fillRect(0, VIEW_H * 0.45, VIEW_W, VIEW_H * 0.55);
  } else {
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  ctx.textAlign = "center";
  const lines = [
    { text: "Walk: A / D or Arrows  (or on-screen buttons)", font: "20px Segoe UI, Arial", color: "#ffffff" },
    { text: "Jump: Space / Up / W",                          font: "20px Segoe UI, Arial", color: "#ffffff" },
    { text: "Carabiners +" + CARABINER_POINTS + "   •   Stomp enemies +" + STOMP_POINTS, font: "20px Segoe UI, Arial", color: "#cfe8ff" },
    { text: "Climb 3 Dolomites peaks to win", font: "20px Segoe UI, Arial", color: "#cfe8ff" },
    { text: "Mind the moving platforms & holes!", font: "20px Segoe UI, Arial", color: "#ffd27a" },
    { text: "Press SPACE or tap to start", font: "bold 24px Segoe UI, Arial", color: "#9fe6ff" }
  ];
  let y = VIEW_H - 178;
  for (const l of lines) { ctx.fillStyle = l.color; ctx.font = l.font; ctx.fillText(l.text, VIEW_W / 2, y); y += 31; }
  ctx.textAlign = "left";
}
function drawGameOver() {
  const lines = [
    { text: "GAME OVER", font: "bold 52px Segoe UI, Arial", color: "#ff6b6b", gap: 54 },
    { text: "Score: " + score + "      Best: " + bestScore, font: "26px Segoe UI, Arial", gap: 46 }
  ];
  if (newBest) lines.push({ text: "★ NEW BEST! ★", font: "bold 30px Segoe UI, Arial", color: "#ffd84d", gap: 50 });
  lines.push({ text: "Press R or click to restart", font: "bold 24px Segoe UI, Arial", color: "#9fe6ff" });
  drawCenteredText(lines);
}
function drawLevelComplete() {
  const next = LEVELS[Math.min(levelIndex + 1, LEVELS.length - 1)];
  drawCenteredText([
    { text: "LEVEL " + currentLevel().id + " COMPLETE!", font: "bold 44px Segoe UI, Arial", color: "#9fe6ff", gap: 50 },
    { text: currentLevel().name, font: "22px Segoe UI, Arial", color: "#ffffff", gap: 40 },
    { text: "+" + LEVEL_BONUS_LIVES + " life   •   Score " + score, font: "22px Segoe UI, Arial", color: "#7bd36a", gap: 46 },
    { text: "Next: " + next.name + "  (reach " + next.target + ")", font: "20px Segoe UI, Arial", color: "#ffd84d", gap: 48 },
    { text: "Press SPACE / JUMP or tap to continue", font: "bold 22px Segoe UI, Arial", color: "#9fe6ff" }
  ]);
}
function drawWin() {
  recordBest();  // idempotent (only updates if higher)
  const lines = [
    { text: "★ YOU WIN! ★", font: "bold 52px Segoe UI, Arial", color: "#ffd84d", gap: 54 },
    { text: "All three Dolomites peaks conquered", font: "22px Segoe UI, Arial", color: "#ffffff", gap: 44 },
    { text: "Final Score: " + score + "      Best: " + bestScore, font: "26px Segoe UI, Arial", gap: 48 }
  ];
  if (newBest) lines.push({ text: "★ NEW BEST! ★", font: "bold 28px Segoe UI, Arial", color: "#7bd36a", gap: 48 });
  lines.push({ text: "Press R or tap to play again", font: "bold 24px Segoe UI, Arial", color: "#9fe6ff" });
  drawCenteredText(lines);
}

/* =============================================================
   LOOP
   ============================================================= */
function resetGame() {
  score = 0; lives = START_LIVES; invulnTimer = 0;
  levelIndex = 0;
  enemySpawnTimer = rand(ENEMY_SPAWN_MIN, ENEMY_SPAWN_MAX);
  cameraX = 0;
  platforms = []; carabiners = []; enemies = [];
  pits = []; terrainSegments = []; lastTerraceTop = GROUND_Y;
  particles = []; shake = 0; newBest = false;
  initPlayer();
  if (LEVELS[0].terrain === "natural") {
    // A flat starting ledge so the player spawns on solid ground.
    terrainSegments.push({ x: -200, w: 620, top: GROUND_Y });
    worldGenX = 420;
  } else {
    worldGenX = 300;
  }
  generateAhead();
  state = "playing";
}

// Cumulative milestones: when total score reaches the level target, either show
// the "Level Complete" interstitial (and award a bonus life) or, on the last
// level, the "You Win!" screen. The run stays continuous across levels.
function checkLevelProgress() {
  if (score < currentLevel().target) return;
  if (levelIndex >= LEVELS.length - 1) {
    state = "won"; Music.stop(); Music.sfxWin(); recordBest();
  } else {
    state = "levelcomplete";
    lives += LEVEL_BONUS_LIVES;
    Music.sfxLevel();
  }
}

// Continue from the interstitial into the next level. Score, lives and the
// player carry over; only the world theme and difficulty change.
function advanceLevel() {
  if (levelIndex < LEVELS.length - 1) levelIndex += 1;
  invulnTimer = INVULN_TIME;   // brief grace as the new level loads in
  state = "playing";
}

function update(dt) {
  updatePlatforms(dt);   // move/elevator platforms first so landing sees new pos
  updatePlayer(dt);
  updateCamera();
  generateAhead();
  updateEnemies(dt);
  handleCarabiners();
  handleHazards();
  handleEnemies();
  checkLevelProgress();
}

function draw() {
  drawBackground();
  drawGround();
  drawPits();
  drawPlatforms();
  drawCarabiners();
  drawEnemies();
  drawPlayer();
  drawParticles();
  drawHUD();
  if (state === "start") drawStartScreen();
  else if (state === "levelcomplete") drawLevelComplete();
  else if (state === "won") drawWin();
  else if (state === "gameover") drawGameOver();
}

let lastTime = 0;
function loop(now) {
  let dt = (now - lastTime) / 1000; lastTime = now;
  if (dt > 0.05) dt = 0.05;
  if (state === "playing") update(dt);
  updateEffects(dt);                 // particles + shake decay (always)
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);
  draw();
  ctx.restore();
  requestAnimationFrame(loop);
}

loadImages(() => {
  resetGame();
  state = "start";
  lastTime = performance.now();
  requestAnimationFrame(loop);
});

// Register the service worker for offline play (ignored if unsupported).
// When a new worker takes over, reload once so the freshly-deployed page
// shows immediately instead of on the *next* launch.
if ("serviceWorker" in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then((reg) => {
      reg.update();                               // check for a new version now
      setInterval(() => reg.update(), 60 * 60 * 1000);  // and hourly while open
    }).catch(() => {});
  });
}
</script>
