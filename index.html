function resetGame() {
  score = 0; runScore = 0; lives = START_LIVES; invulnTimer = 0;
  levelIndex = 0;
  enemySpawnTimer = rand(ENEMY_SPAWN_MIN, ENEMY_SPAWN_MAX);
  cameraX = 0; cameraY = 0; camAnchorFeet = 9999; worldGenX = 0;
  platforms = []; carabiners = []; knifeItems = []; enemies = [];
  pits = []; levelCarabiners = 0; dashboard = null;
  particles = []; shake = 0; newBest = false;
  gearItems = []; gearThisLevel = { shoes: false, rope: false, helmet: false };
  gearPop = { shoes: 0, rope: 0, helmet: 0 }; carabinersThisLevel = 0; toast = null;
  summitReady = false; summitGateX = 0; climb = null; inClimb = false; climbSteps = [];   // clear the summit-climb gate
  carabinerAmmo = startAmmo(); projectiles = [];
  initPlayer();
  if (LEVELS[0].terrain === "natural") {
    player.y = surfaceY(player.x + player.w / 2) - player.h;   // stand on the painted ledge
  } else {
    worldGenX = 300;
  }
  enterLevelEffects();
  generateAhead();
  spawnGearForLevel();
  Music.setTrack(currentLevel().music);   // arm Level 1's track (plays once start() is called)
  state = "playing";
}

// Cumulative milestones: when total score reaches the level target, either show
// the "Level Complete" interstitial (and award a bonus life) or, on the last
// level, the "You Win!" screen. The run stays continuous across levels.
function checkLevelProgress() {
  // Gated levels (Level 1) don't auto-advance on score — the summit climb ends them.
  if (currentLevel().climbGate) return;
  if (score < currentLevel().target) return;
  if (window.AbuTracking) AbuTracking.submitLevel(currentLevel().id, true);   // this level completed
  if (levelIndex >= LEVELS.length - 1) {
    state = "won"; Music.stop(); Music.sfxWin(); recordBest();
    if (window.AbuTracking) AbuTracking.finalizeRun("completed");
  } else {
    // Show the Mountain Progress dashboard before the next level.
    dashboard = {
      completedLevelIndex: levelIndex,
      nextLevelIndex: levelIndex + 1,
      carabiners: levelCarabiners,
      animTime: 0, animDuration: 1.2
    };
    lives += LEVEL_BONUS_LIVES;
    // A victory cutscene (if the level has one) plays first, then the dashboard.
    if (currentLevel().cutscene) {
      startCutscene(currentLevel().cutscene);
    } else {
      state = "levelcomplete";
      Music.sfxLevel();
    }
  }
}

// Continue from the interstitial into the next level. Score, lives and the
// player carry over; only the world theme and difficulty change.
function advanceLevel() {
  if (levelIndex < LEVELS.length - 1) levelIndex += 1;
  levelCarabiners = 0; dashboard = null;   // fresh counter for the new level
  gearThisLevel = { shoes: false, rope: false, helmet: false };   // gear resets each level
  gearPop = { shoes: 0, rope: 0, helmet: 0 }; carabinersThisLevel = 0; toast = null;
  summitReady = false; summitGateX = 0; climb = null; inClimb = false; climbSteps = [];   // clear the summit-climb gate
  projectiles = [];   // knives CARRY OVER between levels — no refill here (collected in Level 1)
  invulnTimer = INVULN_TIME;   // brief grace as the new level loads in
  Music.setTrack(currentLevel().music);    // switch to the new level's track (keeps playing)
  // Entering a natural level: drop the player onto the new painted surface so
  // they don't start embedded in (or floating above) the terrain.
  if (currentLevel().terrain === "natural") {
    player.y = surfaceY(player.x + player.w / 2) - player.h;
    player.vy = 0; player.onGround = true;
  }
  enterLevelEffects();   // arm the new level's wind/snowstorm; clear old crash platforms
  generateAhead();
  spawnGearForLevel(player.x + 150);   // gear ahead of the player on the new level's path
  state = "playing";
  if (window.AbuTracking) AbuTracking.levelStart();   // time the new level for the online run
}

/* =============================================================
   SUMMIT CLIMB — Level 1 finale (no-fail gate)
   Collect 20 carabiners + all gear -> a summit beacon appears at the end of the
   current loop -> walk into it -> Abu gears up (shoes/helmet/rope), then a
   PLAYABLE climb: jump up the steps of the steep hill to the summit -> Level 1
   complete. The climb is a real section (own background + step collision).
   ============================================================= */
const GEARUP_FRAMES = 5;
const GEARUP_TIME   = 3.2;   // seconds for the 5-frame gear-up intro
// Playable climb world (the climbhill backdrop is drawn 1:1 over this).
const CLIMB_W = 1080, CLIMB_H = 720, CLIMB_FLOOR_Y = 706;
// Fixed rope up the hill (base -> summit), tracing the painted staircase. Abu
// holds it and climbs hand-over-hand (hold Up/Jump to ascend, Down to descend).
const CLIMB_ROPE_BASE = [
  { x: 70,  y: 666 }, { x: 175, y: 578 }, { x: 315, y: 502 },
  { x: 455, y: 426 }, { x: 600, y: 352 }, { x: 730, y: 314 }, { x: 826, y: 280 },
];
let CLIMB_ROPE_PTS = CLIMB_ROPE_BASE.slice();   // ACTIVE climb path (per-level; some levels extend to the peak)
const CLIMB_ROPE_SPEED = 155;   // px/s along the rope
let CLIMB_DEBUG = false;        // draw the rope path nodes while tuning
const CLIMB_ROPE_FRAMES = 4;    // frames in the (optional) abu_ropeclimb sheet
// Segment lengths + total for the ACTIVE path (recomputed when the path changes).
let CLIMB_SEG = [], CLIMB_TOTAL = 0;
function recomputeClimbRope() {
  CLIMB_SEG = []; CLIMB_TOTAL = 0;
  for (let i = 1; i < CLIMB_ROPE_PTS.length; i++) {
    const a = CLIMB_ROPE_PTS[i - 1], b = CLIMB_ROPE_PTS[i];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    CLIMB_SEG.push(d); CLIMB_TOTAL += d;
  }
}
recomputeClimbRope();
function climbRopeAt(f) {
  let d = Math.max(0, Math.min(1, f)) * CLIMB_TOTAL;
  for (let i = 0; i < CLIMB_SEG.length; i++) {
    if (d <= CLIMB_SEG[i] || i === CLIMB_SEG.length - 1) {
      const a = CLIMB_ROPE_PTS[i], b = CLIMB_ROPE_PTS[i + 1], t = CLIMB_SEG[i] ? d / CLIMB_SEG[i] : 0;
      return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
    }
    d -= CLIMB_SEG[i];
  }
  const last = CLIMB_ROPE_PTS[CLIMB_ROPE_PTS.length - 1];
  return { x: last.x, y: last.y };
}

// Is the gate met this frame?
function summitGateMet() {
  const g = currentLevel().climbGate;
  if (!g) return false;
  return carabinersThisLevel >= g.carabiners && g.gear.every((id) => gearThisLevel[id]);
}

// Arm the gate (once) and trigger the climb when Abu reaches it.
function checkClimbGate() {
  const lvl = currentLevel();
  if (!lvl.climbGate || state !== "playing" || inClimb) return;
  if (!summitReady && summitGateMet()) {
    summitReady = true;
    const tw = lvl.tileW;
    let gx = (Math.floor(player.x / tw) + 1) * tw;   // end of the current loop
    if (gx - player.x < 360) gx += tw;               // give him room to walk to it
    summitGateX = gx;
    toast = { text: lvl.climbGate.flagOnly ? "All gear collected — reach the checkpoint flag!" : "All gear ready — reach the summit!", timer: 2.6 };
  }
  if (summitReady && player.onGround && player.x + player.w / 2 >= summitGateX) {
    if (lvl.climbGate.flagOnly) finishGateFlag();   // no climb art -> the flag itself finishes the level
    else startSummitClimb();
  }
}

// Level 2+ gate finish: reaching the checkpoint flag completes the level straight to
// the dashboard (the carabiner+gear gate, minus Level 1's rope-climb finale).
function finishGateFlag() {
  summitReady = false; summitGateX = 0;
  if (window.AbuTracking) AbuTracking.submitLevel(currentLevel().id, true);
  if (levelIndex >= LEVELS.length - 1) {
    state = "won"; Music.stop(); Music.sfxWin(); recordBest();
    if (window.AbuTracking) AbuTracking.finalizeRun("completed");
  } else {
    dashboard = { completedLevelIndex: levelIndex, nextLevelIndex: levelIndex + 1,
                  carabiners: levelCarabiners, animTime: 0, animDuration: 1.2 };
    lives += LEVEL_BONUS_LIVES;
    state = "levelcomplete"; Music.sfxLevel();
  }
}

// Phase 1: the scripted gear-up intro (on the climbhill backdrop).
function startSummitClimb() {
  // Per-level rope path: a level may extend the climb up to its summit peak anchor.
  const ext = currentLevel().climbRopeExt;
  CLIMB_ROPE_PTS = ext ? CLIMB_ROPE_BASE.concat(ext) : CLIMB_ROPE_BASE.slice();
  recomputeClimbRope();
  state = "climbing";
  climb = { phase: "gearup", t: 0, frame: 0 };
  player.vx = 0; player.vy = 0;
  cameraX = 0; cameraY = CLIMB_H - VIEW_H;   // frame the base of the climb world
  Music.sfxLevel && Music.sfxLevel();
}

function updateClimb(dt) {
  if (!climb) return;
  climb.t += dt;
  climb.frame = Math.min(GEARUP_FRAMES - 1, Math.floor(climb.t / (GEARUP_TIME / GEARUP_FRAMES)));
  if (climb.t >= GEARUP_TIME) enterClimbPlay();   // -> playable climb
  updateEffects(dt);
}

// Phase 2: the playable climb. Build the step collision, drop Abu at the base,
// hand control back (state = playing, inClimb = true).
function enterClimbPlay() {
  climb = null; inClimb = true; state = "playing";
  climbRopeT = 0;
  platforms = []; enemies = []; carabiners = []; knifeItems = []; gearItems = []; projectiles = [];
  shelters = []; descentRopes = []; ropes = []; crashPlats = []; icicles = []; pits = []; clearRockfalls();
  const p0 = climbRopeAt(0);                         // attach Abu to the rope base
  player.x = p0.x - player.w / 2; player.y = p0.y - player.h; player.vx = 0; player.vy = 0;
  player.onGround = true; player.onPlatform = false; player.mantle = null; player.descend = null;
  player.exhausted = false; player.collapsed = false; player.fatalFalling = false; player.dying = false;
  player.facing = 1; invulnTimer = 0;   // no hit-flicker during the no-fail climb
  toast = { text: "Hold JUMP / ▲ to climb the rope (▼ to descend)", timer: 4 };
  updateClimbCamera();
}

// Rope climb: hold Up/Jump to ascend hand-over-hand, Down to descend; release to
// hold position (no gravity, no fall). Reaching the top finishes Level 1.
function updateClimbPlay(dt) {
  const up = anyKey(JUMP_KEYS), down = anyKey(DOWN_KEYS);
  const dir = (up ? 1 : 0) - (down ? 1 : 0);
  climbRopeT = Math.max(0, Math.min(1, climbRopeT + dir * (CLIMB_ROPE_SPEED / CLIMB_TOTAL) * dt));
  const p = climbRopeAt(climbRopeT);
  player.x = p.x - player.w / 2; player.y = p.y - player.h;
  player.vx = dir * 60; player.onGround = true;     // drives the climb-frame cadence in drawPlayer
  updateClimbCamera();
  updateEffects(dt);
  if (climbRopeT >= 1) finishSummitClimb();
}

function updateClimbCamera() {
  cameraX = Math.max(0, Math.min(CLIMB_W - VIEW_W, player.x + player.w / 2 - VIEW_W / 2));
  cameraY = Math.max(0, Math.min(CLIMB_H - VIEW_H, player.y + player.h - VIEW_H * 0.62));
}

function finishSummitClimb() {
  climb = null; summitReady = false; inClimb = false; climbSteps = [];
  cameraX = 0; cameraY = 0;
  if (window.AbuTracking) AbuTracking.submitLevel(currentLevel().id, true);   // Level 1 completed via the summit climb
  if (levelIndex >= LEVELS.length - 1) {
    state = "won"; Music.stop(); Music.sfxWin(); recordBest();
    if (window.AbuTracking) AbuTracking.finalizeRun("completed");
  } else {
    dashboard = { completedLevelIndex: levelIndex, nextLevelIndex: levelIndex + 1,
                  carabiners: levelCarabiners, animTime: 0, animDuration: 1.2 };
    lives += LEVEL_BONUS_LIVES;
    state = "levelcomplete"; Music.sfxLevel();
  }
}

function update(dt) {
  if (inClimb) { updateClimbPlay(dt); return; }   // playable summit climb: only player + camera
  updateWeather(dt);     // set this frame's wind before the player reads it
  updatePlatforms(dt);   // move/elevator platforms first so landing sees new pos
  updatePlayer(dt);
  updateThrow(dt);       // carabiner throw animation + release
  updateCrashPlats(dt);  // count down any platform the player just triggered
  updateCamera(dt);
  generateAhead();
  updatePower(dt);       // shelter refill + sheltered flag (before enemies read it)
  updateEnemies(dt);
  updateProjectiles(dt); // thrown carabiners: fly, hit enemies/terrain
  updateIcicles(dt);
  updateRockfalls(dt);   // Level 2 telegraphed rockfall hazard
  handleCarabiners();
  handleKnifeItems();
  handleGear();
  handleHazards();
  handleEnemies();
  checkLevelProgress();
  checkClimbGate();      // Level 1 summit gate (arm + trigger the climb)
}

const CLIMB_ABU_H = 92;   // drawn height of geared Abu (gear-up + playable climb)
// Draw one frame of a sprite sheet centred on foot point (fx, footY), facing dir.
function drawSheetAbu(img, frames, frame, fx, footY, dir) {
  const cw = img.naturalWidth / frames, ch = img.naturalHeight;
  const H = CLIMB_ABU_H, W = H * cw / ch;
  ctx.save();
  ctx.translate(fx, footY);
  if (dir < 0) ctx.scale(-1, 1);
  ctx.drawImage(img, frame * cw, 0, cw, ch, -W / 2, -H, W, H);
  ctx.restore();
}
function drawGearedAbu(frame, fx, footY, dir) {
  if (imgLoaded.abuGearup) drawSheetAbu(images.abuGearup, GEARUP_FRAMES, frame, fx, footY, dir);
}
const CLIMB_ROPE_W = 4;    // on-path rope thickness (px)
// Climb backdrop: the Zugspitze far scene drawn EXACTLY like Level 1 — scaled to
// screen height, slow horizontal parallax, mirror-tiled, vertically pinned to the
// camera. Call inside a translate(0, -cameraY) context (so y:cameraY -> screen 0).
function drawClimbSky() {
  const bgKey = currentLevel().bg || "bgZugBack";   // the level's own far-mountain sky
  if (!imgLoaded[bgKey]) { ctx.fillStyle = "#87b5e8"; ctx.fillRect(0, cameraY, VIEW_W, VIEW_H); return; }
  const bg = images[bgKey], bw = bg.naturalWidth * (VIEW_H / bg.naturalHeight);
  const scroll = cameraX * 0.4, first = Math.floor(scroll / bw), bleed = 1;
  for (let i = first; ; i++) {
    const x = i * bw - scroll;
    if (x >= VIEW_W) break;
    const mir = (((i % 2) + 2) % 2) === 1;
    ctx.save();
    if (mir) { ctx.translate(x + bw + bleed, 0); ctx.scale(-1, 1); ctx.drawImage(bg, 0, 0, bg.naturalWidth, bg.naturalHeight, 0, cameraY, bw + bleed, VIEW_H); }
    else ctx.drawImage(bg, 0, 0, bg.naturalWidth, bg.naturalHeight, x, cameraY, bw + bleed, VIEW_H);
    ctx.restore();
  }
}
// The keyed rock hill (magenta cut out), drawn 1:1 over the climb world so it
// scrolls with the camera and lets the Zugspitze sky show through the cut-out.
function drawClimbHill() {
  const key = currentLevel().climbWall || "climbHill";   // per-level climb backdrop art
  if (imgLoaded[key]) ctx.drawImage(images[key], 0, 0, CLIMB_W, CLIMB_H);
}
// Draw the braided rope along a list of climb-world points.
function drawRopeAlong(pts) {
  if (imgLoaded.climbRopeSeg) {
    const img = images.climbRopeSeg, tileH = img.naturalHeight * (CLIMB_ROPE_W / img.naturalWidth);
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const len = Math.hypot(b.x - a.x, b.y - a.y), ang = Math.atan2(b.y - a.y, b.x - a.x);
      ctx.save();
      ctx.translate(a.x, a.y); ctx.rotate(ang - Math.PI / 2);   // image +Y runs a -> b
      let drawn = 0;
      while (drawn < len) {
        const h = Math.min(tileH, len - drawn), sh = (h / tileH) * img.naturalHeight;
        ctx.drawImage(img, 0, 0, img.naturalWidth, sh, -CLIMB_ROPE_W / 2, drawn, CLIMB_ROPE_W, h);
        drawn += tileH;
      }
      ctx.restore();
    }
  } else {
    ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
    const lay = (color, w) => { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath();
      for (let i = 0; i < pts.length; i++) { const p = pts[i]; i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); } ctx.stroke(); };
    lay("#4f3620", 7); lay("#9c6b3a", 4); lay("#caa24a", 1.5);
    ctx.restore();
  }
}
// Piton + carabiner anchor fixing the rope at point `top`.
function drawClimbAnchorAt(top) {
  if (imgLoaded.climbAnchor) {
    const img = images.climbAnchor, aw = 35, ah = aw * img.naturalHeight / img.naturalWidth;
    ctx.drawImage(img, top.x - aw * 0.103, top.y - ah * 0.847, aw, ah);   // rope-loop frac (0.103, 0.847) sits on `top`
  } else { ctx.fillStyle = "#8a8f96"; ctx.beginPath(); ctx.arc(top.x, top.y, 5, 0, 6.28); ctx.fill(); }
}
// The fixed rope, drawn in climb-world coordinates (call inside a -camera translate).
function drawClimbRopeWorld() {
  drawRopeAlong(CLIMB_ROPE_PTS);
  drawClimbAnchorAt(CLIMB_ROPE_BASE[CLIMB_ROPE_BASE.length - 1]);   // first anchor (junction)
  if (CLIMB_ROPE_PTS.length > CLIMB_ROPE_BASE.length) drawClimbAnchorAt(CLIMB_ROPE_PTS[CLIMB_ROPE_PTS.length - 1]);   // peak anchor when extended
  if (CLIMB_DEBUG) { ctx.fillStyle = "#f55"; for (const p of CLIMB_ROPE_PTS) ctx.fillRect(p.x - 3, p.y - 3, 6, 6); }
}

// Phase 1 scene: the gear-up, framed on the climb world (same view the playable
// climb opens on, so the hand-off is seamless).
function drawClimb() {
  ctx.save(); ctx.translate(0, -Math.round(cameraY)); drawClimbSky(); ctx.restore();   // pinned parallax sky
  ctx.save();
  ctx.translate(-Math.round(cameraX), -Math.round(cameraY));
  drawClimbHill();
  drawClimbRopeWorld();
  const p0 = CLIMB_ROPE_PTS[0];
  drawGearedAbu(climb.frame, p0.x, p0.y, 1);
  ctx.restore();
  ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(0, 0, VIEW_W, 38);
  ctx.fillStyle = "#ffd84d"; ctx.font = "bold 18px Segoe UI, Arial"; ctx.textAlign = "center";
  ctx.fillText("Gearing up…", VIEW_W / 2, 26);
  ctx.textAlign = "left";
}

// The Level-1 checkpoint: a planted, waving mountain flag (2-frame) where the
// summit climb begins. Appears once all gear + 20 carabiners are collected.
function drawSummitMarker() {
  if (!summitReady || inClimb || state !== "playing") return;
  const sx = summitGateX - cameraX;
  if (sx < -60) return;
  if (sx > VIEW_W) {   // off to the right: pulsing edge arrow pointing the way
    const pulse = 0.5 + 0.5 * Math.abs(Math.sin(performance.now() / 300));
    ctx.fillStyle = "rgba(255,216,77," + (0.6 + 0.4 * pulse) + ")";
    ctx.beginPath(); ctx.moveTo(VIEW_W - 14, 230); ctx.lineTo(VIEW_W - 34, 218); ctx.lineTo(VIEW_W - 34, 242); ctx.closePath(); ctx.fill();
    return;
  }
  const gy = surfaceY(summitGateX);
  if (imgLoaded.summitFlag) {
    const img = images.summitFlag, cw = img.naturalWidth / 2, ch = img.naturalHeight;
    const fh = 104, fw = fh * cw / ch;
    const fi = Math.floor(performance.now() / 320) % 2;        // 2-frame wave
    ctx.drawImage(img, fi * cw, 0, cw, ch, sx - fw * 0.097, gy - fh + 3, fw, fh);  // pole (frac 0.097) planted at the checkpoint
  } else {
    ctx.fillStyle = "#caa24a"; ctx.fillRect(sx - 2, gy - 92, 4, 92);
    ctx.fillStyle = "#ffd84d"; ctx.beginPath(); ctx.moveTo(sx + 2, gy - 92); ctx.lineTo(sx + 42, gy - 80); ctx.lineTo(sx + 2, gy - 68); ctx.closePath(); ctx.fill();
  }
}

function draw() {
  if (state === "cutscene") { drawCutscene(); return; }
  if (state === "climbing") { drawClimb(); return; }
  ctx.save();
  if (cameraY) ctx.translate(0, -Math.round(cameraY));   // vertical pan (Level 1 upper ledge); no-op elsewhere
  drawBackground();
  drawGround();
  drawShelters();          // wooden refuges on the ground (Level 1)
  drawUpperPlatforms();    // high ledge above the shelter (Level 1)
  drawIceLakes();          // cyan frozen patches over the snow ground (Level 5)
  drawPits();
  drawPlatforms();
  drawCrashPlatforms();    // breaking ice ledges (Level 5)
  drawRopes();             // climbable ropes (Level 4)
  drawDescentRopes();      // platform-edge descent ropes (Level 1)
  drawRockfallWarnings();  // Level 2 rockfall warning rings (behind gear/player)
  drawCarabiners();
  drawKnifeItems();        // knife pickups on the Level-1 climb top ledges
  drawGear();              // collectible shoes / rope / helmet on the path
  drawSummitMarker();      // summit-climb beacon once all gear is collected
  drawEnemies();
  drawProjectiles();       // thrown carabiners in flight
  drawPlayer();
  drawFallingRocks();      // Level 2 boulder + impact debris (in front of the player)
  drawIcicles();           // telegraph markers + falling spikes (Level 5)
  drawParticles();
  drawWeather();           // snowstorm flakes + whiteout fog (Level 5), over the world
  ctx.restore();           // end vertical-camera pan
  drawHUD();
  if (state === "start") drawStartScreen();
  else if (state === "instructions") drawInstructions();
  else if (state === "levelcomplete") drawLevelDashboard();
  else if (state === "won") drawWin();
  else if (state === "gameover") drawGameOver();
}

let lastTime = 0;
function loop(now) {
  let dt = (now - lastTime) / 1000; lastTime = now;
  if (dt > 0.05) dt = 0.05;
  if (state === "playing") update(dt);
  else if (state === "climbing") updateClimb(dt);
  // "How to Play" waits for a press/tap to start (no auto-advance).
  if (state === "levelcomplete" && dashboard) dashboard.animTime += dt;   // marker travel anim
  updateEffects(dt);                 // particles + shake decay (always)
  syncTestBtn();                     // show the Test-L2 shortcut only on the cover
  syncLeaderboardBtn();              // show the Leaderboard button on cover / win
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);
  draw();
  ctx.restore();
  requestAnimationFrame(loop);
}

loadImages(() => {
  resetGame();
  state = "start";
  lastTime = performance.now();
  requestAnimationFrame(loop);
  initOnline();   // registration + leaderboard (no-op if Supabase isn't configured)
});

// Online registration / leaderboard wiring. The game stays fully playable if
// Supabase is unavailable — the run just won't qualify for the leaderboard.
let onlineWarned = false;
function initOnline() {
  const lbBtn = document.getElementById("btn-leaderboard");
  if (lbBtn && window.AbuTracking) {
    const open = (e) => { e.preventDefault(); e.stopPropagation(); AbuTracking.openLeaderboard(); };
    lbBtn.addEventListener("click", open);
    lbBtn.addEventListener("touchend", open, { passive: false });
  }
  if (!window.AbuTracking) return;
  // Show the registration modal over the cover; on resolve, the player plays.
  AbuTracking.begin().then((res) => {
    if (res && res.online === false && !onlineWarned) {
      onlineWarned = true;
      toast = { text: "Offline — this run won't be ranked on the leaderboard", timer: 4 };
    }
  }).catch(() => {});
}

// Show the Leaderboard button only on the cover and win screens. On the cover,
// place it just under the subtitle "تحدي القمم الخمسه" (mapped onto the scaled
// canvas); on the win screen, keep it bottom-centre.
let _lbVis = null;
function syncLeaderboardBtn() {
  const b = document.getElementById("btn-leaderboard");
  if (!b) return;
  const vis = (state === "start" || state === "won");
  if (vis !== _lbVis) { b.hidden = !vis; _lbVis = vis; }
  if (!vis) return;
  if (state === "start") {
    const r = canvas.getBoundingClientRect();              // on-screen canvas rect (scaled)
    b.style.left = Math.round(r.left + 12) + "px";          // extreme left of the cover
    b.style.top = Math.round(r.top + r.height * 0.40) + "px";
    b.style.bottom = "auto";
    b.style.transform = "none";                            // left-aligned (not centred)
  } else {
    b.style.left = "50%"; b.style.top = "auto";
    b.style.bottom = "max(18px, env(safe-area-inset-bottom))";
    b.style.transform = "translateX(-50%)";
  }
}

// Register the service worker for offline play (ignored if unsupported).
// When a new worker takes over, reload once so the freshly-deployed page
// shows immediately instead of on the *next* launch.
if ("serviceWorker" in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then((reg) => {
      reg.update();                               // check for a new version now
      setInterval(() => reg.update(), 60 * 60 * 1000);  // and hourly while open
    }).catch(() => {});
  });
}
</script>
