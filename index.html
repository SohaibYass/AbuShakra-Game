<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>AbuShakra Adventure</title>

<!-- Cairo (Arabic) font for the towed banner text -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet" />

<!-- PWA: installable + offline -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1b1b25" />

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AbuShakra" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1b1b25;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
    touch-action: none;            /* no scroll/zoom gestures while playing */
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    image-rendering: pixelated;
    background: #87b5e8;
    max-width: 100vw;
    max-height: 100vh;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }


  /* Music on/off — always visible, top-right. */
  #btn-mute {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(20,22,34,0.45);
    color: #fff; font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px);
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    z-index: 10;
  }
  #btn-mute:active { transform: scale(0.92); }

  /* Fullscreen toggle — top-right, just left of the mute button. */
  #btn-fullscreen {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: calc(max(14px, env(safe-area-inset-right)) + 58px);
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(20,22,34,0.45);
    color: #fff; font-size: 24px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px);
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    z-index: 10;
  }
  #btn-fullscreen:active { transform: scale(0.92); }

  /* Leaderboard button — shown on the cover and win screens. */
  #btn-leaderboard {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(18px, env(safe-area-inset-bottom));
    width: 48px; height: 48px; padding: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(255,255,255,0.5); background: rgba(20,22,34,0.55);
    color: #ffd84d; font-size: 24px; line-height: 1; cursor: pointer;
    z-index: 30; backdrop-filter: blur(6px);
    box-shadow: 0 3px 12px rgba(0,0,0,0.45);
  }
  #btn-leaderboard[hidden] { display: none; }
  #btn-leaderboard:active { filter: brightness(1.2); }

  /* Dev/test shortcuts — jump straight into a level. Only shown on the cover. */
  #test-buttons {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    display: none; gap: 8px;
    z-index: 10;
  }
  #test-buttons .test-btn {
    height: 40px; padding: 0 14px;
    border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(20,22,34,0.45);
    color: #fff; font: 700 14px/1 "Segoe UI", Arial;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px);
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
  }
  #test-buttons .test-btn:active { transform: scale(0.94); }

  /* On-screen touch controls — hidden by default, shown on touch devices. */
  #touch-controls { display: none; }
  body.touch #touch-controls { display: block; }
  #touch-controls .btn {
    position: fixed;
    bottom: max(22px, env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center;
    width: 88px; height: 88px;
    border-radius: 50%;
    background: rgba(20,22,34,0.42);
    border: 2px solid rgba(255,255,255,0.6);
    color: #fff;
    font-size: 38px; font-weight: 700;
    text-align: center;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.06s ease, background 0.06s ease;
    cursor: pointer;
  }
  #touch-controls .btn.pressed {
    background: rgba(120,180,255,0.7);
    border-color: #fff;
    transform: scale(0.92);
  }
  /* Left D-pad: ◀ ▶ on a raised top row, ▼ centred just below them. */
  #touch-controls #btn-left  { left: max(20px, env(safe-area-inset-left));
                               bottom: calc(max(22px, env(safe-area-inset-bottom)) + 100px); }
  #touch-controls #btn-right { left: calc(max(20px, env(safe-area-inset-left)) + 104px);
                               bottom: calc(max(22px, env(safe-area-inset-bottom)) + 100px); }
  #touch-controls #btn-jump  {
    right: max(20px, env(safe-area-inset-right));
    width: 104px; height: 104px;
    font-size: 22px; letter-spacing: 1px;
    background: rgba(60,150,90,0.5);
  }
  #touch-controls #btn-jump.pressed { background: rgba(90,220,130,0.8); }
  #touch-controls #btn-down {
    left: calc(max(20px, env(safe-area-inset-left)) + 56px);
    width: 80px; height: 80px; font-size: 30px;
    background: rgba(150,110,60,0.5);
  }
  #touch-controls #btn-down.pressed { background: rgba(210,160,90,0.8); }
  #touch-controls #btn-throw {
    right: max(20px, env(safe-area-inset-right));
    bottom: calc(max(20px, env(safe-area-inset-bottom)) + 120px);
    width: 80px; height: 80px;
    background: rgba(70,120,170,0.5);
  }
  #touch-controls #btn-throw img { width: 46px; height: 46px; pointer-events: none; }
  #touch-controls #btn-throw.pressed { background: rgba(110,170,230,0.85); }
</style>
</head>
<body>
<canvas id="game" width="800" height="450"></canvas>
<button id="btn-mute" aria-label="Toggle music">&#128266;</button>
<button id="btn-fullscreen" aria-label="Fullscreen">&#9974;</button>
<div id="test-buttons">
  <button class="test-btn" data-seq="1" aria-label="Test sequence 1">&#9654; S1</button>
  <button class="test-btn" data-seq="2" aria-label="Test sequence 2">&#9654; S2</button>
  <button class="test-btn" data-seq="3" aria-label="Test sequence 3">&#9654; S3</button>
  <button class="test-btn" data-seq="4" aria-label="Test sequence 4">&#9654; S4</button>
  <button class="test-btn" data-seq="5" aria-label="Test sequence 5">&#9654; S5</button>
  <button class="test-btn" data-seq="6" aria-label="Test sequence 6">&#9654; S6</button>
  <button class="test-btn" data-seq="7" aria-label="Test sequence 7">&#9654; S7</button>
</div>
<div id="touch-controls">
  <div id="btn-left"  class="btn">&#9664;</div>
  <div id="btn-right" class="btn">&#9654;</div>
  <div id="btn-down"  class="btn">&#9660;</div>
  <div id="btn-jump"  class="btn">JUMP</div>
  <div id="btn-throw" class="btn"><img src="camping_knife.png" alt="throw" /></div>
</div>
<button id="btn-leaderboard" aria-label="Leaderboard" hidden>🏆</button>

<!-- Online registration + leaderboard (Supabase). Loaded before the game script
     so window.AbuTracking is available. Configure keys in js/supabase-config.js. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/validation.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/run-tracker.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/player-registration.js"></script>

/* =============================================================
   ASSET LOADING
   ============================================================= */
const images = {}, imgLoaded = {};
function loadImages(cb) {
  const keys = Object.keys(ASSETS);
  let remaining = keys.length;
  if (!remaining) return cb();
  keys.forEach(key => {
    const img = new Image();
    images[key] = img; imgLoaded[key] = false;
    const done = () => { if (--remaining === 0) cb(); };
    img.onload = () => { imgLoaded[key] = img.naturalWidth > 0; done(); };
    img.onerror = () => { imgLoaded[key] = false; done(); };
    img.src = ASSETS[key];
  });
}
function drawSprite(key, x, y, w, h, color) {
  if (imgLoaded[key]) ctx.drawImage(images[key], x, y, w, h);

let fsTried = false;

  if (fsTried) return; fsTried = true;
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (req) { try { const p = req.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {} }

    try { const p = screen.orientation.lock("landscape"); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
}

// Fullscreen toggle button. Android / iPad / desktop have the Fullscreen API,
// so the button really goes fullscreen (and locks landscape). iPhone Safari has
// NO element-fullscreen API, so the button is hidden there (see setup below).
function toggleFullscreen() {
  const el = document.documentElement;

    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) { try { exit.call(document); } catch (e) {} }

  }
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (req) {
    try { const p = req.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {}
    if (screen.orientation && screen.orientation.lock) {

    }

// Bind an on-screen button to a virtual key. Multi-touch safe; uses touch
// events with preventDefault so iOS never treats taps as zoom/scroll.
function bindButton(id, code, onPress) {
  const el = document.getElementById(id);
  if (!el) return;
  const press = (e) => {
    e.preventDefault();
    if (keys[code]) return;
    keys[code] = true; el.classList.add("pressed");
    if (onPress) onPress();

  const release = (e) => {
    e.preventDefault();

  el.addEventListener("touchend",   release, { passive: false });
  el.addEventListener("touchcancel", release, { passive: false });

  el.addEventListener("pointerdown", press);
  el.addEventListener("pointerup", release);
  el.addEventListener("pointerleave", release);
}

/* =============================================================
   MUSIC — background track is an mp3 (looped HTML5 <audio>); the
   short sound effects are still synthesized live with the Web Audio
   API. Both are gated by the same mute toggle.
   ============================================================= */
const Music = (() => {
  // Looping background track (per-level mp3; replaces the old synth loop).
  const bgm = new Audio();
  const MUSIC_VOL = 0.5;          // normal background level (ducked down near enemies)
  bgm.loop = true; bgm.volume = MUSIC_VOL; bgm.preload = "auto";
  let curSrc = null;
  let actx = null, master = null, voice = null, enabled = true;
  let waterSrc = null, waterGain = null, waterLP = null;   // continuous waterfall-rush ambience
  // Switch the background track. Swaps the source only when it changes; if music
  // is already playing it crossfades straight into the new track, otherwise it
  // just arms it (so the cover stays silent until the first tap calls start()).
  function setTrack(src) {
    if (!src || src === curSrc) return;
    const wasPlaying = !bgm.paused;
    curSrc = src;
    bgm.src = src;
    if (enabled && wasPlaying) bgm.play().catch(() => {});
  }

  function ensure() {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;            // very old browser -> silently no music
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.16;   // overall volume
    master.connect(actx.destination);
    voice = actx.createGain();  // enemy voices ride a louder bus so they cut over the music
    voice.gain.value = 0.55;
    voice.connect(actx.destination);
  }
  // iOS only starts audio from inside a user gesture. Create+resume the
  // context and play one silent sample to "unlock" it for later use.
  function unlock() {
    ensure();
    if (!actx) return;
    if (actx.state === "suspended") actx.resume();
    const b = actx.createBuffer(1, 1, 22050);
    const s = actx.createBufferSource();
    s.buffer = b; s.connect(actx.destination); s.start(0);
  }
  function blip(freq, time, dur, type, vol) {
    if (!freq) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(vol, time + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g); g.connect(master);
    o.start(time); o.stop(time + dur + 0.02);
  }
  // A note whose pitch glides from f0 to f1 — used for sound effects.
  function slide(f0, f1, time, dur, type, vol, out) {
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, time);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), time + dur);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(vol, time + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g); g.connect(out || master);
    o.start(time); o.stop(time + dur + 0.02);

  let noiseBuf = null;
  function noise(time, dur, vol, f0, f1, q, out) {
    if (!actx) return;
    if (!noiseBuf) {
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = actx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = q || 6;
    bp.frequency.setValueAtTime(f0, time);
    if (f1) bp.frequency.exponentialRampToValueAtTime(Math.max(1, f1), time + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(vol, time + Math.min(0.12, dur * 0.4));   // gentle swell
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    src.connect(bp); bp.connect(g); g.connect(out || master);
    src.start(time); src.stop(time + dur + 0.02);
  }
  const sfxReady = () => enabled && !!actx;
  return {
    unlock,
    // ---- Sound effects (share the unlocked context; gated by mute) ----
    sfxJump()  { if (!sfxReady()) return; slide(330, 760, actx.currentTime, 0.14, "square", 0.5); },
    sfxCoin()  { if (!sfxReady()) return; const t = actx.currentTime; blip(988, t, 0.07, "square", 0.5); blip(1319, t + 0.07, 0.12, "square", 0.5); },
    sfxOneUp() { if (!sfxReady()) return; const t = actx.currentTime; blip(523, t, 0.09, "square", 0.5); blip(659, t + 0.09, 0.09, "square", 0.5); blip(784, t + 0.18, 0.09, "square", 0.5); blip(1047, t + 0.27, 0.22, "square", 0.55); },  // cheerful 1-up
    sfxStomp() { if (!sfxReady()) return; slide(440, 120, actx.currentTime, 0.16, "square", 0.6); },
    sfxHurt()  { if (!sfxReady()) return; slide(300, 80, actx.currentTime, 0.32, "sawtooth", 0.6); },
    sfxOver()  { if (!sfxReady()) return; const t = actx.currentTime; blip(523, t, 0.16, "square", 0.5); blip(392, t + 0.16, 0.16, "square", 0.5); blip(262, t + 0.32, 0.42, "square", 0.6); },
    sfxSad()   { if (!sfxReady()) return; const t = actx.currentTime; slide(392, 330, t, 0.22, "triangle", 0.5); slide(330, 262, t + 0.22, 0.26, "triangle", 0.5); slide(262, 196, t + 0.5, 0.55, "triangle", 0.55); },  // sad descending "aww" on death
    sfxLevel() { if (!sfxReady()) return; const t = actx.currentTime; [523,659,784,1047].forEach((f, i) => blip(f, t + i * 0.09, 0.12, "square", 0.5)); },
    sfxWin()   { if (!sfxReady()) return; const t = actx.currentTime; [523,659,784,1047,784,1047,1319].forEach((f, i) => blip(f, t + i * 0.12, 0.16, "square", 0.55)); },
    sfxGear()  { if (!sfxReady()) return; const t = actx.currentTime; [659,988,1319,1568].forEach((f, i) => blip(f, t + i * 0.06, 0.13, "triangle", 0.5)); },  // bright rising "gear found" jingle
    sfxSwim()   { if (!sfxReady()) return; noise(actx.currentTime, 0.17, 0.16, 760, 320, 1.1); },                 // soft per-stroke water swish
    sfxBubble() { if (!sfxReady()) return; slide(320, 880, actx.currentTime, 0.07, "sine", 0.15); },              // tiny rising bubble blip
    sfxSplash() { if (!sfxReady()) return; const t = actx.currentTime; noise(t, 0.30, 0.42, 1100, 240, 0.9); slide(220, 90, t, 0.16, "triangle", 0.22); },  // plunge into the water
    sfxEagleCry()     { if (!sfxReady()) return; const t = actx.currentTime; blip(1450, t, 0.05, "sawtooth", 0.28); blip(1950, t + 0.05, 0.07, "sawtooth", 0.24); blip(1250, t + 0.13, 0.06, "sawtooth", 0.2); },  // screech (dive warning)
    sfxEagleDive()    { if (!sfxReady()) return; slide(620, 170, actx.currentTime, 0.32, "sawtooth", 0.24); },   // fast wind swoosh
    sfxEagleHit()     { if (!sfxReady()) return; slide(220, 70, actx.currentTime, 0.14, "triangle", 0.4); },     // feather/impact
    sfxEagleTakeoff() { if (!sfxReady()) return; const t = actx.currentTime; slide(170, 90, t, 0.11, "triangle", 0.2); slide(150, 80, t + 0.1, 0.11, "triangle", 0.17); },  // two wing beats
    // Enemy proximity voices (vol fades with distance, passed in by the caller).
    // Snake: a sibilant "sssss" — airy high band-pass noise (broad Q) with a faint
    // lower layer for body, swelling then trailing off.
    sfxSnake(vol) {
      if (!sfxReady()) return; const t = actx.currentTime;
      noise(t, 0.72, vol, 8200, 7000, 2.2, voice);          // airy top sss
      noise(t + 0.02, 0.66, vol * 0.45, 4600, 4000, 3.5, voice);  // breathy body
    },
    // Eagle: an iconic raptor screech — a sharp up-chirp onset into a long,
    // descending "kee-aaarr" cry, with a raspy band-passed noise layer riding the
    // tone so it sounds harsh and birdlike rather than a plain sawtooth.
    sfxEagle(vol) {
      if (!sfxReady()) return; const t = actx.currentTime;
      slide(2050, 2850, t, 0.05, "sawtooth", vol * 0.85, voice);        // sharp up-chirp onset
      slide(2850, 1000, t + 0.05, 0.55, "sawtooth", vol, voice);        // long descending cry
      noise(t + 0.05, 0.5, vol * 0.5, 3400, 1500, 6, voice);            // raspy raptor texture
    },
    // Cobra: a deeper, longer menacing hiss than the green snake, ending in a sharp
    // strike "spit" — distinct so the placed cobra reads as a bigger threat.
    sfxCobra(vol) {
      if (!sfxReady()) return; const t = actx.currentTime;
      noise(t, 1.0, vol, 5400, 4200, 2.4, voice);               // long low hiss
      noise(t + 0.03, 0.9, vol * 0.5, 2700, 2200, 3.6, voice);  // breathy body
      noise(t + 0.72, 0.16, vol * 0.85, 7600, 6800, 4, voice);  // strike spit
    },
    // Duck the music as enemies close in: fades fully to ZERO before point-blank
    // (silent by the time the duck reaches ~0.8), back to normal when they leave.
    setMusicDuck(level) { const k = Math.max(0, Math.min(1, level)); bgm.volume = MUSIC_VOL * Math.max(0, 1 - 1.25 * k); },
    // Continuous waterfall rush: band-limited looping noise, gain tracks proximity.
    setWaterLevel(level) {
      if (!sfxReady()) return;
      if (!waterSrc) {
        if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
        waterGain = actx.createGain(); waterGain.gain.value = 0; waterGain.connect(actx.destination);
        const hp = actx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 380;
        waterLP = actx.createBiquadFilter(); waterLP.type = "lowpass"; waterLP.frequency.value = 2400;

      waterGain.gain.value = k * 0.5;
      waterLP.frequency.value = 1800 + 1400 * k;   // brighter splash as you get closer
    },
    setTrack,                                // switch the per-level background track
    start() {
      if (!enabled) return;
      ensure();                              // unlock the sfx context too
      if (actx && actx.state === "suspended") actx.resume();
      bgm.play().catch(() => {});            // loop the background track (ignored if autoplay is blocked)
    },
    resume() {
      if (actx && actx.state === "suspended") actx.resume();
      if (enabled) bgm.play().catch(() => {});
    },
    stop() { bgm.pause(); },
    toggle() {
      enabled = !enabled;
      if (!enabled) bgm.pause();
      return enabled;
    },
    get enabled() { return enabled; }
  };
})();

// --- DEBUG: click-to-coordinate readout (level-design helper) --------------
// While DEBUG_CLICK is on, click anywhere during play to print the WORLD
// position under the cursor (worldX along the 0..5400 panorama, the surface-Y
// there, and which sequence it is). Use these numbers to place enemies/gear.
const DEBUG_CLICK = true;
let _dbgPts = [];   // up to two points: [FROM, TO]; a 3rd click starts a fresh pair
function _dbgPoint(e) {
  const r = canvas.getBoundingClientRect();
  const cx = (e.clientX - r.left) / r.width  * VIEW_W;
  const cy = (e.clientY - r.top)  / r.height * VIEW_H;
  const worldX = Math.round(cameraX + cx);
  const worldY = Math.round(cameraY + cy);
  const lvl = currentLevel();
  const tileW = lvl.fgTileW || lvl.tileW || 1350;
  const seq = Math.floor(worldX / tileW) + 1;
  const surfY = Math.round(surfaceY(worldX));
  return { worldX, worldY, surfY, seq };
}
canvas.addEventListener("pointerdown", (e) => {
  if (!DEBUG_CLICK || state !== "playing") return;
  if (_dbgPts.length >= 2) _dbgPts = [];   // third click resets and starts a new FROM
  const p = _dbgPoint(e);
  _dbgPts.push(p);
  const label = _dbgPts.length === 1 ? "FROM" : "TO";
  console.log(`[pos ${label}] worldX=${p.worldX}  worldY=${p.worldY}  surfaceY=${p.surfY}  seq=${p.seq}`);
  if (_dbgPts.length === 2) {
    const a = _dbgPts[0], b = _dbgPts[1];
    console.log(`[span] from x=${Math.min(a.worldX, b.worldX)} to x=${Math.max(a.worldX, b.worldX)}  width=${Math.abs(b.worldX - a.worldX)}`);
  }
});
function _dbgCross(p, color, tag) {
  const sx = p.worldX - cameraX, sy = p.worldY - cameraY;
  ctx.strokeStyle = color; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(sx - 8, sy); ctx.lineTo(sx + 8, sy);
  ctx.moveTo(sx, sy - 8); ctx.lineTo(sx, sy + 8); ctx.stroke();
  ctx.fillStyle = color; ctx.font = "10px monospace"; ctx.textAlign = "left";
  ctx.fillText(tag, sx + 6, sy - 6);
}
function drawDebugClick() {
  if (!DEBUG_CLICK || !_dbgPts.length) return;
  ctx.save();
  const a = _dbgPts[0], b = _dbgPts[1];
  if (b) {   // connecting line between FROM and TO
    ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(a.worldX - cameraX, a.worldY - cameraY);
    ctx.lineTo(b.worldX - cameraX, b.worldY - cameraY); ctx.stroke();
  }
  _dbgCross(a, "#ff3b3b", "FROM");
  if (b) _dbgCross(b, "#3bd1ff", "TO");
  // readout panel (top-left, screen space)
  let txt;
  if (b) {
    const x0 = Math.min(a.worldX, b.worldX), x1 = Math.max(a.worldX, b.worldX);
    txt = `from x:${x0}  to x:${x1}  width:${x1 - x0}  seq:${a.seq}  surfaceY:${a.surfY}`;
  } else {
    txt = `FROM  x:${a.worldX}  surfaceY:${a.surfY}  seq:${a.seq}  (clickY:${a.worldY})`;
  }
  ctx.font = "12px monospace"; ctx.textAlign = "left";
  const w = ctx.measureText(txt).width + 16;
  ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(8, 70, w, 22);
  ctx.fillStyle = "#7CFFB2"; ctx.fillText(txt, 16, 85);
  ctx.restore();
}

function currentLevel() { return LEVELS[levelIndex]; }
function prevTarget() { return levelIndex > 0 ? LEVELS[levelIndex - 1].target : 0; }
// Mild within-level ramp (1.0 -> ~1.6) combined with the level's own multiplier.
function difficulty() {
  return (1 + Math.min(cameraX / 6000, 0.6)) * currentLevel().enemySpeedMul;
}

function rand(a, b) { return a + Math.random() * (b - a); }
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

/* =============================================================
   ELEVATED PLATFORMS — generated ahead in world space, recycled
   once far behind the camera. The ground is a separate, always
   solid surface, so walking never drops you into a pit.
   ============================================================= */
function makePlatform(x) {
  const w = rand(PLAT_WIDTH_MIN, PLAT_WIDTH_MAX);
  const y = GROUND_Y - rand(PLAT_RISE_MIN, PLAT_RISE_MAX);
  const p = { x, y, w, h: PLAT_THICK, kind: "static", solid: true };

  const h = currentLevel().haz || {};
  const r = Math.random();
  if (h.mover && r < h.mover) {
    // Moving / elevator platform: oscillates on one axis, carries its rider.
    p.kind = "mover"; p.ox = x; p.phase = Math.random() * 6.28;
    if (Math.random() < 0.6) {
      // Vertical elevator — keep its low point a jump above the ground.
      p.axis = "y"; p.oy = GROUND_Y - rand(120, 190);
      p.amp = rand(40, 80); p.speed = rand(0.6, 1.1); p.y = p.oy;
    } else {
      p.axis = "x"; p.oy = y; p.amp = rand(50, 120); p.speed = rand(0.5, 1.0);
    }
  }

  if (p.kind === "static") addCarabinersAbove(p);   // keep clips off moving blocks
  return p;
}

function addCarabinersAbove(p) {
  if (Math.random() < 0.8) {
    const n = Math.floor(rand(1, 4));
    for (let i = 0; i < n; i++) {
      const cx = p.x + 16 + i * (CARABINER_W + 20);
      if (cx + CARABINER_W > p.x + p.w) break;
      carabiners.push({ x: cx, y: p.y - CARABINER_H - 14, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
    }
  }
}

// Maybe carve an empty hole into a gap. It's centred with solid ground either
// side and capped in width, so the gap always stays clearable with one jump.
function maybeGroundHazard(gapStart, gap) {
  const pPit = (currentLevel().haz || {}).pit || 0;
  if (pPit && Math.random() < pPit && gap > 110) {
    const pw = Math.min(PIT_W_MAX, gap - 50);
    pits.push({ x: gapStart + (gap - pw) / 2, w: pw });
  }
}

// Scatter reachable carabiners just above the painted ledge at world-x.
// Sparse: most stretches stay empty so the few that appear are worth collecting.
function maybeGroundCarabinersAt(x) {
  if (Math.random() < 0.45) {
    const n = Math.floor(rand(1, 3));
    const arc = Math.random() < 0.5;
    const baseY = surfaceY(x) - rand(44, 84);
    for (let i = 0; i < n; i++) {
      const cx = x + i * (CARABINER_W + 22);
      const y = arc ? baseY - Math.sin((i + 1) / (n + 1) * Math.PI) * 40 : baseY;
      carabiners.push({ x: cx, y: y - CARABINER_H, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
    }
  }
}

// Place carabiners sitting ON the floating platforms of a given tile, evenly
// distributed across each platform top. Called once per tile as the world
// scrolls, so the reward for reaching a platform is collecting its clip(s).
// Clips alternate each tile (loop):
//   EVEN tile -> one clip on the FIRST and LAST ledge (gaps + middle ledge empty)
//   ODD  tile -> one clip in EACH gap (all ledges empty)
// So a single loop reads: ledge,_,_,_,ledge ; the next: _,gap,_,gap,_ .
function placePlatformCarabiners(tile, tw, plats) {
  if (tile % 2 !== 0) return;                        // odd tiles carry their clips in the gaps
  const base = tile * tw;
  const sorted = plats.slice().sort((a, b) => a.x0 - b.x0);
  const pick = sorted.length >= 2
    ? [sorted[0], sorted[sorted.length - 1]]         // first & last ledge only
    : sorted;
  for (const bx of pick) {
    const cx = base + (bx.x0 + bx.x1) / 2 - CARABINER_W / 2;
    carabiners.push({ x: cx, y: bx.top - CARABINER_H - 10, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
  }
}

// Place carabiners along the WALKING TRACK, in the GAPS between platforms only,
// hovering at chest height so they're collected by walking through. Active on
// ODD tiles (the loops where the ledges are empty).
function placeTrackCarabiners(tile, tw, plats) {
  if (tile % 2 === 0) return;                        // even tiles carry their clips on the ledges
  const base = tile * tw;
  const sorted = plats.slice().sort((a, b) => a.x0 - b.x0);
  for (let i = 0; i < sorted.length - 1; i++) {
    const gapL = sorted[i].x1, gapR = sorted[i + 1].x0;
    if (gapR - gapL < 80) continue;                  // skip gaps too narrow to stand in
    const x = base + (gapL + gapR) / 2;
    const bottom = surfaceY(x) - rand(10, 24);       // chest height above the ledge
    carabiners.push({ x: x - CARABINER_W / 2, y: bottom - CARABINER_H, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
  }
}

// ALL clips on the ground (none on the platforms) — spread across the tile at
// chest height every loop, so the player must brave the ground (and its snakes)
// to collect. Used by levels flagged `groundClipsOnly`.
function placeGroundClips(tile, tw) {
  const base = tile * tw;
  for (const f of [0.22, 0.5, 0.78]) {
    const x = base + f * tw;
    const bottom = surfaceY(x) - rand(10, 24);
    carabiners.push({ x: x - CARABINER_W / 2, y: bottom - CARABINER_H, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
  }
}

// Keep platforms / carabiners generated up to a little past the right screen edge.
function generateAhead() {
  const target = cameraX + VIEW_W + 400;
  if (currentLevel().terrain === "natural") {
    const lvl = currentLevel();
    if (lvl.platforms || lvl.ropes || lvl.groundClipsOnly || lvl.rareCarabiners) {
      // Tiled generation (carabiners + platforms/ropes/crash-platforms), once per
      // tile (worldGenX steps a whole tile at a time).
      const tw = lvl.tileW;
      while (worldGenX < target) {
        const tile = Math.floor(worldGenX / tw);
        if (lvl.rareCarabiners) {
          placeRareCarabiner(tile, tw);                         // Level 5: almost none
        } else if (lvl.ropes && !lvl.platforms) {
          placeSparseGroundClips(tile, tw);                     // Level 4: just one ground clip per tile
        } else if (lvl.groundClipsOnly) {
          if (lvl.sparseClips) placeSparseGroundClips(tile, tw); // Level 1: one ground clip per loop
          else placeGroundClips(tile, tw);                       // Level 3: 3 ground clips per tile
          if (lvl.upperPlat) placeUpperKnives(tile, tw);         // Level 1: a knife on each NON-gear climb top ledge
        } else if (lvl.platforms) {
          placePlatformCarabiners(tile, tw, lvl.platforms);     // clips on the ledges
          placeTrackCarabiners(tile, tw, lvl.platforms);        // clips in the ground gaps
        }
        // Level 5 crashing platforms: persistent per-instance state, spawned once
        // per tile (deterministic x/top from lvl.crashSpecs).
        if (lvl.crashSpecs) for (const cs of lvl.crashSpecs) {
          crashPlats.push({ x: tile * tw + cs.x0, y: cs.top, w: cs.x1 - cs.x0, h: 14,
            state: "solid", timer: 0, goneAt: 0, respawn: !!lvl.crashRespawn });
        }
        worldGenX += tw;
      }
      const a = Math.floor((cameraX - tw) / tw), b = Math.floor((cameraX + VIEW_W + tw) / tw);
      // Floating-platform collision boxes (painted into the fg art): rebuild for the
      // visible tiles each frame (deterministic, repeats every tileW).
      platforms = [];
      // Collapsing ledges: solid while stable/cracking, no collision once collapsing.
      for (const c of collapsers) if (c.state === "stable" || c.state === "cracking") platforms.push(collapserBox(c));
      // Floating stepping-rock platforms (top-only landing boxes on the flat tops).
      if (lvl.stepRocks) for (const r of lvl.stepRocks) {
        const m = STEP_ROCK_META[r.img]; if (!m) continue;
        const s = STEP_ROCK_SCALE;
        platforms.push({ x: r.x - (m.tcx - m.tx0) * s, y: r.top, w: (m.tx1 - m.tx0) * s, h: 28, kind: "static", solid: true });
      }
      if (lvl.platforms) for (let t = a; t <= b; t++) {
        const shelterTile = t > 0 && (((t % 5) + 5) % 5) === 0;   // shelter every 5th loop (tiles 5, 10, 15, … — none at spawn)
        for (const bx of lvl.platforms) {
          platforms.push({ x: t * tw + bx.x0, y: bx.top, w: bx.x1 - bx.x0, h: 30, kind: "static", solid: true, rope: bx.rope, shelter: bx.shelter && shelterTile });
        }
      }
      // Upper ledges above the platforms (Level 1) — a stacked climb per shelter tile.
      if (lvl.upperPlat) for (let t = a; t <= b; t++) {
        if ((((t % 2) + 2) % 2) !== 0) continue;       // even (shelter) tiles
        const w = UPPER_PLAT.grassHalfW * 2 * UPPER_PLAT.scale;
        for (const L of UPPER_PLAT.ledges) {
          const cx = t * tw + L.cxOff, lw = w * (L.wMul || 1);
          platforms.push({ x: cx - lw / 2, y: L.top, w: lw, h: 26, kind: "static", solid: true, upper: true, cx, guard: !!L.guard });
        }
      }
      // Climbable swing ropes for the visible tiles (Level 4), same deterministic tiling.
      ropes = [];
      if (lvl.ropes) for (let t = a; t <= b; t++) for (const rp of lvl.ropes) {
        ropes.push({ x: t * tw + rp.x, top: rp.top, bottom: rp.bottom, alt: rp.alt });
      }
      // Absolute-positioned swing ropes (Level 1: cross the seq5 chasm).
      if (lvl.swingRopes) for (const rp of lvl.swingRopes) {
        ropes.push({ x: rp.x, top: rp.top, bottom: rp.bottom, alt: rp.alt });
      }
      // Descent ropes off the RIGHT end of flagged platforms, ending a bit ABOVE the
      // ground (Abu drops the last stretch — the rope never touches the ground).
      descentRopes = [];
      if (lvl.descend && lvl.platforms) for (const p of platforms) {
        if (!p.rope) continue;
        const rx = p.x + p.w - 6;
        descentRopes.push({ x: rx, top: p.y, bottom: surfaceY(rx) - 50 });
      }
      // Shelter safe-zones = the shelter ledges (up on a platform, off the ground path).
      shelters = [];
      if (lvl.power) for (const p of platforms) {
        if (!p.shelter) continue;
        shelters.push({ x: p.x, w: p.w, cx: p.x + p.w / 2, top: p.y });
      }
      if (lvl.power && lvl.shelterSpots) for (const s of lvl.shelterSpots)   // shelters on deterministic spots (seq3 arch)
        shelters.push({ x: s.x - 45, w: 90, cx: s.x, top: s.top });
    } else {
      // Natural terrain without platforms: scatter sparse ground carabiners.
      while (worldGenX < target) {
        worldGenX += rand(150, 300);
        maybeGroundCarabinersAt(worldGenX);
      }
    }
  } else {
    while (worldGenX < target) {
      const gap = rand(PLAT_GAP_MIN, PLAT_GAP_MAX);
      const gapStart = worldGenX;
      worldGenX += gap;
      maybeGroundHazard(gapStart, gap);
      platforms.push(makePlatform(worldGenX));
      worldGenX += PLAT_WIDTH_MAX; // reserve space so the next gap starts after this block
    }
  }
  // Recycle anything well behind the camera.
  const cutoff = cameraX - 300;
  platforms  = platforms.filter(p => p.x + p.w > cutoff);
  carabiners = carabiners.filter(c => c.x + c.w > cutoff);
  knifeItems = knifeItems.filter(k => k.x + k.w > cutoff);
  energyItems = energyItems.filter(e => e.x + e.w > cutoff);
  pits       = pits.filter(p => p.x + p.w > cutoff);
  crashPlats = crashPlats.filter(p => p.x + p.w > cutoff);
}

// Level 4: a single ground clip per tile at a random spot — sparse, so Abu mostly
// scores by stomping the wolves/falcons rather than collecting.
function placeSparseGroundClips(tile, tw) {
  const x = tile * tw + rand(0.25, 0.75) * tw;
  const bottom = surfaceY(x) - rand(10, 24);
  carabiners.push({ x: x - CARABINER_W / 2, y: bottom - CARABINER_H, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
}

// Level 1 climb: which CLIMB STACKS (every other tile) hold gear vs. a knife. Stack
// indices are 0-based (tile/2). Level 1 always starts at tile 0, so gear lands on
// stacks 1/3/5 (= "2nd / 4th / 6th top ledge"); every other stack's top ledge gets a
// knife — including the 7th onward, so Abu can keep stocking up for later levels.
function isGearStack(tile) {
  if ((((tile % 2) + 2) % 2) !== 0) return false;   // climb stacks are on even tiles only
  const s = tile / 2;                               // 0-based climb-stack index
  return s === 1 || s === 3 || s === 5;             // stacks 2 / 4 / 6 hold the three gear
}
// A knife pickup on the TOP ledge of every NON-gear climb stack (one per loop).
function placeUpperKnives(tile, tw) {
  if ((((tile % 2) + 2) % 2) !== 0) return;         // even (climb) tiles only
  if (isGearStack(tile)) return;                    // gear stacks hold gear, not a knife
  const L = UPPER_PLAT.ledges.find(l => l.shoes) || UPPER_PLAT.ledges[UPPER_PLAT.ledges.length - 1];
  const cx = tile * tw + L.cxOff;
  knifeItems.push({ x: cx - KNIFE_PICK_W / 2, y: L.top - KNIFE_PICK_H - 6,
    w: KNIFE_PICK_W, h: KNIFE_PICK_H, t: Math.random() * 6.28, collected: false });
}

// Level 5: a single carabiner only now and then (survival over collection).
function placeRareCarabiner(tile, tw) {
  if (Math.random() > 0.28) return;                 // ~most tiles get nothing
  const x = tile * tw + rand(0.2, 0.8) * tw;
  const y = surfaceY(x) - rand(12, 26) - CARABINER_H;
  carabiners.push({ x: x - CARABINER_W / 2, y, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
}

// Level 4: a clip near the TOP of each rope, just below its anchor rock — only
// reachable by climbing all the way up the rope.
function placeRopeCarabiners(tile, tw, ropeList) {
  const base = tile * tw;
  for (const rp of ropeList) {
    const x = base + rp.x;
    carabiners.push({ x: x - CARABINER_W / 2, y: rp.top + SWING_MIN_L + 6, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
  }
}

// Interpolate a heightmap `surf` (spanning [0,tileW]) at local-x.
const SURF_GAP = 9999;   // heightmap sentinel: a break in the green line (no ground there)
function sampleSurf(surf, tileW, local) {
  const fx = local / (tileW / (surf.length - 1));
  let i = Math.floor(fx);
  if (i < 0) return surf[0];
  if (i >= surf.length - 1) return surf[surf.length - 1];
  // A gap: either bracketing sample is the sentinel -> no ground (don't lerp into it).
  if (surf[i] >= 5000 || surf[i + 1] >= 5000) return SURF_GAP;
  const f = fx - i;
  return surf[i] * (1 - f) + surf[i + 1] * f;
}
// Total width of a multi-scene (`tiles`) level's repeating sequence (memoised).
function natSeqW(lvl) {
  if (!lvl._seqW) lvl._seqW = lvl.tiles.reduce((s, t) => s + t.tileW, 0);
  return lvl._seqW;
}

// Ground surface height at a world-x for natural terrain.
// - Single-image levels: the heightmap repeats every `tileW` and mirrors on odd
//   tiles to match the mirror-tiled art.
// - Multi-scene levels (`tiles`): the scenes play in sequence and repeat (no
//   mirror); pick the scene this world-x falls in and sample its heightmap.
// Per-painting panorama ground: if the sequence tile this world-x falls in has a
// green-line height map (`fgSurf`), sample it (with the foreground draw offset).
// Returns null when this tile has no height map yet, so callers fall back.
function fgSurfaceY(worldX) {
  const lvl = currentLevel();
  if (!lvl.fgSurf || !lvl.fgList) return null;
  const ftw = lvl.fgTileW || lvl.tileW || ZUG_TILE_W;
  const n = lvl.fgList.length;
  const i = Math.floor(worldX / ftw);
  const key = lvl.fgList[((i % n) + n) % n];
  const hm = lvl.fgSurf[key];
  if (!hm) return null;
  const s = sampleSurf(hm, ftw, worldX - i * ftw);
  if (s >= 5000) return s;   // gap sentinel: keep it (no offset)
  const adj = (lvl.fgYAdjust && lvl.fgYAdjust[key]) || 0;
  return s + (lvl.fgYOffset || 0) + adj;
}

function surfaceY(worldX) {
  const lvl = currentLevel();
  if (lvl.fgFlats) for (const f of lvl.fgFlats)    // collision-only walk surface (no painting cut) — e.g. the seq7 cliff platform
    if (worldX >= f.x0 && worldX <= f.x1) {
      if (Array.isArray(f.surf)) {                 // a height-map profile (follows the cliff steps)
        const t = (worldX - f.x0) / (f.x1 - f.x0) * (f.surf.length - 1), i = Math.floor(t), fr = t - i;
        return f.surf[i] + (f.surf[Math.min(f.surf.length - 1, i + 1)] - f.surf[i]) * fr;
      }
      return f.surf;
    }
  if (lvl.bridges) for (const br of lvl.bridges)   // walk flat across a bridge deck
    if (worldX >= br.x0 && worldX <= br.x1) return br.top;
  if (lvl.fgHoles) for (const h of lvl.fgHoles)    // a cut through the foreground: collision = h.surf (9999/omit = bottomless hole, else a flat floor)
    if (worldX >= h.x0 && worldX <= h.x1) return h.surf != null ? h.surf : SURF_GAP;
  const fg = fgSurfaceY(worldX);
  if (fg !== null) return fg;   // panorama painting with a green-line height map
  if (lvl.tiles) {
    const seqW = natSeqW(lvl);
    let pos = ((worldX % seqW) + seqW) % seqW;
    for (const t of lvl.tiles) {
      if (pos < t.tileW) return sampleSurf(t.surf, t.tileW, pos);
      pos -= t.tileW;
    }
    return GROUND_Y;
  }
  const surf = lvl.surf, tileW = lvl.tileW;
  if (!surf) return GROUND_Y;
  const t = Math.floor(worldX / tileW);
  let local = worldX - t * tileW;
  // parallax levels tile the foreground normally (no flip), so collision matches.
  if (lvl.bgMode !== "parallax" && (((t % 2) + 2) % 2) === 1) local = tileW - local;
  return sampleSurf(surf, tileW, local);
}

// Cave LOWER terrain layer (seq6): surfaceY is the arch top (Abu walks over it);
// this is the cave floor UNDER the arch. Returns world-Y, or null where there's no
// cave (the panorama loops, so it recurs every fgList*fgTileW). Player-only — enemies
// and items keep using surfaceY.
function caveFloorY(worldX) {
  const lvl = currentLevel();
  const cf = lvl.caveFloor;
  if (!cf) return null;
  const period = (lvl.fgList ? lvl.fgList.length : 1) * (lvl.fgTileW || 1350);
  let rel = (((worldX - cf.x0) % period) + period) % period;   // 0 at the cave's left edge
  const span = cf.x1 - cf.x0;
  if (rel < 0 || rel > span) return null;
  const t = rel / span * (cf.surf.length - 1), i = Math.floor(t), f = t - i;
  const a = cf.surf[i], b = cf.surf[Math.min(cf.surf.length - 1, i + 1)];
  const adj = (lvl.fgYAdjust && lvl.fgYAdjust.fgZug6) || 0;   // follow seq6's vertical nudge
  return a + (b - a) * f + adj;
}
// The terrain the PLAYER walks: the cave's lower floor when player.inCave (his feet
// are down in the cave), else the normal surface (arch / ground). Pure — inCave is
// updated once per frame in updatePlayer (updateCaveLayer).
function pSurf(worldX) {
  if (player.inCave) { const cf = caveFloorY(worldX); if (cf != null) return cf; }
  return surfaceY(worldX);
}
// Decide which layer Abu is on (called once per frame when grounded): the cave floor
// if his feet are nearer it than the arch above, else the normal surface.
function updateCaveLayer() {
  const cx = player.x + player.w / 2, cf = caveFloorY(cx);
  if (cf == null) { if (player.onGround) player.inCave = false; return; }   // leave the cave only when grounded (a jump near the edge keeps the layer)
  const feet = player.y + player.h;
  const nearer = Math.abs(feet - cf) <= Math.abs(feet - surfaceY(cx)) + 2;
  if (nearer) player.inCave = true;                  // entering / resting on the cave floor
  else if (player.onGround) player.inCave = false;   // switch up to the arch only when actually standing on it
  // (airborne: keep the current layer, so a jump from the cave floor doesn't pop Abu onto the arch)
}

// Ground level for ENEMIES. If the level has a dedicated `enemySurf` (e.g. the
// Level 1 snake line), enemies stand on that; otherwise they share surfaceY.
function enemyFloorY(worldX) {
  const lvl = currentLevel();
  const fg = fgSurfaceY(worldX);
  if (fg !== null) return fg;                 // panorama painting: snakes share its green-line surface
  const es = lvl.enemySurf;
  if (!es || lvl.tiles) return surfaceY(worldX);
  const tileW = lvl.tileW;
  const t = Math.floor(worldX / tileW);
  let local = worldX - t * tileW;
  if (lvl.bgMode !== "parallax" && (((t % 2) + 2) % 2) === 1) local = tileW - local;
  return sampleSurf(es, tileW, local);
}

// True unless the given world-x sits over a lava pit (no solid floor there).
function groundSolidAt(cx) {
  for (const pit of pits) if (cx > pit.x && cx < pit.x + pit.w) return false;
  return true;
}

// Is the player currently resting on top of platform p (within a hair)?
function playerRidingOn(p) {
  return player && player.onGround &&
         player.x + player.w > p.x && player.x < p.x + p.w &&
         Math.abs((player.y + player.h) - p.y) < 3;
}

// Move moving/elevator platforms, advance crumbling blocks, and carry a rider.
// Runs BEFORE updatePlayer so landing tests see the new positions; rider
// detection uses last frame's onGround (still valid here).
function updatePlatforms(dt) {
  for (const p of platforms) {
    if (p.kind !== "mover") continue;
    p.phase += p.speed * dt;
    const off = Math.sin(p.phase) * p.amp;
    const nx = p.axis === "x" ? p.ox + off : p.ox;
    const ny = p.axis === "y" ? p.oy + off : p.oy;
    const dx = nx - p.x, dy = ny - p.y;
    p.x = nx; p.y = ny;
    if ((dx || dy) && playerRidingOn(p)) {  // carry the rider
      player.x += dx; player.y += dy;
    }
  }
}

/* =============================================================

function spawnEnemy() {

  // falcon and wolf. Otherwise fall back to the simple enemyMix of type strings.
  let cr = null, type;
  if (lvl.enemyCreatures) {
    if (!lvl.enemyCreatures.length) return;   // empty list = no roaming enemies
    cr = lvl.enemyCreatures[(Math.random() * lvl.enemyCreatures.length) | 0];
    type = cr.type;
  } else {
    const mix = lvl.enemyMix;
    type = mix[(Math.random() * mix.length) | 0];

  const sz = cr ? cr.size : (lvl.enemySize && lvl.enemySize[type]); // per-creature/per-type size
  const w = sz ? sz.w : (anim ? anim.w : t.w);

    vy: 0, baseY, phase: Math.random() * 6.28, jumpTimer: rand(0.3, 1.0), hitFlash: 0

// Green patrol snakes placed by config (lvl.patrolSnakes = [{x0,x1,top}]). They use

// sprite and pace the full from->to span the user marked.
function spawnPatrolSnakes() {
  const lvl = currentLevel();
  if (!ENEMIES_ENABLED || !lvl.patrolSnakes) return;
  for (const p of lvl.patrolSnakes) {
    const w = p.w || 88, h = Math.max(8, Math.round(w / 2.136));   // per-snake width; height locks the 724x339 cell aspect (≈2.14)
    // Find the contiguous run around the span's centre, walking out until a sharp
    // step (a CLIFF) — gradual slopes are allowed (the snake walks them smoothly),
    // but it never paces off an edge where surfaceY jumps and it would "hop".
    const c0 = (p.x0 + p.x1) / 2, STEP_MAX = 18;
    let fl = c0, fr = c0;
    while (fl - 4 >= c0 - 800 && Math.abs(surfaceY(fl - 4) - surfaceY(fl)) <= STEP_MAX) fl -= 4;
    while (fr + 4 <= c0 + 800 && Math.abs(surfaceY(fr + 4) - surfaceY(fr)) <= STEP_MAX) fr += 4;
    // Clamp the marked span to that flat run; if it's then narrower than the snake
    // + a little travel, expand symmetrically but never past the flat run.
    let x0 = Math.max(p.x0, fl), x1 = Math.min(p.x1, fr);
    const need = w + 24;
    if (x1 - x0 < need) {
      const c = (x0 + x1) / 2;
      x0 = Math.max(fl, Math.round(c - need / 2));
      x1 = Math.min(fr, Math.round(c + need / 2));
    }
    enemies.push({ guard: true, type: "walker", x: x0, y: p.top - h, w, h,
      x0, x1, dir: 1, ledgeTop: p.top, followSurf: true, footPad: 4,   // hug the real ground as it paces
      alive: true, hp: 1, points: STOMP_POINTS, color: "#6a3", phase: Math.random() * 6.28, hitFlash: 0,
      frames: { key: "enemySnakeDistinct", count: 3, fps: 6 } });

    const cxv = e.x + e.w / 2, cyv = e.y + e.h / 2;
    const dx = e.perchX - cxv, dy = (e.perchY - e.h / 2) - cyv, dist = Math.hypot(dx, dy) || 1;
    const sp = Math.min(EAGLE_PERCH_APPROACH_SPEED, dist * 2.6 + 20);   // ease in near the perch
    e.x += (dx / dist) * sp * dt; e.y += (dy / dist) * sp * dt;
    e.dir = (e.perchX < cxv) ? -1 : 1;
    if (dist < 7) { e.x = e.perchX - e.w / 2; e.y = e.perchY - e.h; e.state = "perched"; e.stateTimer = rand(EAGLE_PERCH_TIME_MIN, EAGLE_PERCH_TIME_MAX); e.faceTimer = 0; }
  } else if (e.state === "perched") {
    e.stateTimer -= dt; e.phase += dt * 1.5;
    const pcx = player.x + player.w / 2, ecx = e.x + e.w / 2;
    e.faceTimer -= dt;
    if (e.faceTimer <= 0) { e.dir = (pcx < ecx) ? -1 : 1; e.faceTimer = 0.5; }   // turn only occasionally
    if (Math.abs(pcx - ecx) < EAGLE_PERCH_ALERT_DIST || e.stateTimer <= 0) beginEagleTakeoff(e);
  } else if (e.state === "takeoff") {
    e.stateTimer -= dt; e.frameTime += dt;
    const prog = 1 - Math.max(0, e.stateTimer) / EAGLE_TAKEOFF_TIME;
    e.y = e.takeoffStartY - EAGLE_TAKEOFF_RISE * prog;
    const pcx = player.x + player.w / 2;
    e.x += ((e.x + e.w / 2 < pcx) ? -1 : 1) * 38 * dt;            // edge away from Abu
    if (e.stateTimer <= 0) {
      e.state = "recover"; e.stateTimer = rand(0.6, 0.9);
      e.takeoffCd = 1.2; e.perchTimer = rand(EAGLE_PERCH_WAIT_MIN, EAGLE_PERCH_WAIT_MAX);
      e.patrolY = Math.max(18, surfaceY(e.x + e.w / 2) - rand(40, 72) - e.h);
    }
  } else if (e.state === "warning") {
    e.stateTimer -= dt; e.phase += dt * 1.4;
    e.y = e.warnY + Math.sin(e.phase) * 4;
    e.x += Math.sin(e.phase * 0.7) * 10 * dt;                     // tiny hover circle
    e.shadowX += (e.targetX - e.shadowX) * Math.min(1, 6 * dt);   // shadow slides to the locked target
    if (e.stateTimer <= 0) { e.state = "dive"; e.stateTimer = rand(EAGLE_DIVE_MIN, EAGLE_DIVE_MAX); e.shadowX = e.targetX; Music.sfxEagleDive(); }
  } else if (e.state === "dive") {
    e.stateTimer -= dt;
    const cxv = e.x + e.w / 2, cyv = e.y + e.h / 2;
    const dx = e.targetX - cxv, dy = e.targetY - cyv, dist = Math.hypot(dx, dy) || 1;
    e.x += (dx / dist) * EAGLE_DIVE_SPEED * dt;
    e.y += (dy / dist) * EAGLE_DIVE_SPEED * dt;
    const floor = surfaceY(e.x + e.w / 2);
    if ((floor < 5000 && e.y + e.h > floor - 2) || e.stateTimer <= 0 || dist < 12) {
      if (floor < 5000 && e.y + e.h > floor - 2) e.y = floor - e.h - 2;
      e.state = "recover"; e.stateTimer = rand(EAGLE_RECOVER_MIN, EAGLE_RECOVER_MAX);
    }

    if (cxv < e.x0) e.x += 70 * dt; else if (cxv > e.x1) e.x -= 70 * dt;

}
function eagleFrameIndex(e) {
  if (e.state === "perched") return 2;          // wings lowered (settled)
  if (e.state === "takeoff") { const prog = 1 - Math.max(0, e.stateTimer) / EAGLE_TAKEOFF_TIME; return prog < 0.34 ? 2 : (prog < 0.67 ? 1 : 0); }
  if (e.state === "dive") return 1;             // wings-level glide
  const seq = [0, 1, 2, 1], fps = (e.state === "warning") ? 4 : (e.state === "approachPerch" ? 5 : 7);
  return seq[Math.floor(e.frameTime * fps) % 4];
}
function drawEagleShadow(e) {
  if (e.state !== "warning" && e.state !== "dive") return;
  const shx = (e.state === "dive") ? e.targetX : e.shadowX, sx = shx - cameraX;
  if (sx < -70 || sx > VIEW_W + 70) return;

  if (gy >= 5000) return;
  const g = (e.state === "warning") ? (1 - Math.max(0, e.stateTimer) / (e.warnDur || 1)) : 1;
  const w = 46 + 24 * g, h = 11 + 6 * g, alpha = 0.16 + 0.24 * g;

}
function drawEagle(e) {
  const cx = e.x + e.w / 2, sx = cx - cameraX, cy = e.y + e.h / 2;
  if (sx < -100 || sx > VIEW_W + 100) return;
  const perched = e.state === "perched";
  // While perched on the cliff, use the dedicated 2-frame landed pose; otherwise the
  // 3-frame flying strip.
  const useLanding = perched && imgLoaded.eagleLanding;
  const key = useLanding ? "eagleLanding" : "enemyEagle";
  if (!imgLoaded[key]) { ctx.fillStyle = e.color; ctx.fillRect(sx - e.w / 2, e.y, e.w, e.h); return; }
  const img = images[key], frameCount = useLanding ? 2 : 3, cw = img.naturalWidth / frameCount;
  const dw = perched ? EAGLE_VIS_W * 0.84 : EAGLE_VIS_W, dh = dw;   // narrower silhouette when perched
  const dy = cy - dh / 2 + EAGLE_VIS_DY + (perched ? 12 : 0);
  const fi = useLanding ? (Math.floor(e.frameTime * 1.5) % 2) : eagleFrameIndex(e);   // perched: slow settle toggle
  const movingRight = (e.state === "dive") ? (e.targetX > cx) : (e.dir > 0);
  ctx.save();
  if (e.hitFlash > 0) ctx.globalAlpha = 0.55;
  if (movingRight) { ctx.translate(sx, 0); ctx.scale(-1, 1); ctx.drawImage(img, fi * cw, 0, cw, img.naturalHeight, -dw / 2, dy, dw, dh); }
  else ctx.drawImage(img, fi * cw, 0, cw, img.naturalHeight, sx - dw / 2, dy, dw, dh);   // faces left by default
  ctx.restore();
}

function updateEnemies(dt) {
  const d = difficulty();
  const natural = currentLevel().terrain === "natural";
  // Proximity voices + music ducking: as the nearest enemy closes in, the music
  // fades toward minimal and the enemy's hiss / screech swells. A per-enemy
  // cooldown keeps the voices from buzzing every frame.
  const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
  let nearest = Infinity;
  for (const e of enemies) {
    const dist = Math.hypot((e.x + e.w / 2) - pcx, (e.y + e.h / 2) - pcy);
    if (dist < nearest) nearest = dist;
    e.sndCd = (e.sndCd || 0) - dt;
    if (e.sndCd > 0 || dist > ENEMY_SND_DIST) continue;
    const vol = (0.85 + 0.6 * enemyDuck) * (1 - dist / ENEMY_SND_DIST);   // louder, swells with the duck
    if (e.type === "flyer" || e.eagleGuard) { Music.sfxEagle(vol); e.sndCd = rand(1.6, 2.8); }
    else if (e.cobra) { Music.sfxCobra(vol); e.sndCd = rand(1.6, 2.6); }
    else if (e.wolf || e.croc) { e.sndCd = rand(2, 3.5); }   // wolf/croc: no snake hiss
    else { Music.sfxSnake(vol); e.sndCd = rand(1.8, 3.2); }
  }
  // Ease the duck toward how close the nearest enemy is (fast attack, slower release).
  // The music volume is set in update() from the max of the enemy + waterfall ducks.
  const targetDuck = nearest < ENEMY_DUCK_DIST ? 1 - nearest / ENEMY_DUCK_DIST : 0;
  enemyDuck += (targetDuck - enemyDuck) * Math.min(1, (targetDuck > enemyDuck ? 7 : 3) * dt);
  for (const e of enemies) {
    if (e.eagle) { updateEagle(e, dt); continue; }   // placed perching eagle (own state machine)
    if (e.eagleGuard) {                              // flying gear guard: hover around anchor + swoop at Abu
      e.phase += dt * 6;
      if (e.diveState === "dive") {
        const dx = e.diveTx - (e.x + e.w / 2), dy = e.diveTy - (e.y + e.h / 2), dist = Math.hypot(dx, dy) || 1;
        const sp = 300 * d;
        e.x += (dx / dist) * sp * dt; e.y += (dy / dist) * sp * dt; e.diveTimer -= dt;
        if (e.diveTimer <= 0 || dist < 14) e.diveState = "recover";
      } else if (e.diveState === "recover") {        // climb back toward the anchor
        e.x += ((e.ax - e.w / 2) - e.x) * Math.min(1, 3 * dt);
        e.y += ((e.ay - e.h) - e.y) * Math.min(1, 3 * dt);
        if (Math.hypot((e.x + e.w / 2) - e.ax, (e.y + e.h) - e.ay) < 10) { e.diveState = "cruise"; e.diveCd = rand(1.6, 3.0); }
      } else {                                       // cruise: drift around the anchor + bob
        e.patrolT += dt;
        e.x = e.ax - e.w / 2 + Math.sin(e.patrolT * 1.1) * e.range;
        e.y = (e.ay - e.h) + Math.sin(e.phase) * 8;
        e.diveCd -= dt;
        const near = Math.hypot((player.x + player.w / 2) - e.ax, (player.y + player.h / 2) - e.ay) < 280;
        if (e.diveCd <= 0 && near) { e.diveState = "dive"; e.diveTimer = 1.0; e.diveTx = player.x + player.w / 2; e.diveTy = player.y + player.h / 2; }
      }
      e.dir = (player.x + player.w / 2) < (e.x + e.w / 2) ? -1 : 1;   // face Abu
      if (e.hitFlash > 0) e.hitFlash -= dt;
      continue;
    }
    if (e.cobra) {                                   // stationary striking cobra: hold position, face Abu, spit poison
      e.y = e.ledgeTop - e.h;
      const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2, ccx = e.x + e.w / 2;
      e.dir = pcx > ccx ? 1 : -1;
      e.phase += dt;
      if (e.hitFlash > 0) e.hitFlash -= dt;
      e.spitCd -= dt;                                // poison spray when Abu is near + roughly level
      if (e.spitCd <= 0 && Math.abs(pcx - ccx) < COBRA_SPIT_RANGE && Math.abs(pcy - (e.y + e.h / 2)) < 95 && !player.dying) {
        spawnCobraSpit(e); e.spitCd = rand(1.3, 2.1);
      }
      continue;
    }
    if (e.wolf) {
      const pcx = player.x + player.w / 2, ecx = e.x + e.w / 2;
      const cf = currentLevel().caveFloor;
      // Engage only while Abu is DOWN on the cave floor AND near; otherwise give up.
      const engaged = player.inCave && Math.abs(pcx - ecx) < WOLF_TRIGGER_RANGE;
      if (engaged) {                                  // charge + lunge toward Abu (kept within the cave floor span)
        e.wolfState = "attack";
        e.dir = pcx < ecx ? -1 : 1;
        e.x += e.dir * WOLF_ATTACK_SPEED * d * dt;
        if (cf) e.x = Math.max(cf.x0 - 20, Math.min(cf.x1 - e.w, e.x));
      } else if (e.x < e.x0 || e.x + e.w > e.x1) {    // Abu gone -> walk back to the patrol zone
        e.wolfState = "patrol";
        e.dir = (ecx < e.x0) ? 1 : -1;
        e.x += e.dir * WOLF_PATROL_SPEED * d * dt;
      } else {                                         // pace the patrol zone
        e.wolfState = "patrol";
        e.x += e.dir * WOLF_PATROL_SPEED * d * dt;
        if (e.x <= e.x0) { e.x = e.x0; e.dir = 1; }
        else if (e.x + e.w >= e.x1) { e.x = e.x1 - e.w; e.dir = -1; }
      }
      // Stand on the LOWER cave-floor layer (not the arch top).
      let wfy = null;
      if (e.caveFloor && cf) wfy = caveFloorY(Math.max(cf.x0, Math.min(cf.x1, e.x + e.w / 2)));
      if (wfy == null) wfy = surfaceY(e.x + e.w / 2);
      e.y = wfy + (e.footPad || 0) - e.h;
      e.phase += dt;
      if (e.hitFlash > 0) e.hitFlash -= dt;
      continue;
    }
    if (e.croc) {                                    // lake crocodile: lurk at the bottom, lunge UP at a nearby swimmer
      const pcx = player.x + player.w / 2, ecx = e.x + e.w / 2;
      const near = player.inWater && Math.abs(pcx - ecx) < CROC_RANGE;
      if (near) {                                    // attack: face Abu, chase + rise to his depth
        e.crocState = "attack";
        e.dir = pcx < ecx ? -1 : 1;
        e.x += e.dir * CROC_CHASE * dt;
        const ty = (player.y + player.h) - e.h;
        e.y += Math.sign(ty - e.y) * CROC_RISE * dt;
      } else {                                       // lurk: drift the bottom, settle down to it
        e.crocState = "lurk";
        e.x += e.dir * CROC_PATROL * dt;
        if (e.x <= e.x0) { e.x = e.x0; e.dir = 1; } else if (e.x + e.w >= e.x1) { e.x = e.x1 - e.w; e.dir = -1; }
        e.y += Math.sign((e.bottomY - e.h) - e.y) * CROC_RISE * dt;
      }
      e.x = Math.max(e.x0, Math.min(e.x1 - e.w, e.x));
      e.y = Math.max(e.surfY, Math.min(e.bottomY - e.h, e.y));
      e.phase += dt;
      if (e.hitFlash > 0) e.hitFlash -= dt;
      continue;
    }
    if (e.guard) {                                   // ledge patrol: no scroll, turn at the edges
      e.x += e.dir * GUARD_SPEED * d * dt;
      if (e.x <= e.x0) { e.x = e.x0; e.dir = 1; }
      else if (e.x + e.w >= e.x1) { e.x = e.x1 - e.w; e.dir = -1; }
      // Patrol snakes hug the real ground under their belly (terrain isn't flat);
      // other guards keep their fixed ledge height.
      e.y = (e.followSurf ? surfaceY(e.x + e.w / 2) + (e.footPad || 0) : e.ledgeTop) - e.h;
      e.phase += dt * 6;
      if (e.hitFlash > 0) e.hitFlash -= dt;
      continue;
    }
    e.x -= ENEMY_SPEED * e.speed * d * dt;
    if (e.hitFlash > 0) e.hitFlash -= dt;
    const floor = natural ? enemyFloorY(e.x + e.w / 2) : GROUND_Y;
    if (e.type === "hopper") {
      // Gravity + a periodic hop while grounded (on the local terrain surface).
      e.vy += GRAVITY * dt; e.y += e.vy * dt;
      if (e.y + e.h >= floor) {
        e.y = floor - e.h; e.vy = 0;
        e.jumpTimer -= dt;
        if (e.jumpTimer <= 0) { e.vy = HOPPER_JUMP; e.jumpTimer = rand(0.5, 1.2); }
      }
    } else if (e.type === "flyer") {
      e.phase += dt * 3;
      const base = natural ? floor - e.h - 80 : e.baseY;
      if (e.dive) {
        // Dive-bomber (Level 5): cruise → swoop toward a locked-in target near the
        // player → pull back up. The target is captured at dive-start (not homing)
        // so the player can sidestep it.
        if (e.diveState === "dive") {
          const dx = e.diveTx - (e.x + e.w / 2), dy = e.diveTy - (e.y + e.h / 2);
          const dist = Math.hypot(dx, dy) || 1;
          const sp = 380 * d;
          e.x += (dx / dist) * sp * dt;
          e.y += (dy / dist) * sp * dt;
          e.diveTimer -= dt;
          if (e.y > floor - e.h - 4) e.y = floor - e.h - 4;     // don't punch through the ground
          if (e.diveTimer <= 0 || dist < 14 || e.y >= floor - e.h - 4) e.diveState = "recover";
        } else if (e.diveState === "recover") {
          e.y += (base - e.y) * Math.min(1, 4 * dt);             // climb back to cruise height
          if (Math.abs(e.y - base) < 5) { e.diveState = "cruise"; e.diveCd = rand(1.4, 3.0); }
        } else {                                                 // cruise
          e.y = base + Math.sin(e.phase) * 26;
          e.diveCd -= dt;
          const sxp = e.x - cameraX;
          const ahead = (e.x + e.w / 2) > (player.x + player.w / 2);  // only swoop from in front
          if (e.diveCd <= 0 && sxp > 40 && sxp < VIEW_W && ahead) {
            e.diveState = "dive"; e.diveTimer = 1.1;
            e.diveTx = player.x + player.w / 2;                  // lock the target now
            e.diveTy = player.y + player.h / 2;
          }

      } else {
        // Gentle float/bob (Levels 3-4).
        e.y = base + Math.sin(e.phase) * 26;
      }

      // walker & tank follow the uneven ground surface.
      e.y = floor - e.h;
    }

  }

  if (!ENEMIES_ENABLED) return;   // TEMP: snakes disabled for terrain testing
  enemySpawnTimer -= dt;
  if (enemySpawnTimer <= 0) {

    const ramp = 1 + Math.min(cameraX / 6000, 0.6);
