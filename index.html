// Animated waterfall overlaid on the painted cascade (lvl.waterfalls = [{xTop,
// yTop, xBot, yBot, wTop, wBot}]): a translucent body with downward-scrolling
// foam bands + moving vertical strands + a pulsing splash pool, so the painted
// water reads as flowing.
function drawWaterfalls() {
  const lvl = currentLevel();
  if (!lvl.waterfalls) return;
  const t = performance.now() / 1000;
  for (const wf of lvl.waterfalls) {
    const H = wf.yBot - wf.yTop;
    if (wf.xTop - cameraX < -80 || wf.xTop - cameraX > VIEW_W + 80) continue;
    ctx.save();
    const STEP = 4;
    for (let yy = 0; yy <= H; yy += STEP) {
      const f = yy / H;
      const cx = (wf.xTop + (wf.xBot - wf.xTop) * f) - cameraX;
      const wdt = wf.wTop + (wf.wBot - wf.wTop) * f;
      const y = wf.yTop + yy;
      ctx.fillStyle = "rgba(212,236,255,0.10)";                 // faint water body
      ctx.fillRect(cx - wdt / 2, y, wdt, STEP + 1);
      const band = Math.sin((f * 6 - t * 2.4) * 6.2832);        // bright foam bands scrolling DOWN
      if (band > 0.5) {
        ctx.fillStyle = "rgba(246,252,255," + (0.22 * (band - 0.5) / 0.5).toFixed(3) + ")";
        ctx.fillRect(cx - wdt / 2, y, wdt, STEP + 1);
      }
    }
    // Vertical strands: a few thin streaks with their own downward-scrolling glints.
    for (let k = -1; k <= 1; k++) {
      for (let yy = 0; yy <= H; yy += 6) {
        const f = yy / H;
        const cx = (wf.xTop + (wf.xBot - wf.xTop) * f) - cameraX + k * (wf.wTop + (wf.wBot - wf.wTop) * f) * 0.3;
        const g = Math.sin((f * 9 - t * 3.1 + k * 0.7) * 6.2832);
        if (g > 0.6) { ctx.fillStyle = "rgba(255,255,255," + (0.3 * (g - 0.6) / 0.4).toFixed(3) + ")"; ctx.fillRect(cx - 1, wf.yTop + yy, 2, 5); }
      }
    }
    // Foam cap at the lip + pulsing splash mist at the pool.
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath(); ctx.ellipse(wf.xTop - cameraX, wf.yTop + 2, wf.wTop * 0.75, 3, 0, 0, 6.28); ctx.fill();
    const puff = 0.5 + 0.5 * Math.sin(t * 3.3);
    ctx.fillStyle = "rgba(240,250,255," + (0.16 + 0.12 * puff).toFixed(3) + ")";
    ctx.beginPath(); ctx.ellipse(wf.xBot - cameraX, wf.yBot, wf.wBot * 0.8 * (0.9 + 0.2 * puff), 5 + 2 * puff, 0, 0, 6.28); ctx.fill();
    ctx.restore();
  }
}
// Plane (lvl.planes = [{x0, x1, y}]): flies ONE direction (left->right) from x0 to x1
// across the whole level at altitude y, then loops back and repeats. It tows a WHITE
// banner with a black Arabic message (Cairo font), drawn trailing behind it. Scenery.
const PLANE_DRAW_H = 44, PLANE_SPEED = 130, PLANE_FPS = 4;   // px/sec, one-directional looping flight
const PLANE_GAP = 234;   // the plane flies this far ABOVE Abu's head (constant gap, so it rises as he climbs)
// Three banners, shown one per fly-by loop (loop 1,2,3 then repeat). Each is a list of
// coloured text segments, so a single word can be a different colour.
const PLANE_BANNERS = [
  [{ text: "نسافر لنجمع التجارب و ليس الاغراض", color: "#111" }],            // loop 1 (Arabic)
  [{ text: "Don't dream it, live it.", color: "#111" }],                     // loop 2
  [{ text: "Join the ", color: "#111" }, { text: "aiknowmads", color: "#d11a2a" }, { text: " community", color: "#111" }],   // loop 3
];
const PLANE_BANNER_FONT = "700 13px Cairo, 'Segoe UI', sans-serif";
// Each banner is built once to an offscreen canvas (white flag + coloured text), then
// blitted in vertical strips with a travelling sine so it ripples / waves.
let planeBanners = null, planeBannersCairo = false;
function buildBanner(segments) {
  const bh = 26;
  const probe = document.createElement("canvas").getContext("2d");
  probe.font = PLANE_BANNER_FONT;
  let textW = 0; for (const s of segments) textW += probe.measureText(s.text).width;
  const bw = Math.ceil(textW) + 24;
  const off = document.createElement("canvas"); off.width = bw; off.height = bh;
  const o = off.getContext("2d");
  o.font = PLANE_BANNER_FONT; o.textAlign = "left"; o.textBaseline = "middle";
  o.fillStyle = "#fff"; o.fillRect(0, 0, bw, bh);
  o.strokeStyle = "rgba(20,20,20,0.85)"; o.lineWidth = 1.5; o.strokeRect(0.75, 0.75, bw - 1.5, bh - 1.5);
  let x = (bw - textW) / 2;                                       // centre the whole line
  for (const s of segments) { o.fillStyle = s.color; o.fillText(s.text, x, bh / 2 + 1); x += o.measureText(s.text).width; }
  return { canvas: off, w: bw, h: bh };
}
function ensurePlaneBanner() {
  const cairo = !!(document.fonts && document.fonts.check && document.fonts.check("700 13px Cairo"));
  if (planeBanners && cairo === planeBannersCairo) return;   // rebuild once when Cairo finishes loading
  planeBanners = PLANE_BANNERS.map(buildBanner);
  planeBannersCairo = cairo;
}
function drawPlanes() {
  const lvl = currentLevel();
  if (!lvl.planes) return;
  const img = imgLoaded.planeAbu && images.planeAbu;
  const t = performance.now() / 1000, fi = Math.floor(t * PLANE_FPS) % 2;
  let planeW = 100;
  if (img) planeW = PLANE_DRAW_H * ((img.naturalWidth / 2) / img.naturalHeight);
  for (const p of lvl.planes) {
    const span = p.x1 - p.x0;
    const wx = p.x0 + (((t * PLANE_SPEED + (p.phase || 0)) % span) + span) % span;   // fly x0 -> x1, then loop
    const sx = wx - cameraX;
    if (player.onGround) p._head = player.y;      // track Abu's STANDING head height (ignore jumps)
    const baseHead = (p._head != null ? p._head : player.y);
    let target = baseHead - PLANE_GAP; if (target < 16) target = 16;   // constant gap above Abu; clamp so the banner stays on screen when he's very high
    if (p._cy == null) p._cy = target;
    p._cy += (target - p._cy) * 0.05;             // smooth follow as he climbs to a new height
    const cy = p._cy;
    if (sx < -80 || sx > VIEW_W + 320) continue;
    // --- towed waving banner (trails behind = to the left) ---
    ensurePlaneBanner();
    const loops = Math.floor((t * PLANE_SPEED + (p.phase || 0)) / span);   // which fly-by -> which banner
    const banner = planeBanners[((loops % planeBanners.length) + planeBanners.length) % planeBanners.length];
    const bw = banner.w, bh = banner.h, bRight = sx - planeW * 0.49, bLeft = bRight - bw, byTop = cy - bh / 2;
    ctx.strokeStyle = "rgba(40,40,40,0.85)"; ctx.lineWidth = 1.5;         // short tow rope tying the banner to the tail
    ctx.beginPath(); ctx.moveTo(sx - planeW * 0.43, cy); ctx.lineTo(bRight, cy); ctx.stroke();
    if (banner.canvas) {                                                  // blit in strips with a travelling sine -> waving flag
      const tw = performance.now() / 1000, STRIP = 3;
      for (let xo = 0; xo < bw; xo += STRIP) {
        const sw2 = Math.min(STRIP, bw - xo);
        const wave = Math.sin((xo / bw) * 6.5 + tw * 6) * 2.6;
        ctx.drawImage(banner.canvas, xo, 0, sw2, bh, bLeft + xo, byTop + wave, sw2, bh);
      }
    }
    // --- plane (art faces left -> flip to head right) ---
    if (img) {
      const cw = img.naturalWidth / 2, ch = img.naturalHeight;
      ctx.save(); ctx.translate(sx, cy); ctx.scale(-1, 1);
      ctx.drawImage(img, fi * cw, 0, cw, ch, -planeW / 2, -PLANE_DRAW_H / 2, planeW, PLANE_DRAW_H);
      ctx.restore();
    }
  }
}
// Planted signpost scenery (lvl.signs = [{x, top}]): the source post foot sits at
// image (SIGN_FOOT_X, SIGN_FOOT_Y); plant it on the surface at (x, top).
const SIGN_DRAW_H = 128, SIGN_FOOT_X = 280, SIGN_FOOT_Y = 610;
function drawSigns() {
  const lvl = currentLevel();
  if (!lvl.signs || !imgLoaded.austriaSign) return;
  const img = images.austriaSign, s = SIGN_DRAW_H / img.naturalHeight;
  for (const sg of lvl.signs) {
    const sx = sg.x - cameraX;
    if (sx < -160 || sx > VIEW_W + 160) continue;
    ctx.drawImage(img, sx - SIGN_FOOT_X * s, sg.top - SIGN_FOOT_Y * s, img.naturalWidth * s, img.naturalHeight * s);
  }
}
function drawClimbRopes() {
  const lvl = currentLevel();
  if (!lvl.climbRopes || !imgLoaded.horizontalRope) return;
  const img = images.horizontalRope, span = HROPE_AX1 - HROPE_AX0;
  for (const r of lvl.climbRopes) {
    const dx0 = r.x0 - cameraX, dx1 = r.x1 - cameraX;
    if (Math.max(dx0, dx1) < 0 || Math.min(dx0, dx1) > VIEW_W) continue;
    const s = (r.x1 - r.x0) / span;                  // scale image so anchors land on x0/x1
    ctx.save();
    ctx.translate(dx0, r.y);                          // image anchor-left -> (x0, ropeY)
    ctx.scale(s, s);
    ctx.drawImage(img, -HROPE_AX0, -HROPE_AY);        // strand (HROPE_AY) sits at world ropeY
    ctx.restore();
  }
}
function drawRopeAnchors() {
  const lvl = currentLevel();
  if (!lvl.ropeAnchors || !imgLoaded.ropeAnchorHill) return;
  const img = images.ropeAnchorHill, span = ROPE_AX1 - ROPE_AX0;
  for (const r of lvl.ropeAnchors) {
    const dx0 = r.x0 - cameraX, dy0 = r.y0, dx1 = r.x1 - cameraX, dy1 = r.y1;
    if (Math.max(dx0, dx1) < 0 || Math.min(dx0, dx1) > VIEW_W) continue;
    const s = Math.hypot(dx1 - dx0, dy1 - dy0) / span;
    ctx.save();
    ctx.translate(dx0, dy0);
    ctx.rotate(Math.atan2(dy1 - dy0, dx1 - dx0));
    ctx.scale(s, s);
    ctx.drawImage(img, -ROPE_AX0, -ROPE_AY);   // anchor-left -> (dx0,dy0); anchor-right -> (dx1,dy1)
    ctx.restore();
  }
}

function drawPlatforms() {
  // On natural levels the platforms are painted into the foreground art; the
  // collision boxes are invisible, so don't draw them.
  if (currentLevel().terrain === "natural") return;
  for (const p of platforms) {
    const sx = p.x - cameraX;
    if (sx > VIEW_W || sx + p.w < 0) continue;

    ctx.save();
    if (imgLoaded.platform) {
      // Tile the stone texture across the platform width.
      const img = images.platform;
      const tileW = img.naturalWidth * (p.h / img.naturalHeight);
      let drawn = 0;
      while (drawn < p.w) {
        const w = Math.min(tileW, p.w - drawn);
        const sw = img.naturalWidth * (w / tileW);
        ctx.drawImage(img, 0, 0, sw, img.naturalHeight, sx + drawn, p.y, w, p.h);
        drawn += w;
      }
    } else {
      ctx.fillStyle = "#7a756d"; ctx.fillRect(sx, p.y, p.w, p.h);
    }

    // Type cues so the player can read each platform at a glance.
    if (p.kind === "mover") {
      ctx.strokeStyle = "rgba(120,220,255,0.9)"; ctx.lineWidth = 2;
      ctx.strokeRect(sx + 1, p.y + 1, p.w - 2, p.h - 2);
      ctx.fillStyle = "rgba(120,220,255,0.95)";
      const cyp = p.y + p.h / 2;
      if (p.axis === "y") {  // up/down chevrons
        const mx = sx + p.w / 2;
        ctx.beginPath(); ctx.moveTo(mx - 6, cyp + 2); ctx.lineTo(mx, cyp - 5); ctx.lineTo(mx + 6, cyp + 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(mx - 6, cyp - 2); ctx.lineTo(mx, cyp + 5); ctx.lineTo(mx + 6, cyp - 2); ctx.fill();
      } else {               // left/right chevrons
        ctx.beginPath(); ctx.moveTo(sx + 10, cyp - 6); ctx.lineTo(sx + 4, cyp); ctx.lineTo(sx + 10, cyp + 6); ctx.fill();
        ctx.beginPath(); ctx.moveTo(sx + p.w - 10, cyp - 6); ctx.lineTo(sx + p.w - 4, cyp); ctx.lineTo(sx + p.w - 10, cyp + 6); ctx.fill();
      }
    }
    ctx.restore();
  }
}

// Empty holes — a dark chasm carved into the ground over each pit span.
function drawPits() {
  const top = GROUND_Y;
  for (const pit of pits) {
    const sx = pit.x - cameraX;
    if (sx > VIEW_W || sx + pit.w < 0) continue;
    const g = ctx.createLinearGradient(0, top, 0, VIEW_H);
    g.addColorStop(0, "#2a241e"); g.addColorStop(0.4, "#140f0b"); g.addColorStop(1, "#000000");
    ctx.fillStyle = g; ctx.fillRect(sx, top, pit.w, VIEW_H - top);
    // Inner edge shadow so the rim reads as a carved hole.
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(sx, top, 4, VIEW_H - top);
    ctx.fillRect(sx + pit.w - 4, top, 4, VIEW_H - top);
  }
}


// Knife pickups on the climb top ledges: the camping-knife sprite with a gentle bob.
function drawKnifeItems() {
  if (!imgLoaded.knife) return;
  const img = images.knife, ar = img.naturalHeight / img.naturalWidth;
  for (const k of knifeItems) {
    if (k.collected) continue;
    const sx = k.x - cameraX;
    if (sx > VIEW_W || sx + k.w < 0) continue;
    const bob = Math.sin(performance.now() / 300 + k.t) * 3, dw = k.w, dh = dw * ar;
    ctx.drawImage(img, sx, k.y + (k.h - dh) / 2 + bob, dw, dh);
  }
}

function drawEnergyItems() {
  if (!imgLoaded.energyBottle) { return; }
  const img = images.energyBottle, ratio = img.naturalWidth / img.naturalHeight;
  for (const e of energyItems) {
    if (e.collected) continue;
    const sx = e.x - cameraX;
    if (sx > VIEW_W || sx + e.w < 0) continue;
    const bob = Math.sin(performance.now() / 300 + e.t) * 3;
    const dh = e.h, dw = dh * ratio;                       // aspect-correct, fit to hitbox height
    ctx.save();                                            // soft green energy glow
    ctx.globalAlpha = 0.4; ctx.fillStyle = "#7CFFB2";
    ctx.beginPath(); ctx.ellipse(sx + e.w / 2, e.y + e.h / 2 + bob, e.w * 0.7, e.h * 0.42, 0, 0, 6.28); ctx.fill();
    ctx.restore();
    ctx.drawImage(img, sx + (e.w - dw) / 2, e.y + e.h - dh + bob, dw, dh);
  }
}
function drawLifeItems() {
  if (!imgLoaded.edelweiss) return;
  const img = images.edelweiss, ratio = img.naturalWidth / img.naturalHeight;
  for (const e of lifeItems) {
    if (e.collected) continue;
    const sx = e.x - cameraX;
    if (sx > VIEW_W || sx + e.w < 0) continue;
    const dh = e.h, dw = dh * ratio;
    ctx.drawImage(img, sx + (e.w - dw) / 2, e.y + e.h - dh, dw, dh);   // foot-anchored (planted on the ground)
  }
}
function drawCarabiners() {
  for (const c of carabiners) {
    const sx = c.x - cameraX;
    if (sx > VIEW_W || sx + c.w < 0) continue;
    const bob = Math.sin(performance.now() / 300 + c.t) * 3;
    if (imgLoaded.carabiner) ctx.drawImage(images.carabiner, sx, c.y + bob, c.w, c.h);
    else {
      // Fallback: a metallic-grey oblong ring (carabiner shape).
      const cx = sx + c.w / 2, cy = c.y + c.h / 2 + bob;
      ctx.lineWidth = Math.max(3, c.w * 0.28); ctx.strokeStyle = "#aeb6c2";
      ctx.beginPath();
      ctx.ellipse(cx, cy, c.w / 2 - 1, c.h / 2 - 1, 0, 0, 6.28);
      ctx.stroke();
      ctx.fillStyle = "#d94f44";  // gate spring dot
      ctx.beginPath(); ctx.arc(cx + c.w / 2 - 2, c.y + bob + 4, 2.5, 0, 6.28); ctx.fill();
    }
  }
}

// Collectible gear sitting on the path: gentle bob + soft glow ring so it reads as a pickup.
function drawGear() {
  for (const it of gearItems) {
    const sx = it.x - cameraX;
    if (sx > VIEW_W || sx + it.w < 0) continue;
    const bob = Math.sin(performance.now() / 320 + it.t) * 3, cy = it.y + bob;
    ctx.save();
    ctx.globalAlpha = 0.5; ctx.fillStyle = "#ffe07a";
    ctx.beginPath(); ctx.ellipse(sx + it.w / 2, cy + it.h / 2, it.w * 0.7, it.h * 0.6, 0, 0, 6.28); ctx.fill();
    ctx.restore();
    if (imgLoaded[it.asset]) ctx.drawImage(images[it.asset], sx, cy, it.w, it.h);
    else { ctx.fillStyle = "#ffb627"; ctx.fillRect(sx, cy, it.w, it.h); }
  }
}

// Procedural slither: draw a single side-on snake sprite in vertical slices, each
// pushed up/down by a traveling sine wave so the body undulates head-to-tail.
// Per-enemy phase desyncs them; falls back to the static sprite if not loaded.
function drawEnemyAnim(e, dx, dy, dw, dh) {
  const a = e.anim;
  if (!a || !imgLoaded[a.key]) { drawSprite("enemy", dx, dy, dw, dh, e.color); return; }
  const img = images[a.key];
  const sw = img.naturalWidth, sh = img.naturalHeight;
  const N = a.slices || 24, amp = a.amp || 3, waves = a.waves || 2, speed = a.speed || 5;
  const t = performance.now() / 1000;
  const ssw = sw / N, dsw = dw / N;
  const conform = a.conform !== false;   // each slice rests on the ground at its own x
  // Per-slice ground height, then SMOOTHED: a sharp terrain step or a tile seam
  // would otherwise drop adjacent slices far apart and tear the snake into two
  // pieces — smoothing makes the body bend over it in one continuous run.
  let floor = null;
  if (conform) {
    floor = new Array(N);
    for (let i = 0; i < N; i++) floor[i] = enemyFloorY(e.x + ((i + 0.5) / N) * e.w);
    for (let pass = 0; pass < 6; pass++) {
      const cp = floor.slice();
      for (let i = 0; i < N; i++)
        floor[i] = (cp[Math.max(0, i - 1)] + cp[i] + cp[Math.min(N - 1, i + 1)]) / 3;
    }
  }
  for (let i = 0; i < N; i++) {
    // Upward-biased wave (range [-2amp, 0]) so the belly stays planted and the
    // body humps up between contacts — never floats.
    const off = amp * (Math.sin((i / N) * waves * 6.2832 - t * speed + (e.phase || 0)) - 1);
    const top = conform ? (floor[i] - dh + off) : (dy + off);
    ctx.drawImage(img, i * ssw, 0, ssw, sh, dx + i * dsw, top, dsw + 1, dh);
  }
}

function drawEnemies() {
  for (const e of enemies) {
    const sx = e.x - cameraX;
    if (e.eagle) { drawEagleShadow(e); drawEagle(e); continue; }   // placed eagle (own renderer + wider cull)
    if (sx > VIEW_W || sx + e.w < 0) continue;
    if (e.eagleGuard) {                                  // flying baby eagle, drawn wider than its body box
      const fr = e.frames, img = imgLoaded[fr.key] && images[fr.key];
      if (img) {
        const cw = img.naturalWidth / fr.count;
        // diving = talons-out attack frames (3,4); otherwise the 3-frame glide/flap (0-2)
        const fi = e.diveState === "dive" ? 3 + (Math.floor(performance.now() / 90) % 2)
                                          : Math.floor(performance.now() / (1000 / fr.fps)) % 3;
        const DH = e.h * 2.6, DW = DH * (cw / img.naturalHeight);   // square cell -> DW≈DH
        ctx.save();
        ctx.translate(sx + e.w / 2, e.y + e.h / 2);
        if (e.dir < 0) ctx.scale(-1, 1);                            // art faces right; flip when facing left
        if (e.hitFlash > 0) { ctx.globalAlpha = 0.6; }
        ctx.drawImage(img, fi * cw, 0, cw, img.naturalHeight, -DW / 2, -DH / 2, DW, DH);
        ctx.restore();
      } else { ctx.fillStyle = "#a4763a"; ctx.fillRect(sx, e.y, e.w, e.h); }
      continue;
    }
    if (e.wolf) {                                        // wolf: walk frames 0-2 patrolling, lunge frames 3-4 attacking
      const fr = e.frames, img = imgLoaded[fr.key] && images[fr.key];
      if (img) {
        const cw = img.naturalWidth / 5, ch = img.naturalHeight;
        const fi = e.wolfState === "attack" ? 3 + (Math.floor(performance.now() / 120) % 2)
                                            : Math.floor(performance.now() / (1000 / fr.fps)) % 3;
        const DH = e.h / 0.36, DW = DH * (cw / ch), footY = e.y + e.h, cxp = sx + e.w / 2, WF = 0.70;
        ctx.save();
        if (e.hitFlash > 0) ctx.globalAlpha = 0.6;
        if (e.dir > 0) { ctx.translate(cxp, 0); ctx.scale(-1, 1); ctx.drawImage(img, fi * cw, 0, cw, ch, -DW / 2, footY - WF * DH, DW, DH); }
        else ctx.drawImage(img, fi * cw, 0, cw, ch, cxp - DW / 2, footY - WF * DH, DW, DH);   // art faces left
        ctx.restore();
      } else { ctx.fillStyle = "#888"; ctx.fillRect(sx, e.y, e.w, e.h); }
      // hp pips: 3 small hearts above the wolf (killed by 3 knives or 3 stomps)
      const maxHp = e.maxHp || 3, HHS = 9, HHG = 2, totalW = maxHp * HHS + (maxHp - 1) * HHG;
      const headY = (e.y + e.h) - 0.70 * (e.h / 0.36) - 9, cxh = sx + e.w / 2;
      let hhx = cxh - totalW / 2 + HHS / 2;
      for (let i = 0; i < maxHp; i++) { drawHeart(hhx, headY, HHS, i < e.hp ? "#ff3b46" : "rgba(70,35,38,0.65)"); hhx += HHS + HHG; }
      continue;
    }
    if (e.croc) {                                        // lake crocodile: 0-3 swim/lurk, 4-5 jaws-open attack
      const fr = e.frames, img = imgLoaded[fr.key] && images[fr.key];
      if (img) {
        const cw = img.naturalWidth / 6, ch = img.naturalHeight;
        const fi = e.crocState === "attack" ? 4 + (Math.floor(performance.now() / 160) % 2)
                                            : Math.floor(performance.now() / (1000 / fr.fps)) % 4;
        const DH = e.h / 0.46, DW = DH * (cw / ch), footY = e.y + e.h, cxp = sx + e.w / 2, WF = 0.969;
        ctx.save();
        if (e.hitFlash > 0) ctx.globalAlpha = 0.6;
        if (e.dir < 0) { ctx.translate(cxp, 0); ctx.scale(-1, 1); ctx.drawImage(img, fi * cw, 0, cw, ch, -DW / 2, footY - WF * DH, DW, DH); }   // art faces RIGHT; flip to face left
        else ctx.drawImage(img, fi * cw, 0, cw, ch, cxp - DW / 2, footY - WF * DH, DW, DH);
        ctx.restore();
      } else { ctx.fillStyle = "#4a6b3a"; ctx.fillRect(sx, e.y, e.w, e.h); }
      const maxHpC = e.maxHp || 3, HS = 9, HG = 2, tW = maxHpC * HS + (maxHpC - 1) * HG;
      let hx = sx + e.w / 2 - tW / 2 + HS / 2;
      for (let i = 0; i < maxHpC; i++) { drawHeart(hx, e.y - 12, HS, i < e.hp ? "#ff3b46" : "rgba(70,35,38,0.65)"); hx += HS + HG; }
      continue;
    }
    if (e.cobra) {                                       // stationary cobra: sway idle, strike when Abu nears
      const fr = e.frames, img = imgLoaded[fr.key] && images[fr.key];
      if (img) {
        const cw = img.naturalWidth / fr.count, ch = img.naturalHeight;
        const near = Math.abs((player.x + player.w / 2) - (e.x + e.w / 2)) < 150 &&
                     Math.abs((player.y + player.h / 2) - (e.y + e.h / 2)) < 120;
        const seq = near ? [3, 4, 4, 3] : [0, 1, 2, 1];   // strike vs idle sway
        const cfps = near ? 8 : 4;
        const fi = seq[Math.floor(performance.now() / (1000 / cfps)) % seq.length];
        const DH = e.h / 0.597, DW = DH * (cw / ch);       // content (~0.597 of cell) ≈ hitbox height
        const footY = e.y + e.h, cxp = sx + e.w / 2, COBRA_FOOT = 0.815;
        ctx.save();
        if (e.hitFlash > 0) ctx.globalAlpha = 0.6;
        if (e.dir < 0) { ctx.translate(cxp, 0); ctx.scale(-1, 1); ctx.drawImage(img, fi * cw, 0, cw, ch, -DW / 2, footY - COBRA_FOOT * DH, DW, DH); }
        else ctx.drawImage(img, fi * cw, 0, cw, ch, cxp - DW / 2, footY - COBRA_FOOT * DH, DW, DH);   // faces right by default; flip to face Abu on the left
        ctx.restore();
      } else { ctx.fillStyle = "#6a3"; ctx.fillRect(sx, e.y, e.w, e.h); }
      continue;
    }
    if (e.guard) {                                       // red ledge-patrol snake (2-frame walk)
      const fr = e.frames, img = images[fr.key];
      ctx.save();
      if (imgLoaded[fr.key]) {
        const cw = img.naturalWidth / fr.count, fi = Math.floor(performance.now() / (1000 / fr.fps)) % fr.count;
        if (e.dir > 0) { ctx.translate(sx + e.w, 0); ctx.scale(-1, 1); ctx.drawImage(img, fi * cw, 0, cw, img.naturalHeight, 0, e.y, e.w, e.h); }
        else ctx.drawImage(img, fi * cw, 0, cw, img.naturalHeight, sx, e.y, e.w, e.h);   // faces left; flip moving right
      } else { ctx.fillStyle = "#c33"; ctx.fillRect(sx, e.y, e.w, e.h); }
      ctx.restore();
      continue;
    }

    const lvl = currentLevel();
    // Resolve this enemy's animation, most-specific first: a per-CREATURE strip
    // (Level 5 gauntlet), then a per-TYPE strip (Level 4 wolves+falcons), then the
    // level-wide enemyFrames (single-creature levels).
    const frames = e.frames || (lvl.enemyTypeFrames && lvl.enemyTypeFrames[e.type]) || lvl.enemyFrames;
    // Whether this enemy draws its own art (frame strip or animated sprite) — if so,
    // skip the generic glow / triangle-wings / armour-plate overlays.
    const hasArt = !!frames || !!e.anim;

    // Flapping wings behind a flyer (skipped when a frame-animated flyer sprite is used).
    if (e.type === "flyer" && !frames) {
      const flap = Math.sin(performance.now() / 90) * 6;
      const wy = e.y + e.h * 0.4;
      ctx.fillStyle = "rgba(232,228,255,0.9)";
      ctx.beginPath();
      ctx.moveTo(sx + 4, wy); ctx.lineTo(sx - 16, wy - 11 + flap); ctx.lineTo(sx - 16, wy + 11 + flap);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(sx + e.w - 4, wy); ctx.lineTo(sx + e.w + 16, wy - 11 + flap); ctx.lineTo(sx + e.w + 16, wy + 11 + flap);
      ctx.closePath(); ctx.fill();
    }

    const spriteKey = lvl.enemySprite || "enemy";
    const customSprite = spriteKey !== "enemy";
    // A soft type-coloured glow so each variety reads at a glance (skip it for a
    // detailed per-level sprite like the bear, where it just muddies the art).
    if (e.type !== "walker" && !customSprite && !hasArt) {
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = e.color;
      const gx = sx + e.w / 2, gy = e.y + e.h / 2;
      const gr = Math.max(e.w, e.h) * 0.62;
      const grad = ctx.createRadialGradient(gx, gy, gr * 0.3, gx, gy, gr);
      grad.addColorStop(0, e.color);
      grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(gx, gy, gr, 0, 6.2832); ctx.fill();
      ctx.restore();
    }

    // Body. Hoppers squash/stretch with vertical speed.
    let dw = e.w, dh = e.h, dy = e.y;
    if (e.type === "hopper") {
      const stretch = e.vy < -40 ? 1.12 : (e.vy > 80 ? 0.9 : 1);
      dh = e.h * stretch; dw = e.w * (2 - stretch); dy = e.y + (e.h - dh);
    }
    const walk = e.walk || lvl.enemyWalk;
    if (e.anim) {
      drawEnemyAnim(e, sx + (e.w - dw) / 2, dy, dw, dh);
    } else if (frames && imgLoaded[frames.key]) {
      // Frame-based animation strip (4-frame bear walk, gyrfalcon flap, …): step
      // through the strip at a fixed fps, desynced per enemy via its phase.
      const img = images[frames.key];
      const count = frames.count || 4, fps = frames.fps || 7;
      const cellW = img.naturalWidth / count, cellH = img.naturalHeight;
      const fi = Math.floor(performance.now() / 1000 * fps + (e.phase || 0) * 2) % count;
      // Draw at the frame's true aspect so nothing is squashed; `scale` lets a
      // wide-winged sprite spill beyond its (smaller) hitbox.
      const drawW = dw * (frames.scale || 1);
      const drawH = drawW / (frames.aspect || (cellW / cellH));
      const cx = sx + e.w / 2;
      let topY;
      if (frames.anchor === "center") {
        topY = e.y + e.h / 2 - drawH / 2;          // flyer: centre the body on the box
      } else {
        const ph = performance.now() / 1000 * (walk ? walk.speed : 7) + (e.phase || 0);
        const bobY = walk ? -(walk.bob || 2) * Math.abs(Math.sin(ph)) : 0;
        topY = e.y + e.h + bobY - drawH;           // ground walker: sit on its feet
      }
      const flip = e.vx > 0;   // strip faces left; flip when moving right
      ctx.save();
      if (flip) { ctx.translate(cx * 2, 0); ctx.scale(-1, 1); }
      ctx.drawImage(img, fi * cellW, 0, cellW, cellH, cx - drawW / 2, topY, drawW, drawH);
      ctx.restore();
    } else if (walk && customSprite && imgLoaded[spriteKey]) {
      // Procedural lumbering walk for a static creature sprite (e.g. the bear):
      // body bobs up on each step, squashes at footfall, with a slow weight sway.
      const ph = performance.now() / 1000 * (walk.speed || 7) + (e.phase || 0);
      const step = Math.abs(Math.sin(ph));                 // 0 at footfall, 1 mid-step
      const bobY = -(walk.bob || 3) * step;                // lift the body on each step
      const sway = (walk.sway || 2) * Math.sin(ph * 0.5);  // slow side weight shift
      const sq = 1 - (walk.squash || 0.1) * (1 - step);    // squash at footfall
      const drawH = dh * sq, footY = e.y + e.h, cx = sx + e.w / 2 + sway;
      ctx.drawImage(images[spriteKey], cx - dw / 2, footY + bobY - drawH, dw, drawH);
    } else {
      drawSprite(spriteKey, sx + (e.w - dw) / 2, dy, dw, dh, e.color);
    }

    // Tank: armour plate (only on the generic sprite) + remaining-HP pips above it.
    if (e.type === "tank") {
      if (!customSprite && !hasArt) {
        ctx.fillStyle = "rgba(55,65,75,0.5)";
        ctx.fillRect(sx + 5, e.y + 6, e.w - 10, e.h * 0.34);
      }
      for (let i = 0; i < e.hp; i++) {
        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(sx + 6 + i * 11, e.y - 9, 8, 5);
      }
    }

    // White flash when an enemy survived a stomp.
    if (e.hitFlash > 0 && Math.floor(performance.now() / 60) % 2 === 0) {
      ctx.globalAlpha = 0.5; ctx.fillStyle = "#fff";
      ctx.fillRect(sx, e.y, e.w, e.h); ctx.globalAlpha = 1;
    }
  }
}

function drawPlayer() {
  if (invulnTimer > 0 && Math.floor(performance.now() / 80) % 2 === 0) return;
  const sx = player.x - cameraX;

  // Energy-bottle transformation: drink -> energy surge -> flex (3 frames), drawn
  // a touch larger than Abu since the powered sprite is bulkier. Frozen meanwhile.
  if (player.powerupAnimT > 0 && imgLoaded.abuPowerup) {
    const img = images.abuPowerup, cw = img.naturalWidth / POWERUP_FRAMES, ch = img.naturalHeight;
    const prog = 1 - player.powerupAnimT / POWERUP_ANIM_TIME;       // 0..1 across the strip
    const fi = Math.min(POWERUP_FRAMES - 1, Math.floor(prog * POWERUP_FRAMES));
    const dh = player.h * 1.28, dw = dh * (cw / ch);
    ctx.save();
    ctx.translate(sx + player.w / 2, player.y + player.h);
    if (player.facing < 0) ctx.scale(-1, 1);   // powerup art faces RIGHT; flip when going left
    ctx.drawImage(img, fi * cw, 0, cw, ch, -dw / 2, -dh, dw, dh);
    ctx.restore();
    return;
  }

  // Playable summit climb: Abu holds the rope. Use the dedicated hand-over-hand
  // sheet if present (frames cadence by distance climbed); else the geared-up
  // "ready" frame as a placeholder, bobbing a little while climbing.
  if (inClimb) {
    const fx = sx + player.w / 2, footY = player.y + player.h, moving = Math.abs(player.vx) > 1;
    if (imgLoaded.abuRopeClimb) {
      const fi = Math.floor(climbRopeT * CLIMB_TOTAL / 24) % CLIMB_ROPE_FRAMES;
      // hang from the rope: drop him so his raised fists (sprite top) grip the rope line.
      drawSheetAbu(images.abuRopeClimb, CLIMB_ROPE_FRAMES, moving ? fi : 0, fx, footY + CLIMB_ABU_H * 0.88, player.facing);
    } else if (imgLoaded.abuGearup) {
      const bob = moving ? Math.sin(performance.now() / 90) * 2 : 0;
      drawGearedAbu(GEARUP_FRAMES - 1, fx, footY + bob, player.facing);
    }
    return;
  }

  // Hand-over-hand across a horizontal traverse rope (Level 1): hang below, the
  // raised-fist sprite top gripping the strand; frames cadence by distance moved.
  if (player.traverse && imgLoaded.abuClimbsHill) {
    const img = images.abuClimbsHill, n = 4, cw = img.naturalWidth / n, ch = img.naturalHeight;
    const moving = Math.abs(anyKey(LEFT_KEYS) ? 1 : 0) || (anyKey(RIGHT_KEYS) ? 1 : 0);
    const fi = moving ? Math.floor(player.traverseAnim * 8) % n : 0;
    const H = 104, W = H * (cw / ch);
    ctx.save();
    ctx.translate(sx + player.w / 2, player.traverse.y - ROPE_GRAB_V);   // origin at the grip (rope strand)
    if (player.facing < 0) ctx.scale(-1, 1);
    ctx.drawImage(img, fi * cw, 0, cw, ch, -W / 2, -H * (54 / ch), W, H);  // raised fists (sprite y≈54) at the strand
    ctx.restore();
    return;
  }

  // Resting inside a shelter (Level 1): sit down and breathe while power recharges.
  if (playerSheltered && player.onGround && Math.abs(player.vx) < 1 && imgLoaded.abuRest) {
    const img = images.abuRest, cw = img.naturalWidth / 2, ch = img.naturalHeight;
    const fi = Math.floor(performance.now() / 700) % 2;   // slow breathing loop
    const dh = 52, dw = dh * (cw / ch);
    ctx.save();
    ctx.translate(sx + player.w / 2, player.y + player.h);   // seat on the platform top
    if (player.facing < 0) ctx.scale(-1, 1);                  // rest sprite faces right
    ctx.drawImage(img, fi * cw, 0, cw, ch, -dw / 2, -dh, dw, dh);
    ctx.restore();
    return;
  }

  // Death (any cause): 3-frame Abu_Dies — shock -> kneel -> collapsed.
  if ((player.dying || player.fatalFalling) && (imgLoaded.abuDies || imgLoaded.abuFatalFall)) {
    const useDies = imgLoaded.abuDies;
    const img = useDies ? images.abuDies : images.abuFatalFall, n = 3, cw = img.naturalWidth / n, ch = img.naturalHeight;
    const p = player.dying ? player.dyingTimer / DEATH_SEQ_TIME : 1;   // 1 -> 0 over the death
    const fi = !player.dying ? 0 : (p > 0.66 ? 0 : (p > 0.33 ? 1 : 2));
    const dh = player.h * 1.4, dw = dh * (cw / ch);
    const footFrac = useDies ? 0.775 : 1;                              // Abu_Dies has padding below the feet
    ctx.save();
    ctx.translate(sx + player.w / 2, player.y + player.h);
    if (player.facing > 0) ctx.scale(-1, 1);
    ctx.drawImage(img, fi * cw, 0, cw, ch, -dw / 2, -dh * footFrac, dw, dh);
    ctx.restore();
    return;
  }

  // Speargun shot (in water): play the 4-frame firing animation (art faces RIGHT).
  if (player.inWater && player.harpoonAnimT > 0 && imgLoaded.abuHarpoon) {
    const img = images.abuHarpoon, n = 4, cw = img.naturalWidth / n, ch = img.naturalHeight;
    const prog = 1 - player.harpoonAnimT / HARPOON_ANIM_TIME;
    const fi = Math.min(n - 1, Math.floor(prog * n));
    const dh = player.h * 0.91, dw = dh * (cw / ch);   // sized so Abu's body matches the swim sprite
    ctx.save();
    ctx.translate(sx + player.w / 2, player.y + player.h / 2);
    if (player.facing < 0) ctx.scale(-1, 1);          // art faces RIGHT; flip to aim left
    ctx.drawImage(img, fi * cw, 0, cw, ch, -dw / 2, -dh * 0.55, dw, dh);
    ctx.restore();
    return;
  }
  // Deep-water swim (seq7): horizontal 6-frame stroke, centred on Abu's body at the surface.
  if (player.inWater && imgLoaded.abuSwim) {
    const img = images.abuSwim, n = 6, cw = img.naturalWidth / n, ch = img.naturalHeight;
    const fi = Math.floor((player.swimPhase || 0)) % n;
    const dh = player.h * 2.6, dw = dh * (cw / ch);   // wide horizontal swimmer
    ctx.save();
    ctx.translate(sx + player.w / 2, player.y + player.h / 2);
    if (player.facing > 0) ctx.scale(-1, 1);          // art faces LEFT; flip to swim right
    ctx.drawImage(img, fi * cw, 0, cw, ch, -dw / 2, -dh * 0.502, dw, dh);   // content centred at 0.502
    ctx.restore();
    return;
  }

  // Energy-drink buff active (after the transformation): animated buffed WALK (aura).
  if (player.poweredT > 0 && (imgLoaded.abuPoweredWalk || imgLoaded.abuPowerup)) {
    const walk = imgLoaded.abuPoweredWalk;
    const img = walk ? images.abuPoweredWalk : images.abuPowerup;
    const n = 3, cw = img.naturalWidth / n, ch = img.naturalHeight;
    const moving = Math.abs(player.vx) > 1 && player.onGround;
    const fi = walk ? (moving ? 1 + Math.floor(performance.now() / 120) % 2 : 0)   // 0 idle, 1/2 strides
                    : 1;                                                            // fallback: static flex (frame 2)
    const dh = player.h * 1.3, dw = dh * (cw / ch);
    ctx.save();
    ctx.translate(sx + player.w / 2, player.y + player.h);
    if (player.facing < 0) ctx.scale(-1, 1);   // powerup art faces RIGHT; flip when going left
    ctx.drawImage(img, fi * cw, 0, cw, ch, -dw / 2, -dh, dw, dh);
    ctx.restore();
    return;
  }

  // Ice slide: on a slippery patch, Abu rides the 2-frame ice-slide pose (returns to
  // his normal walk/idle once off the ice).
  if (imgLoaded.abuIceSlide && player.onGround && !player.mantle && !player.descend &&
      isOnIce(player.x + player.w / 2)) {
    const img = images.abuIceSlide, cw = img.naturalWidth / 2, ch = img.naturalHeight;
    const fi = Math.floor(performance.now() / 170) % 2;      // gentle slide wobble
    const dh = player.h * 1.08, dw = dh * (cw / ch);
    ctx.save();
    ctx.translate(sx + player.w / 2, player.y + player.h);    // feet on the ice
    if (player.facing > 0) ctx.scale(-1, 1);                  // art faces left; flip when facing right
    ctx.drawImage(img, fi * cw, 0, cw, ch, -dw / 2, -dh * 0.86, dw, dh);   // anchor the foot content (frac 0.86), not the padded cell bottom
    ctx.restore();
    return;
  }

  // Exhausted (Level 1 stamina low): doubled over, breathing heavily. Shown while
  // collapsed (0 stamina) or while standing still and under the exhaust threshold.
  if (imgLoaded.abuExhausted && (player.collapsed || (player.exhausted && player.onGround && Math.abs(player.vx) < 8))) {
    const img = images.abuExhausted, n = 3, cw = img.naturalWidth / n, ch = img.naturalHeight;
    const seq = [0, 1, 2, 1];                               // ping-pong = inhale/exhale heave
    const fi = seq[Math.floor(performance.now() / (player.collapsed ? 200 : 300)) % seq.length];
    const dh = player.h * 1.04, dw = dh * (cw / ch);
    ctx.save();
    ctx.translate(sx + player.w / 2, player.y + player.h);   // feet planted on the ground
    if (player.facing > 0) ctx.scale(-1, 1);                 // art faces left; flip when facing right
    ctx.drawImage(img, fi * cw, 0, cw, ch, -dw / 2, -dh, dw, dh);
    ctx.restore();
    return;
  }

  // Deep squat: standing still and holding Down (2-frame stand -> deep squat).
  if (squatHoldT > 0 && player.onGround && Math.abs(player.vx) < 1 && imgLoaded.abuSquat &&
      !player.mantle && !player.descend) {
    const img = images.abuSquat, cw = img.naturalWidth / 2, ch = img.naturalHeight;
    const fi = squatHoldT > 0.12 ? 1 : 0;       // brief stand frame, then settle into the squat
    const dh = player.h * 1.16, dw = dh * (cw / ch);
    ctx.save();
    ctx.translate(sx + player.w / 2, player.y + player.h);   // feet on the ground (cell foot baseline ~y800)
    if (player.facing > 0) ctx.scale(-1, 1);                 // art faces left; flip when facing right
    ctx.drawImage(img, fi * cw, 0, cw, ch, -dw / 2, -(800 / ch) * dh, dw, dh);
    ctx.restore();
    return;
  }

  // Descending a platform-edge rope (Level 1): Abu grips the rope (grip pose).
  if (player.descend) {
    const grip = imgLoaded.grip;
    const img = grip ? images.grip : (imgLoaded.player ? images.player : null);
    const dw = player.w * 1.05, dh = grip ? player.h * 1.2 : player.h * 1.05;
    ctx.save();
    ctx.translate(sx + player.w / 2, player.y);
    if (player.facing > 0) ctx.scale(-1, 1);
    if (img) ctx.drawImage(img, -dw / 2, -2, dw, dh);
    else { ctx.fillStyle = "#2980b9"; ctx.fillRect(-dw / 2, 0, dw, player.h); }
    ctx.restore();
    return;
  }

  // Mantling a platform edge (Level 1): draw Abu gripping/pulling up. Uses a
  // dedicated climb sprite when present, else the rope-grip pose, else standing.
  if (player.mantle) {
    if (imgLoaded.abuMantle) {
      // Dedicated 2-frame mantle: frame 0 = hanging, frame 1 = pulling up. Hands
      // sit at the cell top, so draw the top at the ledge (player.y).
      const img = images.abuMantle, cw = img.naturalWidth / 2, ch = img.naturalHeight;
      const fi = player.mantle.phase === "hang" ? 0 : 1;
      const dh = player.h * 1.45, dw = dh * (cw / ch);
      ctx.save();
      ctx.translate(sx + player.w / 2, player.y);
      if (player.facing > 0) ctx.scale(-1, 1);
      ctx.drawImage(img, fi * cw, 0, cw, ch, -dw / 2, -4, dw, dh);
      ctx.restore();
      return;
    }
    const grip = imgLoaded.grip;
    const img = grip ? images.grip : (imgLoaded.player ? images.player : null);
    const dw = player.w * 1.1, dh = player.h * (grip ? 1.2 : 1.05);
    ctx.save();
    ctx.translate(sx + player.w / 2, player.y);
    if (player.facing > 0) ctx.scale(-1, 1);
    if (img) ctx.drawImage(img, -dw / 2, -2, dw, dh);
    else { ctx.fillStyle = "#2980b9"; ctx.fillRect(-dw / 2, 0, dw, player.h); }
    ctx.restore();
    return;
  }

  // On a rope: pivot at the hands (top of the sprite) and tilt the body along the
  // rope so Abu reads as gripping and swinging, not dangling upright. Uses a
  // dedicated grip sprite (arms overhead) when present, else the standing sprite.
  if (player.swinging && player.swing) {
    const useGrip = imgLoaded.grip;
    const img = useGrip ? images.grip : (imgLoaded.player ? images.player : null);
    // The grip sprite's raised arms are only ~17% of its height, so scale it so the
    // BODY matches Abu's normal size (player.h) with the arms extending above to the
    // rope. Hands sit at the rope end; the body hangs below.
    const dw = player.w * 1.05;
    const dh = useGrip ? player.h * 1.2 : player.h * 1.05;
    ctx.save();
    ctx.translate(sx + player.w / 2, player.y);        // pivot at the hands / rope end
    ctx.rotate(-player.swing.theta);                    // body trails along the rope line
    if (player.facing > 0) ctx.scale(-1, 1);
    if (img) ctx.drawImage(img, -dw / 2, useGrip ? -2 : -8, dw, dh);
    else { ctx.fillStyle = "#2980b9"; ctx.fillRect(-dw / 2, -8, dw, dh); }
    ctx.restore();
    return;
  }

  // Throwing a carabiner: 3-frame throw animation (movement/gravity still apply).
  if (player.throwing && imgLoaded.abuThrow) {
    const img = images.abuThrow, n = 3, cw = img.naturalWidth / n, ch = img.naturalHeight;
    const fi = Math.min(n - 1, Math.floor(player.throwTimer / THROW_TIME * n));
    const dh = player.h * 1.08, dw = dh * (cw / ch);
    ctx.save();
    ctx.translate(sx + player.w / 2, player.y + player.h);
    if (player.facing < 0) ctx.scale(-1, 1);   // art faces RIGHT; flip when facing left
    ctx.drawImage(img, fi * cw, 0, cw, ch, -dw / 2, -dh, dw, dh);
    ctx.restore();
    return;
  }

  // --- Procedural animation: derive bob / lean / squash from state ---
  let bob = 0, lean = 0, squashY = 1;
  const ph = player.walkPhase;
  if (!player.onGround) {
    lean = 0.07 * player.facing;           // lean into the jump arc
    squashY = 1.04;                        // slight stretch in the air
  } else if (Math.abs(player.vx) > 1) {
    // The walk sprite sheet carries the bob + leg motion; just add a slight
    // forward lean for momentum.
    lean = 0.03 * player.facing;
  }
  // (standing still: no bob — Abu holds a static pose)

  const drawW = player.w, drawH = player.h * squashY;
  const footY = player.y + player.h + bob;       // keep feet anchored
  const cx = sx + player.w / 2;

  ctx.save();
  ctx.translate(cx, footY);
  ctx.rotate(lean);
  if (player.facing > 0) ctx.scale(-1, 1);  // art faces left; flip when going right
  if (imgLoaded.player) {
    if (player.onGround && Math.abs(player.vx) > 1) {
      drawWalkingSprite(drawW, drawH, ph);   // articulated legs while walking
    } else {
      ctx.drawImage(images.player, -drawW / 2, -drawH, drawW, drawH);
    }
  } else {
    ctx.fillStyle = "#2980b9";
    ctx.fillRect(-drawW / 2, -drawH, drawW, drawH);
  }
  ctx.restore();
}

// Walk animation: play the pre-baked 6-frame sprite sheet, picking the frame
// from the walk-cycle phase. Origin is at the feet (y=0), head at y=-drawH.
// Falls back to the standing sprite if the sheet hasn't loaded.
function drawWalkingSprite(drawW, drawH, ph) {
  if (!imgLoaded.walk) {
    ctx.drawImage(images.player, -drawW / 2, -drawH, drawW, drawH);
    return;
  }
  const sheet = images.walk;
  const cw = sheet.naturalWidth / WALK_FRAMES, chh = sheet.naturalHeight;
  const span = (2 * Math.PI) / WALK_FRAMES;              // phase per frame
  let f = Math.floor(ph / span) % WALK_FRAMES;
  if (f < 0) f += WALK_FRAMES;
  // The cell is padded; scale it up so the body matches the standing sprite and
  // anchor the feet (cell bottom) at y=0, centred horizontally.
  const dW = drawW * (1 + 2 * WALK_PAD_X);
  const dH = drawH * (1 + WALK_PAD_Y);
  ctx.drawImage(sheet, f * cw, 0, cw, chh, -dW / 2, -dH, dW, dH);
}

// A filled red heart centred at (cx, cy), `s` tall, with a dark outline so it
// stays visible against a bright sky.
function drawHeart(cx, cy, s, fill) {
  const r = s * 0.30;                       // lobe radius
  const topY = cy - s * 0.18;               // lobe centre height
  ctx.beginPath();
  ctx.arc(cx - r, topY, r, Math.PI, 0, false);   // left bump
  ctx.arc(cx + r, topY, r, Math.PI, 0, false);   // right bump
  ctx.lineTo(cx, cy + s * 0.52);                 // down to the bottom point
  ctx.closePath();
  ctx.lineWidth = 2.5; ctx.strokeStyle = "rgba(0,0,0,0.55)"; ctx.stroke();
  ctx.fillStyle = fill; ctx.fill();
}

// 3 gear slots at the top-left: dim until collected, full-colour + pop on pickup.
function drawGearHUD() {
  const sz = 26, gap = 6, y0 = 6;
  GEAR.forEach((g, i) => {
    const x = 14 + i * (sz + gap), got = gearThisLevel[g.id];
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(x - 2, y0 - 2, sz + 4, sz + 4);   // dark chip
    const img = images[g.asset];
    const aspect = (imgLoaded[g.asset] && img.naturalHeight) ? img.naturalWidth / img.naturalHeight : 1;
    let dw = sz, dh = sz; if (aspect > 1) dh = sz / aspect; else dw = sz * aspect;
    const pop = gearPop[g.id] > 0 ? 1 + Math.sin((1 - gearPop[g.id] / 0.45) * Math.PI) * 0.28 : 1;
    dw *= pop; dh *= pop;
    const dx = x + (sz - dw) / 2, dy = y0 + (sz - dh) / 2;
    ctx.save(); ctx.globalAlpha = got ? 1 : 0.28;
    if (imgLoaded[g.asset]) ctx.drawImage(img, dx, dy, dw, dh);
    else { ctx.fillStyle = "#ffb627"; ctx.fillRect(dx, dy, dw, dh); }
    ctx.restore();
  });
}
function drawToast() {
  if (!toast) return;
  const a = Math.min(1, toast.timer / 0.4);
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = "bold 18px Segoe UI, Arial"; ctx.textAlign = "center";
  const w = ctx.measureText(toast.text).width + 28, x = VIEW_W / 2 - w / 2, y = 78;
  ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(x, y, w, 30);
  ctx.fillStyle = "#ffe07a"; ctx.fillText(toast.text, VIEW_W / 2, y + 21);
  ctx.restore(); ctx.textAlign = "left";
}

function drawHUD() {
  ctx.fillStyle = "#000"; ctx.globalAlpha = 0.35; ctx.fillRect(0, 0, VIEW_W, 40); ctx.globalAlpha = 1;
  drawGearHUD();
  ctx.fillStyle = "#fff"; ctx.font = "bold 20px Segoe UI, Arial"; ctx.textAlign = "left";
  // Throwable knife ammo (score removed from the HUD), top-left after the gear slots: icon + count.
  const ax = 116;
  if (imgLoaded.knife) { const kw = 26, kh = kw * images.knife.naturalHeight / images.knife.naturalWidth; ctx.drawImage(images.knife, ax, 20 - kh / 2, kw, kh); }
  else { ctx.strokeStyle = "#aeb6c2"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(ax, 26); ctx.lineTo(ax + 22, 10); ctx.stroke(); }
  ctx.fillStyle = carabinerAmmo > 0 ? "#cfe8ff" : "#ff7a6a"; ctx.textAlign = "left";
  ctx.fillText("× " + carabinerAmmo, ax + 30, 28);
  // Stored energy bottles: bottle icon + count, right after the knife counter.
  const ex = ax + 30 + ctx.measureText("× " + carabinerAmmo).width + 18;
  if (imgLoaded.energyBottle) { const bh = 30, bw = bh * images.energyBottle.naturalWidth / images.energyBottle.naturalHeight; ctx.drawImage(images.energyBottle, ex, 20 - bh / 2, bw, bh); }
  else { ctx.fillStyle = "#7CFFB2"; ctx.fillRect(ex, 8, 10, 24); }
  ctx.fillStyle = energyDrinks > 0 ? "#9affc2" : "#9fb0bf"; ctx.font = "bold 20px Segoe UI, Arial";
  ctx.fillText("× " + energyDrinks, ex + 18, 28);
  // Speargun (once collected): icon after the energy-drink count.
  if (player.hasHarpoon && imgLoaded.harpoonGun) {
    const gx = ex + 18 + ctx.measureText("× " + energyDrinks).width + 18;
    const gh = 22, gw = gh * images.harpoonGun.naturalWidth / images.harpoonGun.naturalHeight;
    ctx.drawImage(images.harpoonGun, gx, 20 - gh / 2, gw, gh);
  }
  // Enemy/combat score (stomps + knife kills), centred — separate from the carabiner count.
  ctx.textAlign = "center"; ctx.fillStyle = "#ffd84d"; ctx.font = "bold 20px Segoe UI, Arial";
  ctx.fillText("Score: " + runScore, VIEW_W / 2, 28);
  ctx.textAlign = "left";
  // Lives as red hearts, right-aligned, side by side. Beyond 6 show a heart + "×N".
  const HS = 18, HG = 7;                    // heart size + gap between hearts
  if (lives <= 6) {
    let hx = VIEW_W - 16 - HS / 2;          // centre of the right-most heart
    for (let i = 0; i < lives; i++) { drawHeart(hx, 20, HS, "#ff3b46"); hx -= (HS + HG); }
  } else {
    ctx.fillStyle = "#fff"; ctx.font = "bold 18px Segoe UI, Arial"; ctx.textAlign = "right";
    const lbl = "× " + lives;
    ctx.fillText(lbl, VIEW_W - 16, 27);
    drawHeart(VIEW_W - 16 - ctx.measureText(lbl).width - HS / 2 - 6, 20, HS, "#ff3b46");
  }
  ctx.textAlign = "left";

  // Level name + progress toward this level's milestone (thin bar under the band).
  const lvl = currentLevel();
  // Gated levels (L1) count actual carabiners toward the checkpoint, not score
  // (score also rises from stomps). Other levels keep the cumulative-score bar.
  const gate = lvl.climbGate;
  const lo = gate ? 0 : prevTarget(), hi = gate ? gate.carabiners : lvl.target;
  const count = gate ? carabinersThisLevel : score;
  const prog = Math.max(0, Math.min(1, (count - lo) / (hi - lo)));
  ctx.fillStyle = "#fff"; ctx.font = "bold 15px Segoe UI, Arial"; ctx.textAlign = "left";
  // "Lv 1 · Zugspitze [flag] — [carabiner] N / 20"  (country name replaced by its flag)
  const pre = "Lv " + lvl.id + " · " + lvl.name + " ";
  ctx.fillText(pre, 16, 58);
  let tx = 16 + ctx.measureText(pre).width;
  if (lvl.country) { const fw = 21, fh = 13; drawFlag(lvl.country, tx + fw / 2, 45, fw, fh); tx += fw + 8; }
  ctx.fillStyle = "#fff"; ctx.fillText("— ", tx, 58); tx += ctx.measureText("— ").width;
  if (imgLoaded.carabiner) { const cw = 11, ch = cw * images.carabiner.naturalHeight / images.carabiner.naturalWidth; ctx.drawImage(images.carabiner, tx, 58 - ch + 1, cw, ch); tx += cw + 5; }
  ctx.fillText(count + " / " + hi, tx, 58);
  const barX = 16, barY = 64, barW = 240, barH = 8;
  ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(barX, barY, barW, barH);
  ctx.fillStyle = "#7fd6ff"; ctx.fillRect(barX, barY, barW * prog, barH);
  ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1; ctx.strokeRect(barX + 0.5, barY + 0.5, barW, barH);

  // Power / stamina meter (Level 1), top-right under the hearts.
  if (lvl.power) {
    const pw = 132, ph = 10, px = VIEW_W - 16 - pw, py = 46;
    const frac = Math.max(0, Math.min(1, power / POWER_MAX));
    // Critical: flash/pulse the meter (and label) when stamina is below POWER_FLASH%.
    const critical = power < POWER_FLASH;
    const pulse = critical ? 0.55 + 0.45 * Math.abs(Math.sin(performance.now() / 130)) : 1;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.font = "bold 13px Segoe UI, Arial"; ctx.textAlign = "right";
    ctx.fillStyle = playerSheltered ? "#9ef0a8" : (critical ? "#ff5a4a" : "#fff");
    ctx.fillText("POWER", px - 6, py + 10);
    ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(px, py, pw, ph);
    // While stamina is actively restoring (resting at a shelter or mid energy-drink
    // surge), fill with a flickering FIRE gradient instead of the flat colour.
    const regening = (playerSheltered || player.powerupAnimT > 0) && power < POWER_MAX;   // full = back to normal green
    if (regening) {
      const flick = 0.82 + 0.18 * Math.sin(performance.now() / 70);   // live flame flicker
      const g = ctx.createLinearGradient(0, py, 0, py + ph);
      g.addColorStop(0,   "#ffe14a");                                   // bright yellow top
      g.addColorStop(0.5, "#ff9b21");                                   // orange
      g.addColorStop(1,   "#e8431c");                                   // deep red bottom
      ctx.save(); ctx.globalAlpha = pulse * flick;
      ctx.fillStyle = g; ctx.fillRect(px, py, pw * frac, ph);
      ctx.restore();
    } else {
      ctx.fillStyle = frac > 0.5 ? "#5ad06a" : frac > 0.25 ? "#ffd84d" : "#ff5a4a";
      ctx.fillRect(px, py, pw * frac, ph);
    }
    ctx.strokeStyle = critical ? "#ff5a4a" : "rgba(255,255,255,0.6)"; ctx.lineWidth = critical ? 2 : 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw, ph);
    ctx.restore();
    ctx.textAlign = "left";
  }
  drawToast();
}

// A small national flag, drawn procedurally (centred horizontally on cx).
function drawFlag(country, cx, topY, w, h) {
  const x = cx - w / 2, y = topY, t3 = w / 3, h3 = h / 3;
  switch (country) {
    case "Germany":                                   // black / red / gold
      ctx.fillStyle = "#000000"; ctx.fillRect(x, y, w, h3);
      ctx.fillStyle = "#dd0000"; ctx.fillRect(x, y + h3, w, h3);
      ctx.fillStyle = "#ffce00"; ctx.fillRect(x, y + 2 * h3, w, h - 2 * h3); break;
    case "Austria":                                   // red / white / red
      ctx.fillStyle = "#c8102e"; ctx.fillRect(x, y, w, h3);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(x, y + h3, w, h3);
      ctx.fillStyle = "#c8102e"; ctx.fillRect(x, y + 2 * h3, w, h - 2 * h3); break;
    case "Italy":                                     // green / white / red
      ctx.fillStyle = "#009246"; ctx.fillRect(x, y, t3, h);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(x + t3, y, t3, h);
      ctx.fillStyle = "#ce2b37"; ctx.fillRect(x + 2 * t3, y, w - 2 * t3, h); break;
    case "Switzerland": {                             // red with white cross
      ctx.fillStyle = "#d52b1e"; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = "#ffffff";
      const s = Math.max(2, Math.round(h * 0.2));
      ctx.fillRect(x + w / 2 - s / 2, y + h * 0.22, s, h * 0.56);
      ctx.fillRect(x + w * 0.22, y + h / 2 - s / 2, w * 0.56, s); break;
    }
    case "France":                                    // blue / white / red
      ctx.fillStyle = "#0055a4"; ctx.fillRect(x, y, t3, h);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(x + t3, y, t3, h);
      ctx.fillStyle = "#ef4135"; ctx.fillRect(x + 2 * t3, y, w - 2 * t3, h); break;
    default:
      ctx.fillStyle = "#888888"; ctx.fillRect(x, y, w, h);
  }
  ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

// A small snow-capped mountain icon above a map node.
function drawMtnIcon(cx, baseY, bright) {
  ctx.fillStyle = bright ? "#8aa0bb" : "#46546a";
  ctx.beginPath(); ctx.moveTo(cx - 13, baseY); ctx.lineTo(cx, baseY - 19); ctx.lineTo(cx + 13, baseY); ctx.closePath(); ctx.fill();
  ctx.fillStyle = bright ? "#ffffff" : "#9eadc2";       // snow cap
  ctx.beginPath(); ctx.moveTo(cx - 5, baseY - 12); ctx.lineTo(cx, baseY - 19); ctx.lineTo(cx + 5, baseY - 12); ctx.closePath(); ctx.fill();
}

// "Mountain Progress" dashboard shown after each level (the levelcomplete state).
function drawLevelDashboard() {
  const d = dashboard;
  if (!d) return;
  const done = LEVELS[d.completedLevelIndex], next = LEVELS[d.nextLevelIndex];

  ctx.fillStyle = "rgba(6,10,20,0.88)"; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.textAlign = "center";

  ctx.fillStyle = "#9fe6ff"; ctx.font = "bold 38px Segoe UI, Arial";
  ctx.fillText("LEVEL COMPLETE", VIEW_W / 2, 54);

  ctx.fillText(done.name + "  —  " + done.country, VIEW_W / 2, 86);
  ctx.fillStyle = "#cfe8ff"; ctx.font = "17px Segoe UI, Arial";
  ctx.fillText("Carabiners this level: " + d.carabiners + "    •    Total Score: " + score + "    •    Lives: " + lives, VIEW_W / 2, 114);

  // --- journey map ---
  const n = LEVELS.length, mapY = 250;
  const x0 = 92, x1 = VIEW_W - 92;

  ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,255,255,0.22)";          // full route
  ctx.beginPath(); ctx.moveTo(nodeX(0), mapY); ctx.lineTo(nodeX(n - 1), mapY); ctx.stroke();
  ctx.strokeStyle = "#7bd36a";                                           // completed portion
  ctx.beginPath(); ctx.moveTo(nodeX(0), mapY); ctx.lineTo(nodeX(d.completedLevelIndex), mapY); ctx.stroke();

  for (let i = 0; i < n; i++) {
    const x = nodeX(i), completed = i <= d.completedLevelIndex, isNext = i === d.nextLevelIndex;
    drawMtnIcon(x, mapY - 26, completed);
    ctx.beginPath(); ctx.arc(x, mapY, 12, 0, 6.2832);
    ctx.fillStyle = completed ? "#7bd36a" : (isNext ? "#ffd84d" : "#39435a"); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,0.65)"; ctx.stroke();
    if (completed) {                                                     // checkmark
      ctx.strokeStyle = "#0a2a0a"; ctx.lineWidth = 2.5; ctx.beginPath();
      ctx.moveTo(x - 5, mapY); ctx.lineTo(x - 1, mapY + 4); ctx.lineTo(x + 5, mapY - 5); ctx.stroke();
    }
    ctx.fillStyle = completed ? "#eaf7e0" : (isNext ? "#ffe9a8" : "#93a4bd");
    ctx.font = (isNext ? "bold " : "") + "12px Segoe UI, Arial";

  }

  // animated AbuShakra marker travelling from completed node to next node
  const t = Math.min(1, d.animTime / d.animDuration);
  const e = t * t * (3 - 2 * t);                                         // smoothstep
  const mx = nodeX(d.completedLevelIndex) + (nodeX(d.nextLevelIndex) - nodeX(d.completedLevelIndex)) * e;
  const my = (mapY - 48) - Math.sin(e * Math.PI) * 20;
  if (imgLoaded.player) {
    const mw = 24, mh = mw * (player.h / player.w);
    ctx.drawImage(images.player, mx - mw / 2, my - mh, mw, mh);
  } else { ctx.fillStyle = "#e23b3b"; ctx.fillRect(mx - 7, my - 18, 14, 18); }

  ctx.fillStyle = "#ffd84d"; ctx.font = "bold 18px Segoe UI, Arial";
  ctx.fillText("AbuShakra travels from " + done.name + " to " + next.name, VIEW_W / 2, 332);
  ctx.fillStyle = "#7bd36a"; ctx.font = "15px Segoe UI, Arial";
  ctx.fillText("+" + LEVEL_BONUS_LIVES + " life   •   Next target: " + next.target, VIEW_W / 2, 358);

}

// Start a level's victory cutscene: pause the music, play + draw the video.
// Falls back to muted (then to skipping) if autoplay is blocked.
function startCutscene(path) {
  cutsceneDone = false;
  if (cutsceneVideo.dataset.path !== path) { cutsceneVideo.src = path; cutsceneVideo.dataset.path = path; }
  try { cutsceneVideo.currentTime = 0; } catch (e) {}
  Music.stop();
  state = "cutscene";
  const pr = cutsceneVideo.play();
  if (pr && pr.catch) pr.catch(() => {
    cutsceneVideo.muted = true;
    const p2 = cutsceneVideo.play();
    if (p2 && p2.catch) p2.catch(() => endCutscene());
  });
}
function endCutscene() {
  if (cutsceneDone) return; cutsceneDone = true;
  try { cutsceneVideo.pause(); } catch (e) {}
  Music.start();
  state = "levelcomplete";   // continue to the Mountain Progress dashboard
}
function drawCutscene() {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  if (cutsceneVideo.readyState >= 2 && cutsceneVideo.videoWidth) {
    ctx.drawImage(cutsceneVideo, 0, 0, VIEW_W, VIEW_H);   // 16:9 video fills the 16:9 canvas
  }
  if (Math.floor(performance.now() / 600) % 2 === 0) {
    ctx.textAlign = "right"; ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.font = "14px Segoe UI, Arial";
    ctx.fillText("tap / press to skip", VIEW_W - 12, VIEW_H - 14); ctx.textAlign = "left";
  }
}
