<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>AbuShakra Adventure</title>

<!-- PWA: installable + offline -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1b1b25" />

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AbuShakra" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1b1b25;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
    touch-action: none;            /* no scroll/zoom gestures while playing */
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    image-rendering: pixelated;
    background: #87b5e8;
    max-width: 100vw;
    max-height: 100vh;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }

  /* Music on/off — always visible, top-right. */
  #btn-mute {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(20,22,34,0.45);
    color: #fff; font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px);
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    z-index: 10;
  }
  #btn-mute:active { transform: scale(0.92); }

  /* Dev/test shortcuts — jump straight into a level. Only shown on the cover. */
  #test-buttons {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    display: none; gap: 8px;
    z-index: 10;
  }
  #test-buttons .test-btn {
    height: 40px; padding: 0 14px;
    border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(20,22,34,0.45);
    color: #fff; font: 700 14px/1 "Segoe UI", Arial;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px);
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
  }
  #test-buttons .test-btn:active { transform: scale(0.94); }

  /* On-screen touch controls — hidden by default, shown on touch devices. */
  #touch-controls { display: none; }
  body.touch #touch-controls { display: block; }
  #touch-controls .btn {
    position: fixed;
    bottom: max(22px, env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center;
    width: 88px; height: 88px;
    border-radius: 50%;
    background: rgba(20,22,34,0.42);
    border: 2px solid rgba(255,255,255,0.6);
    color: #fff;
    font-size: 38px; font-weight: 700;
    text-align: center;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.06s ease, background 0.06s ease;
    cursor: pointer;
  }
  #touch-controls .btn.pressed {
    background: rgba(120,180,255,0.7);
    border-color: #fff;
    transform: scale(0.92);
  }
  #touch-controls #btn-left  { left: max(20px, env(safe-area-inset-left)); }
  #touch-controls #btn-right { left: calc(max(20px, env(safe-area-inset-left)) + 104px); }
  #touch-controls #btn-jump  {
    right: max(20px, env(safe-area-inset-right));
    width: 104px; height: 104px;
    font-size: 22px; letter-spacing: 1px;
    background: rgba(60,150,90,0.5);
  }
  #touch-controls #btn-jump.pressed { background: rgba(90,220,130,0.8); }
  #touch-controls #btn-down {
    right: calc(max(20px, env(safe-area-inset-right)) + 120px);
    width: 80px; height: 80px; font-size: 30px;
    background: rgba(150,110,60,0.5);
  }
  #touch-controls #btn-down.pressed { background: rgba(210,160,90,0.8); }
</style>
</head>
<body>
<canvas id="game" width="800" height="450"></canvas>
<button id="btn-mute" aria-label="Toggle music">&#128266;</button>
<div id="test-buttons">
  <button class="test-btn" data-level="1" aria-label="Test Level 2">&#9654; L2</button>
  <button class="test-btn" data-level="2" aria-label="Test Level 3">&#9654; L3</button>
  <button class="test-btn" data-level="3" aria-label="Test Level 4">&#9654; L4</button>
  <button class="test-btn" data-level="4" aria-label="Test Level 5">&#9654; L5</button>
</div>
<div id="touch-controls">
  <div id="btn-left"  class="btn">&#9664;</div>
  <div id="btn-right" class="btn">&#9654;</div>
  <div id="btn-down"  class="btn">&#9660;</div>
  <div id="btn-jump"  class="btn">JUMP</div>
</div>

/* =============================================================
   ASSET LOADING
   ============================================================= */
const images = {}, imgLoaded = {};
function loadImages(cb) {
  const keys = Object.keys(ASSETS);
  let remaining = keys.length;
  if (!remaining) return cb();
  keys.forEach(key => {
    const img = new Image();
    images[key] = img; imgLoaded[key] = false;
    const done = () => { if (--remaining === 0) cb(); };
    img.onload = () => { imgLoaded[key] = img.naturalWidth > 0; done(); };
    img.onerror = () => { imgLoaded[key] = false; done(); };
    img.src = ASSETS[key];
  });
}
function drawSprite(key, x, y, w, h, color) {
  if (imgLoaded[key]) ctx.drawImage(images[key], x, y, w, h);
  else { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }
}

const keys = {};

const LEFT_KEYS = ["ArrowLeft", "KeyA"];

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  // Any of jump / Enter / R advances whichever non-play screen we're on.
  if (state !== "playing" && (JUMP_KEYS.includes(e.code) || e.code === "Enter" || e.code === "KeyR")) {
    advanceFromScreen();
  }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
canvas.addEventListener("mousedown", () => { if (state !== "playing") advanceFromScreen(); });
function anyKey(list) { return list.some(k => keys[k]); }

/* ---- Touch controls (phones / tablets) ---- */
const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add("touch");

/* iOS Safari ignores `user-scalable=no`, so the page can still zoom while
   playing. Block the two culprits: pinch (gesture* events) and double-tap. */
["gesturestart", "gesturechange", "gestureend"].forEach((t) =>
  document.addEventListener(t, (e) => e.preventDefault(), { passive: false })
);
let lastTouchEnd = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 320) e.preventDefault();  // suppress double-tap zoom
  lastTouchEnd = now;
}, { passive: false });

// Advance whichever non-play screen we're on (start / level-complete / won /
// game-over). Defined here; the level-flow helpers live in the LOOP section.
function advanceFromScreen() {
  // Cover -> "How to Play" (held for 5s, then auto-starts; taps are ignored
  // while it counts down). Win/Game-over -> back to the cover.
  if (state === "cutscene") { endCutscene(); return; }   // tap to skip the cutscene
  if (state === "start") { state = "instructions"; howtoTimer = HOWTO_SECONDS; Music.start(); }
  else if (state === "levelcomplete") { advanceLevel(); }
  else if (state === "won" || state === "gameover") { resetGame(); state = "start"; }
}
// Start / restart the game from a tap (mirrors the click handler).
function tapAdvance() { if (state !== "playing") advanceFromScreen(); }
canvas.addEventListener("pointerdown", tapAdvance);

// Bind an on-screen button to a virtual key. Multi-touch safe; uses touch
// events with preventDefault so iOS never treats taps as zoom/scroll.
function bindButton(id, code, onPress) {
  const el = document.getElementById(id);
  if (!el) return;
  const press = (e) => {
    e.preventDefault();
    if (keys[code]) return;
    keys[code] = true; el.classList.add("pressed");
    if (onPress) onPress();
  };
  const release = (e) => {
    e.preventDefault();
    keys[code] = false; el.classList.remove("pressed");
  };
  el.addEventListener("touchstart", press,   { passive: false });
  el.addEventListener("touchend",   release, { passive: false });
  el.addEventListener("touchcancel", release, { passive: false });
  // Mouse fallback (desktop testing).
  el.addEventListener("pointerdown", press);
  el.addEventListener("pointerup", release);
  el.addEventListener("pointerleave", release);
}
bindButton("btn-left",  "ArrowLeft");
bindButton("btn-right", "ArrowRight");
bindButton("btn-down",  "ArrowDown");          // grab a descent rope
bindButton("btn-jump",  "Space", tapAdvance);  // jump also starts/restarts

  // is already playing it crossfades straight into the new track, otherwise it
  // just arms it (so the cover stays silent until the first tap calls start()).
  function setTrack(src) {
    if (!src || src === curSrc) return;
    const wasPlaying = !bgm.paused;
    curSrc = src;
    bgm.src = src;
    if (enabled && wasPlaying) bgm.play().catch(() => {});
  }

  function ensure() {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;            // very old browser -> silently no music
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.16;   // overall volume
    master.connect(actx.destination);
  }
  // iOS only starts audio from inside a user gesture. Create+resume the
  // context and play one silent sample to "unlock" it for later use.
  function unlock() {
    ensure();
    if (!actx) return;
    if (actx.state === "suspended") actx.resume();
    const b = actx.createBuffer(1, 1, 22050);
    const s = actx.createBufferSource();
    s.buffer = b; s.connect(actx.destination); s.start(0);
  }
  function blip(freq, time, dur, type, vol) {
    if (!freq) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(vol, time + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g); g.connect(master);
    o.start(time); o.stop(time + dur + 0.02);
  }
  // A note whose pitch glides from f0 to f1 — used for sound effects.
  function slide(f0, f1, time, dur, type, vol) {

    o.type = type;
    o.frequency.setValueAtTime(f0, time);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), time + dur);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(vol, time + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g); g.connect(master);
    o.start(time); o.stop(time + dur + 0.02);
  }
  const sfxReady = () => enabled && !!actx;
  return {
    unlock,
    // ---- Sound effects (share the unlocked context; gated by mute) ----
    sfxJump()  { if (!sfxReady()) return; slide(330, 760, actx.currentTime, 0.14, "square", 0.5); },
    sfxCoin()  { if (!sfxReady()) return; const t = actx.currentTime; blip(988, t, 0.07, "square", 0.5); blip(1319, t + 0.07, 0.12, "square", 0.5); },
    sfxStomp() { if (!sfxReady()) return; slide(440, 120, actx.currentTime, 0.16, "square", 0.6); },
    sfxHurt()  { if (!sfxReady()) return; slide(300, 80, actx.currentTime, 0.32, "sawtooth", 0.6); },
    sfxOver()  { if (!sfxReady()) return; const t = actx.currentTime; blip(523, t, 0.16, "square", 0.5); blip(392, t + 0.16, 0.16, "square", 0.5); blip(262, t + 0.32, 0.42, "square", 0.6); },
    sfxLevel() { if (!sfxReady()) return; const t = actx.currentTime; [523,659,784,1047].forEach((f, i) => blip(f, t + i * 0.09, 0.12, "square", 0.5)); },
    sfxWin()   { if (!sfxReady()) return; const t = actx.currentTime; [523,659,784,1047,784,1047,1319].forEach((f, i) => blip(f, t + i * 0.12, 0.16, "square", 0.55)); },
    setTrack,                                // switch the per-level background track
    start() {
      if (!enabled) return;
      ensure();                              // unlock the sfx context too
      if (actx && actx.state === "suspended") actx.resume();
      bgm.play().catch(() => {});            // loop the background track (ignored if autoplay is blocked)
    },
    resume() {
      if (actx && actx.state === "suspended") actx.resume();
      if (enabled) bgm.play().catch(() => {});
    },
    stop() { bgm.pause(); },
    toggle() {
      enabled = !enabled;
      if (!enabled) bgm.pause();
      return enabled;
    },
    get enabled() { return enabled; }
  };
})();

const muteBtn = document.getElementById("btn-mute");

// Dev/test shortcut: jump straight into a given level (skips the cover, the
// 5s "How to Play" intro, and earlier levels). Score starts at that level's
// entry milestone so its progress bar reads 0 and its target still applies.

  levelIndex = idx;

  cameraX = 0; worldGenX = 0;

  levelCarabiners = 0; dashboard = null;

const testBtns = document.getElementById("test-buttons");

// Unlock audio on the very first user interaction (covers iOS, which only
// allows audio to begin from inside a gesture). Runs once.

  Music.unlock();

window.addEventListener("touchstart", firstGestureUnlock, { passive: true });

// iOS suspends the audio context when the tab is backgrounded or the phone

/* =============================================================
   STATE
   ============================================================= */
let state = "start";   // start | playing | levelcomplete | won | gameover
let score, lives, invulnTimer, enemySpawnTimer;
let player, platforms, carabiners, enemies;
let pits = [];      // empty holes in the ground {x, w}
let crashPlats = []; // Level 5 breaking platforms (persistent state per instance)
let ropes = [];      // Level 4 climbable ropes (world-space, rebuilt per frame)
let descentRopes = []; // Level 1 ropes hung off platform edges (rebuilt per frame)
let shelters = [];     // Level 1 wooden shelters (rebuilt per frame)
let power = 100;       // Level 1 stamina (drains climbing/falling, refills in a shelter)
let playerSheltered = false;  // is Abu currently inside a shelter?
let icicles = [];    // Level 5 falling icicles (telegraphed ranged hazard)
let icicleTimer = 0; // countdown to the next icicle drop
let weather = [];    // Level 5 snowstorm flakes (screen-space)
let windCurrent = 0; // Level 5 wind force (px/s), varies over time
let windT = 0;       // wind phase clock
let cameraX, worldGenX;
let levelIndex = 0;   // index into LEVELS for the active world
let levelCarabiners = 0;   // carabiners clipped in the current level (for the dashboard)
let dashboard = null;      // between-levels "Mountain Progress" screen data
const HOWTO_SECONDS = 5;   // how long the "How to Play" screen holds before play
let howtoTimer = 0;
// Per-level victory cutscene: an mp4 drawn onto the canvas after a level is
// finished (before the dashboard). Hidden off-canvas <video>, played + drawn.
const cutsceneVideo = document.createElement("video");
cutsceneVideo.preload = "auto"; cutsceneVideo.playsInline = true;
cutsceneVideo.setAttribute("playsinline", "");
cutsceneVideo.style.cssText = "position:absolute;left:0;top:0;width:1px;height:1px;opacity:0.01;pointer-events:none;";
document.body.appendChild(cutsceneVideo);
let cutsceneDone = false;
cutsceneVideo.addEventListener("ended", () => { if (state === "cutscene") endCutscene(); });
cutsceneVideo.addEventListener("error", () => { if (state === "cutscene") endCutscene(); });
let particles = [];   // cosmetic dust / sparkle / poof bits
let shake = 0;        // current screen-shake magnitude (px), decays to 0
let newBest = false;  // did this run beat the saved high score?
let bestScore = (() => {
  try { return parseInt(localStorage.getItem("abushakra_best"), 10) || 0; }
  catch (e) { return 0; }
})();
function currentLevel() { return LEVELS[levelIndex]; }
function prevTarget() { return levelIndex > 0 ? LEVELS[levelIndex - 1].target : 0; }
// Mild within-level ramp (1.0 -> ~1.6) combined with the level's own multiplier.
function difficulty() {
  return (1 + Math.min(cameraX / 6000, 0.6)) * currentLevel().enemySpeedMul;
}

function rand(a, b) { return a + Math.random() * (b - a); }
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

/* =============================================================
   ELEVATED PLATFORMS — generated ahead in world space, recycled
   once far behind the camera. The ground is a separate, always
   solid surface, so walking never drops you into a pit.
   ============================================================= */
function makePlatform(x) {
  const w = rand(PLAT_WIDTH_MIN, PLAT_WIDTH_MAX);
  const y = GROUND_Y - rand(PLAT_RISE_MIN, PLAT_RISE_MAX);
  const p = { x, y, w, h: PLAT_THICK, kind: "static", solid: true };

  const h = currentLevel().haz || {};
  const r = Math.random();
  if (h.mover && r < h.mover) {
    // Moving / elevator platform: oscillates on one axis, carries its rider.
    p.kind = "mover"; p.ox = x; p.phase = Math.random() * 6.28;
    if (Math.random() < 0.6) {
      // Vertical elevator — keep its low point a jump above the ground.
      p.axis = "y"; p.oy = GROUND_Y - rand(120, 190);
      p.amp = rand(40, 80); p.speed = rand(0.6, 1.1); p.y = p.oy;
    } else {
      p.axis = "x"; p.oy = y; p.amp = rand(50, 120); p.speed = rand(0.5, 1.0);
    }
  }

  if (p.kind === "static") addCarabinersAbove(p);   // keep clips off moving blocks
  return p;
}

function addCarabinersAbove(p) {
  if (Math.random() < 0.8) {
    const n = Math.floor(rand(1, 4));
    for (let i = 0; i < n; i++) {
      const cx = p.x + 16 + i * (CARABINER_W + 20);
      if (cx + CARABINER_W > p.x + p.w) break;
      carabiners.push({ x: cx, y: p.y - CARABINER_H - 14, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
    }
  }
}

// Maybe carve an empty hole into a gap. It's centred with solid ground either
// side and capped in width, so the gap always stays clearable with one jump.
function maybeGroundHazard(gapStart, gap) {
  const pPit = (currentLevel().haz || {}).pit || 0;
  if (pPit && Math.random() < pPit && gap > 110) {
    const pw = Math.min(PIT_W_MAX, gap - 50);
    pits.push({ x: gapStart + (gap - pw) / 2, w: pw });
  }
}

// Scatter reachable carabiners just above the painted ledge at world-x.
// Sparse: most stretches stay empty so the few that appear are worth collecting.
function maybeGroundCarabinersAt(x) {
  if (Math.random() < 0.45) {
    const n = Math.floor(rand(1, 3));
    const arc = Math.random() < 0.5;
    const baseY = surfaceY(x) - rand(44, 84);
    for (let i = 0; i < n; i++) {
      const cx = x + i * (CARABINER_W + 22);
      const y = arc ? baseY - Math.sin((i + 1) / (n + 1) * Math.PI) * 40 : baseY;
      carabiners.push({ x: cx, y: y - CARABINER_H, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
    }
  }
}

// Place carabiners sitting ON the floating platforms of a given tile, evenly
// distributed across each platform top. Called once per tile as the world
// scrolls, so the reward for reaching a platform is collecting its clip(s).
// Clips alternate each tile (loop):
//   EVEN tile -> one clip on the FIRST and LAST ledge (gaps + middle ledge empty)
//   ODD  tile -> one clip in EACH gap (all ledges empty)
// So a single loop reads: ledge,_,_,_,ledge ; the next: _,gap,_,gap,_ .
function placePlatformCarabiners(tile, tw, plats) {
  if (tile % 2 !== 0) return;                        // odd tiles carry their clips in the gaps
  const base = tile * tw;
  const sorted = plats.slice().sort((a, b) => a.x0 - b.x0);
  const pick = sorted.length >= 2
    ? [sorted[0], sorted[sorted.length - 1]]         // first & last ledge only
    : sorted;
  for (const bx of pick) {
    const cx = base + (bx.x0 + bx.x1) / 2 - CARABINER_W / 2;
    carabiners.push({ x: cx, y: bx.top - CARABINER_H - 10, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
  }
}

// Place carabiners along the WALKING TRACK, in the GAPS between platforms only,
// hovering at chest height so they're collected by walking through. Active on
// ODD tiles (the loops where the ledges are empty).
function placeTrackCarabiners(tile, tw, plats) {
  if (tile % 2 === 0) return;                        // even tiles carry their clips on the ledges
  const base = tile * tw;
  const sorted = plats.slice().sort((a, b) => a.x0 - b.x0);
  for (let i = 0; i < sorted.length - 1; i++) {
    const gapL = sorted[i].x1, gapR = sorted[i + 1].x0;
    if (gapR - gapL < 80) continue;                  // skip gaps too narrow to stand in
    const x = base + (gapL + gapR) / 2;
    const bottom = surfaceY(x) - rand(10, 24);       // chest height above the ledge
    carabiners.push({ x: x - CARABINER_W / 2, y: bottom - CARABINER_H, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
  }
}

// ALL clips on the ground (none on the platforms) — spread across the tile at
// chest height every loop, so the player must brave the ground (and its snakes)
// to collect. Used by levels flagged `groundClipsOnly`.
function placeGroundClips(tile, tw) {
  const base = tile * tw;
  for (const f of [0.22, 0.5, 0.78]) {
    const x = base + f * tw;
    const bottom = surfaceY(x) - rand(10, 24);
    carabiners.push({ x: x - CARABINER_W / 2, y: bottom - CARABINER_H, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
  }
}

// Keep platforms / carabiners generated up to a little past the right screen edge.
function generateAhead() {
  const target = cameraX + VIEW_W + 400;
  if (currentLevel().terrain === "natural") {
    const lvl = currentLevel();
    if (lvl.platforms || lvl.ropes || lvl.groundClipsOnly || lvl.rareCarabiners) {
      // Tiled generation (carabiners + platforms/ropes/crash-platforms), once per
      // tile (worldGenX steps a whole tile at a time).
      const tw = lvl.tileW;
      while (worldGenX < target) {
        const tile = Math.floor(worldGenX / tw);
        if (lvl.rareCarabiners) {
          placeRareCarabiner(tile, tw);                         // Level 5: almost none
        } else if (lvl.ropes && !lvl.platforms) {
          placeSparseGroundClips(tile, tw);                     // Level 4: just one ground clip per tile
        } else if (lvl.groundClipsOnly) {
          if (lvl.sparseClips) placeSparseGroundClips(tile, tw); // Level 1: one ground clip per loop
          else placeGroundClips(tile, tw);                       // Level 3: 3 ground clips per tile
        } else if (lvl.platforms) {
          placePlatformCarabiners(tile, tw, lvl.platforms);     // clips on the ledges
          placeTrackCarabiners(tile, tw, lvl.platforms);        // clips in the ground gaps
        }
        // Level 5 crashing platforms: persistent per-instance state, spawned once
        // per tile (deterministic x/top from lvl.crashSpecs).
        if (lvl.crashSpecs) for (const cs of lvl.crashSpecs) {
          crashPlats.push({ x: tile * tw + cs.x0, y: cs.top, w: cs.x1 - cs.x0, h: 14,
            state: "solid", timer: 0, goneAt: 0, respawn: !!lvl.crashRespawn });
        }
        worldGenX += tw;
      }
      const a = Math.floor((cameraX - tw) / tw), b = Math.floor((cameraX + VIEW_W + tw) / tw);
      // Floating-platform collision boxes (painted into the fg art): rebuild for the
      // visible tiles each frame (deterministic, repeats every tileW).
      platforms = [];
      if (lvl.platforms) for (let t = a; t <= b; t++) {
        const evenTile = (((t % 2) + 2) % 2) === 0;   // shelter on every OTHER loop
        for (const bx of lvl.platforms) {
          platforms.push({ x: t * tw + bx.x0, y: bx.top, w: bx.x1 - bx.x0, h: 30, kind: "static", solid: true, rope: bx.rope, shelter: bx.shelter && evenTile });
        }
      }
      // Climbable swing ropes for the visible tiles (Level 4), same deterministic tiling.
      ropes = [];
      if (lvl.ropes) for (let t = a; t <= b; t++) for (const rp of lvl.ropes) {
        ropes.push({ x: t * tw + rp.x, top: rp.top, bottom: rp.bottom, alt: rp.alt });
      }
      // Descent ropes off the RIGHT end of flagged platforms, ending a bit ABOVE the
      // ground (Abu drops the last stretch — the rope never touches the ground).
      descentRopes = [];
      if (lvl.descend && lvl.platforms) for (const p of platforms) {
        if (!p.rope) continue;
        const rx = p.x + p.w - 6;
        descentRopes.push({ x: rx, top: p.y, bottom: surfaceY(rx) - 50 });
      }
      // Shelter safe-zones = the shelter ledges (up on a platform, off the ground path).
      shelters = [];
      if (lvl.power) for (const p of platforms) {
        if (!p.shelter) continue;
        shelters.push({ x: p.x, w: p.w, cx: p.x + p.w / 2, top: p.y });
      }
    } else {
      // Natural terrain without platforms: scatter sparse ground carabiners.
      while (worldGenX < target) {
        worldGenX += rand(150, 300);
        maybeGroundCarabinersAt(worldGenX);
      }
    }
  } else {
    while (worldGenX < target) {
      const gap = rand(PLAT_GAP_MIN, PLAT_GAP_MAX);
      const gapStart = worldGenX;
      worldGenX += gap;
      maybeGroundHazard(gapStart, gap);
      platforms.push(makePlatform(worldGenX));
      worldGenX += PLAT_WIDTH_MAX; // reserve space so the next gap starts after this block
    }
  }
  // Recycle anything well behind the camera.
  const cutoff = cameraX - 300;
  platforms  = platforms.filter(p => p.x + p.w > cutoff);
  carabiners = carabiners.filter(c => c.x + c.w > cutoff);
  pits       = pits.filter(p => p.x + p.w > cutoff);
  crashPlats = crashPlats.filter(p => p.x + p.w > cutoff);
}

// Level 4: a single ground clip per tile at a random spot — sparse, so Abu mostly
// scores by stomping the wolves/falcons rather than collecting.
function placeSparseGroundClips(tile, tw) {
  const x = tile * tw + rand(0.25, 0.75) * tw;
  const bottom = surfaceY(x) - rand(10, 24);
  carabiners.push({ x: x - CARABINER_W / 2, y: bottom - CARABINER_H, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
}

// Level 5: a single carabiner only now and then (survival over collection).
function placeRareCarabiner(tile, tw) {
  if (Math.random() > 0.28) return;                 // ~most tiles get nothing
  const x = tile * tw + rand(0.2, 0.8) * tw;
  const y = surfaceY(x) - rand(12, 26) - CARABINER_H;
  carabiners.push({ x: x - CARABINER_W / 2, y, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
}

// Level 4: a clip near the TOP of each rope, just below its anchor rock — only
// reachable by climbing all the way up the rope.
function placeRopeCarabiners(tile, tw, ropeList) {
  const base = tile * tw;
  for (const rp of ropeList) {
    const x = base + rp.x;
    carabiners.push({ x: x - CARABINER_W / 2, y: rp.top + SWING_MIN_L + 6, w: CARABINER_W, h: CARABINER_H, t: Math.random() * 6.28 });
  }
}

// Interpolate a heightmap `surf` (spanning [0,tileW]) at local-x.
function sampleSurf(surf, tileW, local) {
  const fx = local / (tileW / (surf.length - 1));
  let i = Math.floor(fx);
  if (i < 0) return surf[0];
  if (i >= surf.length - 1) return surf[surf.length - 1];
  const f = fx - i;
  return surf[i] * (1 - f) + surf[i + 1] * f;
}
// Total width of a multi-scene (`tiles`) level's repeating sequence (memoised).
function natSeqW(lvl) {
  if (!lvl._seqW) lvl._seqW = lvl.tiles.reduce((s, t) => s + t.tileW, 0);
  return lvl._seqW;
}

// Ground surface height at a world-x for natural terrain.
// - Single-image levels: the heightmap repeats every `tileW` and mirrors on odd
//   tiles to match the mirror-tiled art.
// - Multi-scene levels (`tiles`): the scenes play in sequence and repeat (no
//   mirror); pick the scene this world-x falls in and sample its heightmap.
function surfaceY(worldX) {
  const lvl = currentLevel();
  if (lvl.tiles) {
    const seqW = natSeqW(lvl);
    let pos = ((worldX % seqW) + seqW) % seqW;
    for (const t of lvl.tiles) {
      if (pos < t.tileW) return sampleSurf(t.surf, t.tileW, pos);
      pos -= t.tileW;
    }
    return GROUND_Y;
  }
  const surf = lvl.surf, tileW = lvl.tileW;
  if (!surf) return GROUND_Y;
  const t = Math.floor(worldX / tileW);
  let local = worldX - t * tileW;
  // parallax levels tile the foreground normally (no flip), so collision matches.
  if (lvl.bgMode !== "parallax" && (((t % 2) + 2) % 2) === 1) local = tileW - local;
  return sampleSurf(surf, tileW, local);
}

// Ground level for ENEMIES. If the level has a dedicated `enemySurf` (e.g. the
// Level 1 snake line), enemies stand on that; otherwise they share surfaceY.
function enemyFloorY(worldX) {
  const lvl = currentLevel();
  const es = lvl.enemySurf;
  if (!es || lvl.tiles) return surfaceY(worldX);
  const tileW = lvl.tileW;
  const t = Math.floor(worldX / tileW);
  let local = worldX - t * tileW;
  if (lvl.bgMode !== "parallax" && (((t % 2) + 2) % 2) === 1) local = tileW - local;
  return sampleSurf(es, tileW, local);
}

// True unless the given world-x sits over a lava pit (no solid floor there).
function groundSolidAt(cx) {
  for (const pit of pits) if (cx > pit.x && cx < pit.x + pit.w) return false;
  return true;
}

// Is the player currently resting on top of platform p (within a hair)?
function playerRidingOn(p) {
  return player && player.onGround &&
         player.x + player.w > p.x && player.x < p.x + p.w &&
         Math.abs((player.y + player.h) - p.y) < 3;
}

// Move moving/elevator platforms, advance crumbling blocks, and carry a rider.
// Runs BEFORE updatePlayer so landing tests see the new positions; rider
// detection uses last frame's onGround (still valid here).
function updatePlatforms(dt) {
  for (const p of platforms) {
    if (p.kind !== "mover") continue;
    p.phase += p.speed * dt;
    const off = Math.sin(p.phase) * p.amp;
    const nx = p.axis === "x" ? p.ox + off : p.ox;
    const ny = p.axis === "y" ? p.oy + off : p.oy;
    const dx = nx - p.x, dy = ny - p.y;
    p.x = nx; p.y = ny;
    if ((dx || dy) && playerRidingOn(p)) {  // carry the rider
      player.x += dx; player.y += dy;
    }
  }
}

/* =============================================================
   ENEMIES — spawn ahead, always walk left, recycle behind camera.
   ============================================================= */
function spawnEnemy() {
  const lvl = currentLevel();
  if (enemies.length >= (lvl.maxEnemies || MAX_ENEMIES)) return;
  // A level can list whole CREATURES (each with its own behaviour-type + sprite/
  // anim/frames/size) — used by the Level 5 gauntlet that mixes the snake, bear,
  // falcon and wolf. Otherwise fall back to the simple enemyMix of type strings.
  let cr = null, type;
  if (lvl.enemyCreatures) {
    cr = lvl.enemyCreatures[(Math.random() * lvl.enemyCreatures.length) | 0];
    type = cr.type;
  } else {
    const mix = lvl.enemyMix;
    type = mix[(Math.random() * mix.length) | 0];
  }
  const t = ENEMY_TYPES[type];
  const anim = cr ? (cr.anim || null) : (lvl.enemyAnim || null);   // animated sprite (e.g. snake)
  const sz = cr ? cr.size : (lvl.enemySize && lvl.enemySize[type]); // per-creature/per-type size
  const w = sz ? sz.w : (anim ? anim.w : t.w);
  const h = sz ? sz.h : (anim ? anim.h : t.h);
  const x = cameraX + VIEW_W + rand(40, 280);
  // Flyers float at a jump-reachable height; everyone else sits on the ground.
  const baseY = t.air ? GROUND_Y - h - rand(70, 120) : GROUND_Y - h;
  enemies.push({
    type, x, y: baseY, w, h, alive: true,
    speed: t.speed, hp: t.hp, points: t.points, color: t.color, air: t.air, anim,
    frames: cr ? (cr.frames || null) : null,   // per-creature frame strip (bear/falcon/wolf)
    walk:   cr ? (cr.walk   || null) : null,    // per-creature walk-bob params
    dive:   cr ? !!cr.dive : false,            // Level 5: this flyer swoops at the player
    diveState: "cruise", diveCd: rand(1.6, 3.4), diveTimer: 0, diveTx: 0, diveTy: 0,
    vy: 0, baseY, phase: Math.random() * 6.28, jumpTimer: rand(0.3, 1.0), hitFlash: 0
  });
}
function updateEnemies(dt) {
  const d = difficulty();
  const natural = currentLevel().terrain === "natural";
  for (const e of enemies) {
    e.x -= ENEMY_SPEED * e.speed * d * dt;
    if (e.hitFlash > 0) e.hitFlash -= dt;
    const floor = natural ? enemyFloorY(e.x + e.w / 2) : GROUND_Y;
    if (e.type === "hopper") {
      // Gravity + a periodic hop while grounded (on the local terrain surface).
      e.vy += GRAVITY * dt; e.y += e.vy * dt;
      if (e.y + e.h >= floor) {
        e.y = floor - e.h; e.vy = 0;
        e.jumpTimer -= dt;
        if (e.jumpTimer <= 0) { e.vy = HOPPER_JUMP; e.jumpTimer = rand(0.5, 1.2); }
      }
    } else if (e.type === "flyer") {
      e.phase += dt * 3;
      const base = natural ? floor - e.h - 80 : e.baseY;
      if (e.dive) {
        // Dive-bomber (Level 5): cruise → swoop toward a locked-in target near the
        // player → pull back up. The target is captured at dive-start (not homing)
        // so the player can sidestep it.
        if (e.diveState === "dive") {
          const dx = e.diveTx - (e.x + e.w / 2), dy = e.diveTy - (e.y + e.h / 2);
          const dist = Math.hypot(dx, dy) || 1;
          const sp = 380 * d;
          e.x += (dx / dist) * sp * dt;
          e.y += (dy / dist) * sp * dt;
          e.diveTimer -= dt;
          if (e.y > floor - e.h - 4) e.y = floor - e.h - 4;     // don't punch through the ground
          if (e.diveTimer <= 0 || dist < 14 || e.y >= floor - e.h - 4) e.diveState = "recover";
        } else if (e.diveState === "recover") {
          e.y += (base - e.y) * Math.min(1, 4 * dt);             // climb back to cruise height
          if (Math.abs(e.y - base) < 5) { e.diveState = "cruise"; e.diveCd = rand(1.4, 3.0); }
        } else {                                                 // cruise
          e.y = base + Math.sin(e.phase) * 26;
          e.diveCd -= dt;
          const sxp = e.x - cameraX;
          const ahead = (e.x + e.w / 2) > (player.x + player.w / 2);  // only swoop from in front
          if (e.diveCd <= 0 && sxp > 40 && sxp < VIEW_W && ahead) {
            e.diveState = "dive"; e.diveTimer = 1.1;
            e.diveTx = player.x + player.w / 2;                  // lock the target now
            e.diveTy = player.y + player.h / 2;
          }
        }
      } else {
        // Gentle float/bob (Levels 3-4).
        e.y = base + Math.sin(e.phase) * 26;
      }
    } else if (natural) {
      // walker & tank follow the uneven ground surface.
      e.y = floor - e.h;
    }
    // (on block levels walker & tank keep their fixed ground y.)
  }
  enemies = enemies.filter(e => e.alive && e.x + e.w > cameraX - 200);
  if (!ENEMIES_ENABLED) return;   // TEMP: snakes disabled for terrain testing
  enemySpawnTimer -= dt;
  if (enemySpawnTimer <= 0) {
    spawnEnemy();
    // Higher levels spawn faster (smaller spawnMul); also tightens with distance.
    const ramp = 1 + Math.min(cameraX / 6000, 0.6);
    enemySpawnTimer = rand(ENEMY_SPAWN_MIN, ENEMY_SPAWN_MAX) * currentLevel().spawnMul / ramp;
  }
}

/* =============================================================
   PLAYER — full left/right control, gravity, jump.
   ============================================================= */
function initPlayer() {
  player = { x: 80, y: GROUND_Y - PLAYER_H, w: PLAYER_W, h: PLAYER_H,
             vx: 0, vy: 0, slideVx: 0, onGround: true, facing: 1, walkPhase: 0,
             coyoteTimer: 0, jumpBufferTimer: 0, prevJump: false,
             swinging: false, swing: null, launchVx: 0, ropeHold: 0, mantle: null, descend: null,
             onPlatform: false };
}

// Rope SWING + CLIMB (Level 4): a real pendulum hung from a high rock. Jump into a
// rope to grab; hold Left/Right to pump the swing; HOLD Up to CLIMB up the rope (to
// climb above the enemies); a quick TAP of Up jumps off with a real upward leap
// (gravity brings him back to the ground). Returns true while on the rope.
function updateSwing(dt) {
  if (!ropes.length) return false;
  const upHeld = anyKey(JUMP_KEYS);
  const upPressed = upHeld && !player.prevJump;
  const upReleased = !upHeld && player.prevJump;
  const left = anyKey(LEFT_KEYS), right = anyKey(RIGHT_KEYS);

  if (player.swinging) {
    const s = player.swing;
    // Pendulum: gravity restores toward vertical; holding L/R pumps the swing.
    let alpha = -(SWING_G / s.L) * Math.sin(s.theta);
    if (right) alpha += SWING_PUMP;
    if (left)  alpha -= SWING_PUMP;
    s.omega += alpha * dt;
    s.omega -= s.omega * SWING_DAMP * dt;
    s.theta += s.omega * dt;
    if (s.theta >  SWING_MAX) { s.theta =  SWING_MAX; if (s.omega > 0) s.omega = 0; }
    if (s.theta < -SWING_MAX) { s.theta = -SWING_MAX; if (s.omega < 0) s.omega = 0; }
    if (right) player.facing = 1;          // facing follows input, not the swing
    else if (left) player.facing = -1;
    // Up: a quick tap jumps off; holding past ROPE_TAP climbs up the rope.
    if (upPressed) player.ropeHold = 0;
    if (upHeld) {
      player.ropeHold += dt;
      if (player.ropeHold > ROPE_TAP) s.L = Math.max(SWING_MIN_L, s.L - SWING_CLIMB * dt);
    }
    const jumpOff = upReleased && player.ropeHold <= ROPE_TAP;   // released as a quick tap
    // Leave the rope with a jump off (real upward leap + the swing's momentum).
    if (jumpOff) {
      player.vx = Math.cos(s.theta) * s.L * s.omega * SWING_RELEASE;
      player.vy = -Math.sin(s.theta) * s.L * s.omega * SWING_RELEASE - 470;
      player.launchVx = player.vx;
      player.swinging = false; player.swing = null; player.onGround = false;
      player.prevJump = upHeld;
      return false;
    }
    // Hang from the anchor at length L.
    player.x = s.ax + Math.sin(s.theta) * s.L - player.w / 2;
    player.y = s.ay + Math.cos(s.theta) * s.L;
    player.vx = 0; player.vy = 0;
    player.walkPhase += dt * (Math.abs(s.omega) + 1);
    if (invulnTimer > 0) invulnTimer -= dt;
    player.prevJump = upHeld;
    return true;
  }

  // Grab: hands near a rope's hanging span and pressing Up (or flying into it).
  const cx = player.x + player.w / 2, hy = player.y;
  if (upPressed || !player.onGround) for (const r of ropes) {
    const L = r.bottom - r.top, ax = r.x, ay = r.top;
    if (Math.abs(cx - ax) < 26 && hy > ay && hy < r.bottom + 24 && (upPressed || Math.abs(player.vx) > 30)) {
      const dx = cx - ax, dy = Math.max(SWING_MIN_L, hy - ay);
      const len = Math.min(L, Math.hypot(dx, dy));
      player.swinging = true;
      player.swing = { ax, ay, L: len, theta: Math.atan2(dx, dy), omega: player.vx / Math.max(40, len) };
      player.onGround = false; player.vy = 0;
      player.ropeHold = 99;   // treat the grab's held jump as a "hold" so releasing it doesn't fire a jump-off
      player.prevJump = upHeld;
      return true;
    }
  }
  return false;
}

// Ledge mantle (Level 1): hang from the caught edge, then pull up onto the platform.
function updateMantle(dt) {
  const m = player.mantle;
  m.t += dt;
  if (m.phase === "hang") {
    if (m.t >= 0.20) { m.phase = "climb"; m.t = 0; m.fromY = player.y; }
  } else {
    const k = Math.min(1, m.t / 0.40), ease = 1 - (1 - k) * (1 - k);
    player.y = m.fromY + (m.top - player.h - m.fromY) * ease;
    const tx = Math.max(m.px + 4, Math.min(m.px + m.pw - player.w - 4, player.x));
    player.x += (tx - player.x) * Math.min(1, 8 * dt);   // slide onto the deck
    if (k >= 1) {
      player.y = m.top - player.h; player.x = tx;
      player.onGround = true; player.onPlatform = true; player.vy = 0; player.mantle = null;
      drainPower(POWER_MANTLE);                          // climbing up costs stamina
      dustBurst(player.x + player.w / 2, m.top);
    }
  }
  if (invulnTimer > 0) invulnTimer -= dt;
}

// Descent rope (Level 1): climb down (Down) / up (Up) a rope hung off a platform
// edge; reach the ground to step off, or Jump / sideways to let go.
function updateDescend(dt) {
  const d = player.descend;
  const down = anyKey(DOWN_KEYS), up = anyKey(JUMP_KEYS);
  const jumpPressed = up && !player.prevJump, side = anyKey(LEFT_KEYS) || anyKey(RIGHT_KEYS);
  player.x = d.x - player.w / 2; player.vx = 0; player.vy = 0;
  if (jumpPressed || side) {                          // let go
    player.descend = null; player.onGround = false;
    if (side) { const dir = anyKey(RIGHT_KEYS) ? 1 : -1; player.facing = dir; player.x += dir * 6; }
    player.vy = jumpPressed ? -360 : -120; player.prevJump = up;
    return;
  }
  if (down) { player.y += DESCEND_SPEED * dt; drainPower(POWER_CLIMB_RATE * dt); }
  else if (up) { player.y -= DESCEND_SPEED * dt; drainPower(POWER_CLIMB_RATE * dt); }
  if (player.y + player.h <= d.top) {                 // back up to the platform deck
    player.y = d.top - player.h; player.descend = null; player.onGround = true;
  }
  if (player.y + player.h >= d.bottom) {              // reached the rope's end — drop off
    player.y = d.bottom - player.h; player.descend = null; player.onGround = false; player.vy = 80;
  }
  player.prevJump = up;
  if (invulnTimer > 0) invulnTimer -= dt;
}

function updatePlayer(dt) {
  if (updateSwing(dt)) return;     // on a rope — the pendulum handles movement this frame
  if (player.mantle) { updateMantle(dt); return; }   // climbing a platform edge
  if (player.descend) { updateDescend(dt); return; } // climbing down a descent rope

  let move = 0;
  if (anyKey(LEFT_KEYS)) move -= 1;
  if (anyKey(RIGHT_KEYS)) move += 1;
  if (move !== 0) player.facing = move;

  // Movement is normally instant (vx = input). Two exceptions:
  //  - just launched off a rope swing: keep that horizontal momentum in the air
  //    (with light steering + decay) so the launch carries Abu forward.
  //  - on a Level-5 ice lake: velocity only eases toward input, so he slides.
  const target = move * PLAYER_SPEED;
  if (!player.onGround && Math.abs(player.launchVx) > 5) {
    player.launchVx += move * 150 * dt;     // a little air steering
    player.launchVx *= (1 - 0.9 * dt);      // decay back toward normal control
    player.vx = player.launchVx;
  } else if (currentLevel().terrain === "natural" && player.onGround &&
             isOnIce(player.x + player.w / 2)) {
    player.launchVx = 0;
    const grip = (move !== 0 ? ICE_GRIP : ICE_STOP_GRIP);
    player.slideVx += (target - player.slideVx) * Math.min(1, grip * dt);
    player.vx = player.slideVx;
  } else {
    player.launchVx = 0;
    player.vx = target;
    player.slideVx = target;   // stay in sync so the first icy step is smooth
  }

  // Advance the walk cycle only while moving on the ground, and kick up a
  // little dust on every footfall so it reads as walking, not sliding.
  if (move !== 0 && player.onGround) {
    const prevPhase = player.walkPhase;
    player.walkPhase += dt * 9.5;
    // |sin| dips to 0 at each multiple of PI — that's a footfall.
    if (Math.floor(player.walkPhase / Math.PI) !== Math.floor(prevPhase / Math.PI)) {
      footDust(player.x + player.w / 2 - player.facing * 5, player.y + player.h);
    }
  } else if (player.onGround) {
    player.walkPhase = 0;   // reset to a neutral stance when standing still
  }

  // --- Jump feel: coyote time, jump buffering, variable height ---
  // Coyote: keep "can jump" alive briefly after walking off a ledge.
  if (player.onGround) player.coyoteTimer = COYOTE_TIME;
  else player.coyoteTimer = Math.max(0, player.coyoteTimer - dt);

  const jumpHeld     = anyKey(JUMP_KEYS);
  const jumpPressed  = jumpHeld && !player.prevJump;   // rising edge
  const jumpReleased = !jumpHeld && player.prevJump;   // falling edge
  player.prevJump = jumpHeld;

  // Buffer a fresh press so it still fires if made just before landing.
  if (jumpPressed) player.jumpBufferTimer = JUMP_BUFFER;
  else if (player.jumpBufferTimer > 0) player.jumpBufferTimer -= dt;

  if (player.jumpBufferTimer > 0 && (player.onGround || player.coyoteTimer > 0)) {
    player.vy = JUMP_VELOCITY * (currentLevel().jumpMul || 1);
    player.onGround = false;
    player.coyoteTimer = 0;
    player.jumpBufferTimer = 0;
    Music.sfxJump();
  }

  // Variable height: releasing the button early cuts the rise -> short hop.
  if (jumpReleased && player.vy < 0) player.vy *= JUMP_CUT;

  player.vy += GRAVITY * dt;

  const natural = currentLevel().terrain === "natural";

  // --- Horizontal move ---
  let nx = player.x + player.vx * dt;
  if (nx < 0) nx = 0;
  // Natural terrain: auto-step small ledges, but a tall ledge is a wall to jump.
  if (natural && player.onGround && player.vx !== 0) {
    const gs = surfaceY(nx + player.w / 2);
    const rise = (player.y + player.h) - gs;     // >0: surface is above the feet
    if (rise > TERR_STEP_UP) {
      nx = player.x;                              // too tall — blocked, must jump
    } else if (rise > -TERR_STEP_DOWN) {
      player.y = gs - player.h;                   // step up / down a small ledge
    }
    // a bigger drop is left to gravity below (walk off the ledge and fall)
  }
  player.x = nx;

  // Strong wind (Level 5): a steady backward push plus gusts, stronger mid-air
  // where the player has no footing.
  if (currentLevel().wind) {
    player.x += windCurrent * (player.onGround ? 0.55 : 1.0) * dt;
    if (player.x < 0) player.x = 0;
  }

  const prevBottom = player.y + player.h;
  player.y += player.vy * dt;
  player.onGround = false;

  if (player.vy >= 0) {
    const impactVy = player.vy;                 // descending speed this frame
    const newBottom = player.y + player.h;
    for (const p of platforms) {
      if (p.solid === false) continue;   // fallen crumbling block — no landing
      const overlapX = player.x + player.w > p.x && player.x < p.x + p.w;
      if (overlapX && prevBottom <= p.y + 1 && newBottom >= p.y) {
        player.y = p.y - player.h; player.vy = 0; player.onGround = true; player.onPlatform = true;
        if (impactVy > 250) dustBurst(player.x + player.w / 2, p.y);
        break;
      }
    }
    // Level-5 crashing platforms: land normally, but stepping on a solid one starts
    // it shaking (it breaks a moment later in updateCrashPlats).
    if (!player.onGround) for (const p of crashPlats) {
      if (p.state === "gone") continue;
      const overlapX = player.x + player.w > p.x && player.x < p.x + p.w;
      if (overlapX && prevBottom <= p.y + 1 && newBottom >= p.y) {
        player.y = p.y - player.h; player.vy = 0; player.onGround = true;
        if (p.state === "solid") { p.state = "shaking"; p.timer = rand(CRASH_FALL_MIN, CRASH_FALL_MAX); }
        if (impactVy > 250) dustBurst(player.x + player.w / 2, p.y);
        break;
      }
    }
    // Land on the ground: a terrace top on natural terrain, else the flat ground
    // (solid everywhere except over a lava pit).
    if (!player.onGround) {
      const gs = natural ? surfaceY(player.x + player.w / 2) : GROUND_Y;
      const solid = natural ? true : groundSolidAt(player.x + player.w / 2);
      if (newBottom >= gs && solid) {
        player.y = gs - player.h; player.vy = 0; player.onGround = true;
        if (player.onPlatform) drainPower(POWER_FALL);   // dropped off a platform instead of the rope
        player.onPlatform = false;
        if (impactVy > 250) dustBurst(player.x + player.w / 2, gs);
      }
    }
  }

  // Ledge grab (Level 1): a short jump that catches a platform edge — Abu grabs the
  // lip and mantles up (handled by updateMantle) instead of standing on it directly.
  if (currentLevel().ledgeGrab && !player.onGround && !player.mantle && player.vy > -260) {
    const cx = player.x + player.w / 2, handY = player.y;
    for (const p of platforms) {
      const nearX = cx > p.x - 10 && cx < p.x + p.w + 10;
      const handsAtLip = handY >= p.y - 34 && handY <= p.y + 22;   // hands around the lip
      const feetBelow = player.y + player.h > p.y + 8;             // feet still below the top
      if (nearX && handsAtLip && feetBelow) {
        player.mantle = { px: p.x, pw: p.w, top: p.y, t: 0, phase: "hang" };
        player.vx = 0; player.vy = 0;
        player.y = p.y - 4;                                        // hands at the lip, body hanging below
        player.x = Math.max(p.x - player.w * 0.45, Math.min(p.x + p.w - player.w * 0.55, player.x));
        player.facing = (cx < p.x + p.w / 2) ? 1 : -1;            // face into the platform
        break;
      }
    }
  }

  // Descent rope (Level 1): standing on a platform edge over a rope + holding Down
  // → grab it and climb down.
  if (currentLevel().descend && !player.descend && player.onGround && anyKey(DOWN_KEYS)) {
    const cx = player.x + player.w / 2, feet = player.y + player.h;
    for (const dr of descentRopes) {
      if (Math.abs(cx - dr.x) < 22 && Math.abs(feet - dr.top) < 12 && dr.bottom - dr.top > 30) {
        player.descend = { x: dr.x, top: dr.top, bottom: dr.bottom };
        player.x = dr.x - player.w / 2; player.y = dr.top - 6; player.vy = 0; player.onGround = false; player.onPlatform = false;
        break;
      }
    }
  }

  if (invulnTimer > 0) invulnTimer -= dt;
}

function recordBest() {
  if (score > bestScore) {
    bestScore = score; newBest = true;
    try { localStorage.setItem("abushakra_best", String(bestScore)); } catch (e) {}
  }
}

function loseLife() {
  if (invulnTimer > 0) return;
  lives -= 1;
  invulnTimer = INVULN_TIME;
  addShake(11);
  if (lives <= 0) {
    lives = 0; state = "gameover"; Music.stop(); Music.sfxOver();
    recordBest();
  } else {
    Music.sfxHurt();
  }
}

// Level-1 stamina: exertion drains it; empty -> lose a life and refill.
function drainPower(amt) {
  if (!currentLevel().power) return;
  power -= amt;
  if (power <= 0) { power = POWER_MAX; loseLife(); }
}
// Recover inside a shelter; track whether Abu is sheltered (for enemy safety).
function updatePower(dt) {
  playerSheltered = false;
  if (!currentLevel().power) return;
  const cx = player.x + player.w / 2, feet = player.y + player.h;
  for (const s of shelters) {
    if (cx > s.x && cx < s.x + s.w && player.onGround && Math.abs(feet - s.top) < 10) { playerSheltered = true; break; }
  }
  if (playerSheltered) power = Math.min(POWER_MAX, power + POWER_REFILL * dt);
}

/* =============================================================
   COLLISIONS
   ============================================================= */
function handleCarabiners() {
  for (const c of carabiners) if (!c.collected && aabb(player, c)) {
    c.collected = true; score += CARABINER_POINTS; levelCarabiners += 1;
    sparkleBurst(c.x + c.w / 2, c.y + c.h / 2);
    Music.sfxCoin();
  }
  carabiners = carabiners.filter(c => !c.collected);
}
function handleHazards() {
  // Empty holes — falling in costs a life; rescue back to the near solid edge.
  const cx = player.x + player.w / 2;
  if (player.y + player.h > GROUND_Y + PIT_FALL_DEPTH) {
    for (const pit of pits) {
      if (cx > pit.x && cx < pit.x + pit.w) {
        loseLife();                            // self-guards during invulnerability
        if (state === "playing") {             // lift back onto solid ground
          player.x = Math.max(0, pit.x - player.w - 6);
          player.y = GROUND_Y - player.h; player.vy = 0; player.onGround = true;
        }
        break;
      }
    }
  }
}
function handleEnemies() {
  for (const e of enemies) {
    if (!e.alive || !aabb(player, e)) continue;
    const feet = player.y + player.h;
    const stomping = player.vy > 0 && feet < e.y + e.h * 0.6;
    if (stomping) {
      player.vy = STOMP_BOUNCE; player.onGround = false;
      e.hp -= 1;
      if (e.hp <= 0) {
        e.alive = false; score += e.points;
        poofBurst(e.x + e.w / 2, e.y + e.h / 2); addShake(5); Music.sfxStomp();
      } else {
        // Survived (tank): flash, small poof, keep going.
        e.hitFlash = 0.3; poofBurst(e.x + e.w / 2, e.y + e.h / 2); addShake(4); Music.sfxStomp();
      }
    }
    else if (!playerSheltered) loseLife();   // safe inside a shelter
  }
  enemies = enemies.filter(e => e.alive);
}

/* =============================================================
   CAMERA
   ============================================================= */
function updateCamera() {
  cameraX = Math.max(0, player.x + player.w / 2 - VIEW_W * CAMERA_ANCHOR);
}

/* =============================================================
   EFFECTS — particles (dust / sparkle / poof) and screen shake.
   Purely cosmetic; updated every frame regardless of game state.
   ============================================================= */
function spawnParticles(x, y, n, o) {
  for (let i = 0; i < n; i++) {
    const a = rand(o.angMin, o.angMax), sp = rand(o.spdMin, o.spdMax);
    const life = rand(o.lifeMin, o.lifeMax);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, grav: o.grav,
      life, maxLife: life, size: rand(o.sizeMin, o.sizeMax),
      color: o.colors[(Math.random() * o.colors.length) | 0]
    });
  }
}
// Tan dust kicked up on a hard landing (sprays sideways/up).
function dustBurst(x, y) {
  spawnParticles(x, y, 9, { angMin: -Math.PI, angMax: 0, spdMin: 40, spdMax: 170,
    grav: 520, lifeMin: 0.25, lifeMax: 0.5, sizeMin: 2, sizeMax: 4,
    colors: ["#d8c8a8", "#bfae8c", "#efe6d0"] });
}
// Small puff under a foot on each step (subtle — gates the "walking" read).
function footDust(x, y) {
  spawnParticles(x, y, 3, { angMin: -Math.PI * 0.85, angMax: -Math.PI * 0.15, spdMin: 18, spdMax: 64,
    grav: 480, lifeMin: 0.16, lifeMax: 0.32, sizeMin: 1.5, sizeMax: 3,
    colors: ["#d8c8a8", "#cbbf9f", "#e8dcc4"] });
}
// Steel/silver sparkle when a carabiner is clipped.
function sparkleBurst(x, y) {
  spawnParticles(x, y, 12, { angMin: 0, angMax: Math.PI * 2, spdMin: 60, spdMax: 220,
    grav: 120, lifeMin: 0.3, lifeMax: 0.6, sizeMin: 2, sizeMax: 4,
    colors: ["#e6ebf2", "#b8c0cc", "#ffffff"] });
}
// Green poof when an enemy is stomped.
function poofBurst(x, y) {
  spawnParticles(x, y, 14, { angMin: 0, angMax: Math.PI * 2, spdMin: 50, spdMax: 210,
    grav: 220, lifeMin: 0.3, lifeMax: 0.6, sizeMin: 3, sizeMax: 6,
    colors: ["#7bd36a", "#4f9e3f", "#bff2a8"] });
}
function addShake(mag) { if (mag > shake) shake = mag; }
// Icy shards when a crash platform cracks / breaks.
function iceCrack(x, y) {
  spawnParticles(x, y, 2, { angMin: -Math.PI, angMax: 0, spdMin: 20, spdMax: 90,
    grav: 500, lifeMin: 0.2, lifeMax: 0.4, sizeMin: 1.5, sizeMax: 3,
    colors: ["#dff2fb", "#a9d4e8", "#ffffff"] });
}
function iceBreak(x, y, w) {
  spawnParticles(x, y, 16, { angMin: 0, angMax: Math.PI, spdMin: 40, spdMax: 200,
    grav: 720, lifeMin: 0.35, lifeMax: 0.7, sizeMin: 2, sizeMax: 5,
    colors: ["#cfeaf6", "#9cc6db", "#ffffff", "#7fb4cf"] });
}

/* =============================================================
   LEVEL 5 "NIGHTMARE" SYSTEMS — ice lakes, crashing platforms, wind, snowstorm.
   All gated on per-level flags so other levels are untouched.
   ============================================================= */
// Reduced-friction zones repeat every tileW (local-x ranges in lvl.iceZones).
function isOnIce(worldX) {
  const lvl = currentLevel();
  if (!lvl.iceZones) return false;
  const tw = lvl.tileW || 675;
  const local = ((worldX % tw) + tw) % tw;
  for (const z of lvl.iceZones) if (local >= z.x0 && local <= z.x1) return true;
  return false;
}

function updateCrashPlats(dt) {
  for (const p of crashPlats) {
    if (p.state === "shaking") {
      p.timer -= dt;
      if (Math.random() < dt * 16) iceCrack(p.x + Math.random() * p.w, p.y);
      if (p.timer <= 0) { p.state = "gone"; p.goneAt = 0; iceBreak(p.x + p.w / 2, p.y, p.w); addShake(4); }
    } else if (p.state === "gone" && p.respawn) {
      p.goneAt += dt;
      if (p.goneAt >= 5) p.state = "solid";
    }
  }
}

function drawCrashPlatforms() {
  for (const p of crashPlats) {
    if (p.state === "gone") continue;
    let ox = 0, oy = 0;
    if (p.state === "shaking") { ox = (Math.random() * 2 - 1) * 1.6; oy = (Math.random() * 2 - 1) * 1.6; }
    const x = p.x - cameraX + ox, y = p.y + oy;
    if (x > VIEW_W || x + p.w < 0) continue;
    ctx.fillStyle = p.state === "shaking" ? "#bfe0ee" : "#d6eef8";
    ctx.fillRect(x, y, p.w, p.h);
    ctx.fillStyle = "#9cc6db"; ctx.fillRect(x, y + p.h - 4, p.w, 4);     // shaded underside
    ctx.fillStyle = "#ffffff"; ctx.fillRect(x, y, p.w, 3);              // snow cap
    if (p.state === "shaking") {                                        // cracks
      ctx.strokeStyle = "rgba(45,75,95,0.85)"; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x + p.w * 0.5, y);  ctx.lineTo(x + p.w * 0.42, y + p.h);
      ctx.moveTo(x + p.w * 0.25, y); ctx.lineTo(x + p.w * 0.3, y + p.h);
      ctx.moveTo(x + p.w * 0.75, y); ctx.lineTo(x + p.w * 0.68, y + p.h);
      ctx.stroke();
    }
  }
}

// Cyan frozen patches hugging the terrain surface inside each ice zone.
function drawIceLakes() {
  const lvl = currentLevel();
  if (!lvl.iceZones) return;
  const tw = lvl.tileW || 675;
  const a = Math.floor(cameraX / tw) - 1, b = Math.floor((cameraX + VIEW_W) / tw) + 1;
  for (let t = a; t <= b; t++) for (const z of lvl.iceZones) {
    const wx0 = t * tw + z.x0, wx1 = t * tw + z.x1;
    if (wx1 - cameraX < 0 || wx0 - cameraX > VIEW_W) continue;
    ctx.fillStyle = "rgba(150,225,245,0.42)";
    ctx.beginPath();
    let started = false;
    for (let wx = wx0; wx <= wx1; wx += 8) { const gx = wx - cameraX, gy = surfaceY(wx); started ? ctx.lineTo(gx, gy) : (ctx.moveTo(gx, gy), started = true); }
    for (let wx = wx1; wx >= wx0; wx -= 8) ctx.lineTo(wx - cameraX, surfaceY(wx) + 8);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let wx = wx0; wx <= wx1; wx += 8) { const gx = wx - cameraX, gy = surfaceY(wx); wx === wx0 ? ctx.moveTo(gx, gy) : ctx.lineTo(gx, gy); }
    ctx.stroke();
  }
}

function initWeather() {
  weather = [];
  if (!currentLevel().snowstorm) return;
  for (let i = 0; i < SNOW_COUNT; i++)
    weather.push({ x: Math.random() * VIEW_W, y: Math.random() * VIEW_H, z: rand(0.4, 1.5), sway: Math.random() * 6.28 });
}

function updateWeather(dt) {
  const lvl = currentLevel();
  if (lvl.wind) {
    windT += dt;
    windCurrent = WIND_BASE + Math.sin(windT * 0.6) * WIND_GUST + Math.sin(windT * 1.7) * (WIND_GUST * 0.35);
  } else windCurrent = 0;
  if (!lvl.snowstorm) return;
  for (const f of weather) {
    f.sway += dt * 2;
    f.x += (windCurrent * 0.7 * f.z + Math.sin(f.sway) * 14 - 26 * f.z) * dt;
    f.y += (90 + 70 * f.z) * dt;
    if (f.y > VIEW_H + 4) { f.y = -4; f.x = Math.random() * (VIEW_W + 40) - 20; }
    if (f.x < -10) f.x += VIEW_W + 20;
    else if (f.x > VIEW_W + 10) f.x -= VIEW_W + 20;
  }
}

function drawWeather() {
  if (!currentLevel().snowstorm) return;
  ctx.fillStyle = "rgba(255,255,255,0.10)";     // faint whiteout fog
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  for (const f of weather) { const s = Math.max(1, Math.round(f.z * 2)); ctx.fillRect(f.x | 0, f.y | 0, s, s); }
}

// Falling icicles (Level 5): a ground marker telegraphs the impact spot, then a
// spike drops from the top. Dodgeable, but a real ranged threat with the ice/wind.
function updateIcicles(dt) {
  const lvl = currentLevel();
  if (lvl.icicles) {
    icicleTimer -= dt;
    if (icicleTimer <= 0) {
      const tx = player.x + player.w / 2 + rand(-50, 340);   // threaten the path ahead
      icicles.push({ x: tx, state: "warn", timer: ICICLE_WARN, y: 0, vy: 0, w: ICICLE_W, h: ICICLE_H });
      icicleTimer = rand(ICICLE_MIN, ICICLE_MAX) / difficulty();   // more frequent as difficulty ramps
    }
  }
  for (const ic of icicles) {
    if (ic.state === "warn") {
      ic.timer -= dt;
      if (ic.timer <= 0) { ic.state = "fall"; ic.y = -ICICLE_H; ic.vy = 520; }
    } else if (ic.state === "fall") {
      ic.vy += 700 * dt; ic.y += ic.vy * dt;
      const gy = surfaceY(ic.x);
      if (aabb(player, { x: ic.x - ic.w / 2, y: ic.y, w: ic.w, h: ic.h })) {
        loseLife(); ic.state = "done"; iceBreak(ic.x, ic.y + ic.h, ic.w);   // loseLife self-guards on i-frames
      } else if (ic.y + ic.h >= gy) {
        ic.state = "done"; iceBreak(ic.x, gy, ic.w); addShake(3);
      }
    }
  }
  icicles = icicles.filter(ic => ic.state !== "done" && ic.x > cameraX - 200 && ic.x < cameraX + VIEW_W + 500);
}

function drawIcicles() {
  if (!currentLevel().icicles) return;
  const now = performance.now();
  for (const ic of icicles) {
    const sx = ic.x - cameraX;
    if (sx < -40 || sx > VIEW_W + 40) continue;
    if (ic.state === "warn") {
      const gy = surfaceY(ic.x), pulse = 0.5 + 0.5 * Math.sin(now / 70);
      ctx.globalAlpha = 0.45 + 0.45 * pulse;
      ctx.strokeStyle = "#ff5a5a"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx - 8, gy - 24); ctx.lineTo(sx, gy - 13); ctx.lineTo(sx + 8, gy - 24); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(sx, gy - 3, 10, 4, 0, 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(205,238,252,0.85)";   // glint at the top, about to drop
      ctx.beginPath(); ctx.moveTo(sx - 5, 0); ctx.lineTo(sx + 5, 0); ctx.lineTo(sx, 11); ctx.closePath(); ctx.fill();
    } else if (ic.state === "fall") {
      const grad = ctx.createLinearGradient(0, ic.y, 0, ic.y + ic.h);
      grad.addColorStop(0, "#eaf7ff"); grad.addColorStop(1, "#7fb8d6");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.moveTo(sx - ic.w / 2, ic.y); ctx.lineTo(sx + ic.w / 2, ic.y); ctx.lineTo(sx, ic.y + ic.h); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fillRect(sx - ic.w / 2 + 2, ic.y, 2, ic.h * 0.6);
    }
  }
}

// Called whenever a new level starts (test button, fresh game, or advance).
function enterLevelEffects() {
  crashPlats = []; windT = 0; windCurrent = 0;
  icicles = []; icicleTimer = rand(ICICLE_MIN, ICICLE_MAX);
  ropes = []; descentRopes = []; shelters = [];
  power = POWER_MAX; playerSheltered = false;
  if (player) { player.swinging = false; player.swing = null; player.launchVx = 0; player.descend = null; player.onPlatform = false; }
  initWeather();
}

function updateEffects(dt) {
  for (const p of particles) {
    p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  if (shake > 0) shake = Math.max(0, shake - 36 * dt);
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    const s = p.size | 0;
    ctx.fillRect(Math.round(p.x - cameraX - s / 2), Math.round(p.y - s / 2), s, s);
  }
  ctx.globalAlpha = 1;
}

/* =============================================================
   DRAW
   ============================================================= */
function drawBackground() {
  const lvl = currentLevel();
  // Natural levels: draw the painted scene(s) 1:1 so the foreground ledges line
  // up with the collision heightmap (no parallax — art and terrain stay aligned).
  if (lvl.terrain === "natural") { drawNaturalScene(); return; }
  const bgKey = lvl.bg;
  if (!imgLoaded[bgKey]) {
    const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    g.addColorStop(0, "#87b5e8"); g.addColorStop(1, "#cfe7ff");
    ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    return;
  }
  const img = images[bgKey];
  const tileW = img.naturalWidth * (VIEW_H / img.naturalHeight);
  const scroll = cameraX * BG_PARALLAX;
  // World-stable tile index of the leftmost visible copy (parity must follow
  // world position, not the screen, so tiles don't flicker as we scroll).
  const firstIndex = Math.floor(scroll / tileW);
  const bleed = 1;  // 1px overlap so no hairline gap shows at a seam
  for (let i = firstIndex; ; i++) {
    const x = i * tileW - scroll;          // screen-x of this tile's left edge
    if (x >= VIEW_W) break;
    // Mirror every other copy: a flipped tile's left edge equals the previous
    // tile's right edge, so neighbours connect into a seamless loop.
    const mirror = (((i % 2) + 2) % 2) === 1;
    ctx.save();
    if (mirror) {
      ctx.translate(x + tileW + bleed, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(img, 0, 0, tileW + bleed, VIEW_H);
    } else {
      ctx.drawImage(img, x, 0, tileW + bleed, VIEW_H);
    }
    ctx.restore();
  }
}

function drawGround() {
  // Level 1: the painted scene (drawn in drawBackground) already includes the
  // ground; collision is the invisible ZUG_SURF heightmap.
  if (currentLevel().terrain === "natural") return;
  const bandH = VIEW_H - GROUND_Y;
  if (imgLoaded.platform) {
    const img = images.platform;
    const tileW = img.naturalWidth * (bandH / img.naturalHeight);
    let startX = -(cameraX % tileW);
    if (startX > 0) startX -= tileW;
    for (let x = startX; x < VIEW_W; x += tileW) ctx.drawImage(img, x, GROUND_Y, tileW, bandH);
  } else {
    ctx.fillStyle = "#6b6660"; ctx.fillRect(0, GROUND_Y, VIEW_W, bandH);
  }
}

// Draw the painted scene(s) 1:1 so the foreground ledges sit exactly where the
// collision heightmap says. Single-image levels mirror-tile one image; multi-
// scene (`tiles`) levels lay their scenes out in repeating sequence (no mirror).
function drawNaturalScene() {
  const lvl = currentLevel();
  const bleed = 1;

  // Level 1: two parallax layers (far mountains + transparent near foreground).
  if (lvl.bgMode === "parallax") { drawParallaxScene(lvl); return; }

  if (lvl.tiles) {
    const seqW = natSeqW(lvl);
    let wx = Math.floor(cameraX / seqW) * seqW;   // start of the sequence cycle at the left edge
    while (wx - cameraX < VIEW_W) {
      for (const t of lvl.tiles) {
        const x = wx - cameraX;
        if (x + t.tileW > 0 && x < VIEW_W && imgLoaded[t.bg]) {
          const im = images[t.bg];
          ctx.drawImage(im, 0, 0, im.naturalWidth, im.naturalHeight, x, 0, t.tileW + bleed, VIEW_H);
        }
        wx += t.tileW;
        if (wx - cameraX >= VIEW_W) break;
      }
    }
    return;
  }

  if (!imgLoaded[lvl.bg]) return;
  const img = images[lvl.bg];
  const tileW = lvl.tileW || ZUG_TILE_W;
  const first = Math.floor(cameraX / tileW);
  for (let i = first; ; i++) {
    const x = i * tileW - cameraX;
    if (x >= VIEW_W) break;
    const mirror = (((i % 2) + 2) % 2) === 1;
    ctx.save();
    if (mirror) {
      ctx.translate(x + tileW + bleed, 0); ctx.scale(-1, 1);
      ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, tileW + bleed, VIEW_H);
    } else {
      ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, x, 0, tileW + bleed, VIEW_H);
    }
    ctx.restore();
  }
}

// Level 1: far mountain backdrop (slow parallax, looped) + transparent near
// foreground (1:1, the painted ledges + floating platforms) drawn on top.
function drawParallaxScene(lvl) {
  // 1) Background: fill the screen height, slow parallax, MIRROR-tiled so the
  //    distant range/clouds loop with no seam (the image isn't seamless on its
  //    own; flipping every other copy makes the edges match).
  if (imgLoaded[lvl.bg]) {
    const bg = images[lvl.bg], bw = bg.naturalWidth * (VIEW_H / bg.naturalHeight);
    const scroll = cameraX * 0.4, first = Math.floor(scroll / bw), bleed = 1;
    for (let i = first; ; i++) {
      const x = i * bw - scroll;
      if (x >= VIEW_W) break;
      const mir = (((i % 2) + 2) % 2) === 1;
      ctx.save();
      if (mir) {
        ctx.translate(x + bw + bleed, 0); ctx.scale(-1, 1);
        ctx.drawImage(bg, 0, 0, bg.naturalWidth, bg.naturalHeight, 0, 0, bw + bleed, VIEW_H);
      } else {
        ctx.drawImage(bg, 0, 0, bg.naturalWidth, bg.naturalHeight, x, 0, bw + bleed, VIEW_H);
      }
      ctx.restore();
    }
  }
  // 2) Foreground: 1:1, tiled normally (no mirror), transparent over the bg.
  if (imgLoaded[lvl.fg]) {
    const fg = images[lvl.fg];
    const tileW = lvl.tileW || ZUG_TILE_W;
    const first = Math.floor(cameraX / tileW);
    for (let i = first; ; i++) {
      const x = i * tileW - cameraX;
      if (x >= VIEW_W) break;
      ctx.drawImage(fg, 0, 0, fg.naturalWidth, fg.naturalHeight, x, 0, tileW + 1, VIEW_H);
    }
  }
}

// Swing ropes (Level 4): a rope sprite stretched from the anchor to Abu's hands
// (tracking the swing angle), hung from a snow-capped anchor rock.
function drawRopes() {
  const sw = player.swinging ? player.swing : null;
  for (const r of ropes) {
    const ax = r.x - cameraX;
    if (ax < -160 || ax > VIEW_W + 160) continue;
    const onThis = sw && sw.ax === r.x && sw.ay === r.top;
    const ex = onThis ? (player.x + player.w / 2 - cameraX) : ax;
    const ey = onThis ? player.y : r.bottom;
    const len = Math.max(8, Math.hypot(ex - ax, ey - r.top));
    // Per-rope art: the `alt` rope uses the silvery rope + wooden post anchor.
    const ropeKey = (r.alt && imgLoaded.rope2) ? "rope2" : "rope";
    const rockKey = (r.alt && imgLoaded.ropeRock2) ? "ropeRock2" : "ropeRock";
    if (imgLoaded[ropeKey]) {
      const ang = Math.atan2(ey - r.top, ex - ax) - Math.PI / 2;  // sprite hangs along +y
      ctx.save();
      ctx.translate(ax, r.top); ctx.rotate(ang);
      ctx.drawImage(images[ropeKey], -5, 0, 10, len);
      ctx.restore();
    } else {
      ctx.strokeStyle = "#caa15a"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(ax, r.top); ctx.lineTo(ex, ey); ctx.stroke();
    }
    // Anchor sits on the anchor point, its tie-off meeting the rope top. The wooden
    // post's tie-off knot hangs lower-right in its sprite, so it's drawn lower and
    // nudged left so the knot lands on the rope.
    if (imgLoaded[rockKey]) {
      const img = images[rockKey], rkW = 76, rkH = rkW * img.naturalHeight / img.naturalWidth;
      const drop = r.alt ? 42 : 14, shift = r.alt ? 20 : 0;
      ctx.drawImage(img, ax - rkW / 2 - shift, r.top - rkH + drop, rkW, rkH);
    } else {
      ctx.fillStyle = "#7a5a28"; ctx.fillRect(ax - 6, r.top - 4, 12, 6);
    }
  }
}

// Descent ropes hung off platform ends (Level 1): a rope stretched to the ground
// with an eye-bolt anchor at the platform edge.
function drawDescentRopes() {
  for (const dr of descentRopes) {
    const sx = dr.x - cameraX;
    if (sx < -40 || sx > VIEW_W + 40) continue;
    const len = dr.bottom - dr.top;
    if (imgLoaded.descendRope) ctx.drawImage(images.descendRope, sx - 3, dr.top, 6, len);   // thinner rope
    else { ctx.strokeStyle = "#caa15a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx, dr.top); ctx.lineTo(sx, dr.bottom); ctx.stroke(); }
    if (imgLoaded.descendAnchor) {
      const img = images.descendAnchor, aw = 24, ah = aw * img.naturalHeight / img.naturalWidth;
      ctx.drawImage(img, sx - aw / 2, dr.top - ah + 8, aw, ah);   // anchor sits at the platform edge
    }
  }
}

// Wooden hut sitting on Level 1's 3rd platform — a safe refuge that refills power.
const SHELTER_H = 72;   // hut draw height (sits on the platform top)
function drawShelters() {
  if (!imgLoaded.shelter) return;
  const img = images.shelter, sw = SHELTER_H * img.naturalWidth / img.naturalHeight;
  for (const s of shelters) {
    const sx = s.cx - cameraX;
    if (sx < -sw || sx > VIEW_W + sw) continue;
    ctx.drawImage(img, sx - sw / 2, s.top - SHELTER_H + 4, sw, SHELTER_H);   // hut base on the platform top
  }
}

function drawPlatforms() {
  // On natural levels the platforms are painted into the foreground art; the
  // collision boxes are invisible, so don't draw them.
  if (currentLevel().terrain === "natural") return;
  for (const p of platforms) {
    const sx = p.x - cameraX;
    if (sx > VIEW_W || sx + p.w < 0) continue;

    ctx.save();
    if (imgLoaded.platform) {
      // Tile the stone texture across the platform width.
      const img = images.platform;
      const tileW = img.naturalWidth * (p.h / img.naturalHeight);
      let drawn = 0;
      while (drawn < p.w) {
        const w = Math.min(tileW, p.w - drawn);
        const sw = img.naturalWidth * (w / tileW);
        ctx.drawImage(img, 0, 0, sw, img.naturalHeight, sx + drawn, p.y, w, p.h);
        drawn += w;
      }
    } else {
      ctx.fillStyle = "#7a756d"; ctx.fillRect(sx, p.y, p.w, p.h);
    }

    // Type cues so the player can read each platform at a glance.
    if (p.kind === "mover") {
      ctx.strokeStyle = "rgba(120,220,255,0.9)"; ctx.lineWidth = 2;
      ctx.strokeRect(sx + 1, p.y + 1, p.w - 2, p.h - 2);
      ctx.fillStyle = "rgba(120,220,255,0.95)";
      const cyp = p.y + p.h / 2;
      if (p.axis === "y") {  // up/down chevrons
        const mx = sx + p.w / 2;
        ctx.beginPath(); ctx.moveTo(mx - 6, cyp + 2); ctx.lineTo(mx, cyp - 5); ctx.lineTo(mx + 6, cyp + 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(mx - 6, cyp - 2); ctx.lineTo(mx, cyp + 5); ctx.lineTo(mx + 6, cyp - 2); ctx.fill();
      } else {               // left/right chevrons
        ctx.beginPath(); ctx.moveTo(sx + 10, cyp - 6); ctx.lineTo(sx + 4, cyp); ctx.lineTo(sx + 10, cyp + 6); ctx.fill();
        ctx.beginPath(); ctx.moveTo(sx + p.w - 10, cyp - 6); ctx.lineTo(sx + p.w - 4, cyp); ctx.lineTo(sx + p.w - 10, cyp + 6); ctx.fill();
      }
    }
    ctx.restore();
  }
}

// Empty holes — a dark chasm carved into the ground over each pit span.
function drawPits() {
  const top = GROUND_Y;
  for (const pit of pits) {
    const sx = pit.x - cameraX;
    if (sx > VIEW_W || sx + pit.w < 0) continue;
    const g = ctx.createLinearGradient(0, top, 0, VIEW_H);
    g.addColorStop(0, "#2a241e"); g.addColorStop(0.4, "#140f0b"); g.addColorStop(1, "#000000");
    ctx.fillStyle = g; ctx.fillRect(sx, top, pit.w, VIEW_H - top);
    // Inner edge shadow so the rim reads as a carved hole.
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(sx, top, 4, VIEW_H - top);
    ctx.fillRect(sx + pit.w - 4, top, 4, VIEW_H - top);
  }
}


function drawCarabiners() {
  for (const c of carabiners) {
    const sx = c.x - cameraX;
    if (sx > VIEW_W || sx + c.w < 0) continue;
    const bob = Math.sin(performance.now() / 300 + c.t) * 3;
    if (imgLoaded.carabiner) ctx.drawImage(images.carabiner, sx, c.y + bob, c.w, c.h);
    else {
      // Fallback: a metallic-grey oblong ring (carabiner shape).
      const cx = sx + c.w / 2, cy = c.y + c.h / 2 + bob;
      ctx.lineWidth = Math.max(3, c.w * 0.28); ctx.strokeStyle = "#aeb6c2";
      ctx.beginPath();
      ctx.ellipse(cx, cy, c.w / 2 - 1, c.h / 2 - 1, 0, 0, 6.28);
      ctx.stroke();
      ctx.fillStyle = "#d94f44";  // gate spring dot
      ctx.beginPath(); ctx.arc(cx + c.w / 2 - 2, c.y + bob + 4, 2.5, 0, 6.28); ctx.fill();
    }
  }
}

// Procedural slither: draw a single side-on snake sprite in vertical slices, each
// pushed up/down by a traveling sine wave so the body undulates head-to-tail.
// Per-enemy phase desyncs them; falls back to the static sprite if not loaded.
function drawEnemyAnim(e, dx, dy, dw, dh) {
  const a = e.anim;
  if (!a || !imgLoaded[a.key]) { drawSprite("enemy", dx, dy, dw, dh, e.color); return; }
  const img = images[a.key];
  const sw = img.naturalWidth, sh = img.naturalHeight;
  const N = a.slices || 24, amp = a.amp || 3, waves = a.waves || 2, speed = a.speed || 5;
  const t = performance.now() / 1000;
  const ssw = sw / N, dsw = dw / N;
  const conform = a.conform !== false;   // each slice rests on the ground at its own x
  // Per-slice ground height, then SMOOTHED: a sharp terrain step or a tile seam
  // would otherwise drop adjacent slices far apart and tear the snake into two
  // pieces — smoothing makes the body bend over it in one continuous run.
  let floor = null;
  if (conform) {
    floor = new Array(N);
    for (let i = 0; i < N; i++) floor[i] = enemyFloorY(e.x + ((i + 0.5) / N) * e.w);
    for (let pass = 0; pass < 6; pass++) {
      const cp = floor.slice();
      for (let i = 0; i < N; i++)
        floor[i] = (cp[Math.max(0, i - 1)] + cp[i] + cp[Math.min(N - 1, i + 1)]) / 3;
    }
  }
  for (let i = 0; i < N; i++) {
    // Upward-biased wave (range [-2amp, 0]) so the belly stays planted and the
    // body humps up between contacts — never floats.
    const off = amp * (Math.sin((i / N) * waves * 6.2832 - t * speed + (e.phase || 0)) - 1);
    const top = conform ? (floor[i] - dh + off) : (dy + off);
    ctx.drawImage(img, i * ssw, 0, ssw, sh, dx + i * dsw, top, dsw + 1, dh);
  }
}

function drawEnemies() {
  for (const e of enemies) {
    const sx = e.x - cameraX;
    if (sx > VIEW_W || sx + e.w < 0) continue;

    const lvl = currentLevel();
    // Resolve this enemy's animation, most-specific first: a per-CREATURE strip
    // (Level 5 gauntlet), then a per-TYPE strip (Level 4 wolves+falcons), then the
    // level-wide enemyFrames (single-creature levels).
    const frames = e.frames || (lvl.enemyTypeFrames && lvl.enemyTypeFrames[e.type]) || lvl.enemyFrames;
    // Whether this enemy draws its own art (frame strip or animated sprite) — if so,
    // skip the generic glow / triangle-wings / armour-plate overlays.
    const hasArt = !!frames || !!e.anim;

    // Flapping wings behind a flyer (skipped when a frame-animated flyer sprite is used).
    if (e.type === "flyer" && !frames) {
      const flap = Math.sin(performance.now() / 90) * 6;
      const wy = e.y + e.h * 0.4;
      ctx.fillStyle = "rgba(232,228,255,0.9)";
      ctx.beginPath();
      ctx.moveTo(sx + 4, wy); ctx.lineTo(sx - 16, wy - 11 + flap); ctx.lineTo(sx - 16, wy + 11 + flap);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(sx + e.w - 4, wy); ctx.lineTo(sx + e.w + 16, wy - 11 + flap); ctx.lineTo(sx + e.w + 16, wy + 11 + flap);
      ctx.closePath(); ctx.fill();
    }

    const spriteKey = lvl.enemySprite || "enemy";
    const customSprite = spriteKey !== "enemy";
    // A soft type-coloured glow so each variety reads at a glance (skip it for a
    // detailed per-level sprite like the bear, where it just muddies the art).
    if (e.type !== "walker" && !customSprite && !hasArt) {
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = e.color;
      const gx = sx + e.w / 2, gy = e.y + e.h / 2;
      const gr = Math.max(e.w, e.h) * 0.62;
      const grad = ctx.createRadialGradient(gx, gy, gr * 0.3, gx, gy, gr);
      grad.addColorStop(0, e.color);
      grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(gx, gy, gr, 0, 6.2832); ctx.fill();
      ctx.restore();
    }

    // Body. Hoppers squash/stretch with vertical speed.
    let dw = e.w, dh = e.h, dy = e.y;
    if (e.type === "hopper") {
      const stretch = e.vy < -40 ? 1.12 : (e.vy > 80 ? 0.9 : 1);
      dh = e.h * stretch; dw = e.w * (2 - stretch); dy = e.y + (e.h - dh);
    }
    const walk = e.walk || lvl.enemyWalk;
    if (e.anim) {
      drawEnemyAnim(e, sx + (e.w - dw) / 2, dy, dw, dh);
    } else if (frames && imgLoaded[frames.key]) {
      // Frame-based animation strip (4-frame bear walk, gyrfalcon flap, …): step
      // through the strip at a fixed fps, desynced per enemy via its phase.
      const img = images[frames.key];
      const count = frames.count || 4, fps = frames.fps || 7;
      const cellW = img.naturalWidth / count, cellH = img.naturalHeight;
      const fi = Math.floor(performance.now() / 1000 * fps + (e.phase || 0) * 2) % count;
      // Draw at the frame's true aspect so nothing is squashed; `scale` lets a
      // wide-winged sprite spill beyond its (smaller) hitbox.
      const drawW = dw * (frames.scale || 1);
      const drawH = drawW / (frames.aspect || (cellW / cellH));
      const cx = sx + e.w / 2;
      let topY;
      if (frames.anchor === "center") {
